# SLO catalog — the single source for every published performance number (ADR-0248).
#
# Every entry carries exactly one status:
#   gated    — a CI/release gate enforces it; `gate` names the test, `tier` the CI job.
#              The gate test READS ITS THRESHOLD FROM THIS FILE, so the catalog and the
#              gate cannot disagree.
#   measured — observed on a stated date/commit/hardware; expires at `revalidate_by`
#              (the guard test fails once that date passes — stale claims age out
#              visibly, they do not fossilize).
#   target   — aspiration; explicitly not a promise.
#
# Units are seconds unless stated. docs/slo.md is GENERATED from this file by
# scripts/gen_slo_docs.py — edit here, then `python scripts/gen_slo_docs.py`.

schema_version = 1

