# --- measured: the 2026-08-28 Azure campaign ------------------------------
# Seven numbers from the paper campaign (ADR-0255). All were produced on
# ephemeral Azure VMs that the campaign plan destroys, so `hardware` names a
# machine that will not exist at `revalidate_by`. That is deliberate and is why
# each entry's `source` points at the harvested artifact rather than at a host:
# re-validating these means re-provisioning equivalent VMs and re-running the
# harness, not sshing anywhere. The raw artifacts and their SHA-256 manifests are
# kept in the private research record, not published here (see the docs honesty
# rule): the number and its workload are the contract, the harvest is the audit
# trail behind it.

[[entry]]
id = "capture.absolute-overhead.mean"
title = "Absolute wall-clock cost of full capture, independent of workload length"
status = "measured"
value = 4.56
unit = "s"
workload = "7-point compute sweep 3M-400M (61.8x baseline range), n=30 reps/point, ascending; sd 0.29 s, CV 0.064. Reverse-order control over the same 7 points agrees at 4.34 s (4.8% apart) with a tighter spread, so run order does not produce it."
hardware = "Azure Standard_D8s_v5 (8 vCPU), westeurope, nova-runner"
measured_on = 2026-08-28
revalidate_by = 2027-03-01
source = "c1_asc.json + c1_desc.json from the 2026-08-28 campaign (private research record)"

