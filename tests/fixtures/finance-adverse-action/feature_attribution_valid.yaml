    feature: delinquency_count_24m
    reason_code: RC-07
    description: Number of recent delinquencies
    contribution: -0.18
  - rank: 1
    feature: debt_to_income
    reason_code: RC-03
    description: Debt-to-income ratio too high
    contribution: -0.31
  - rank: 3
    feature: credit_history_months
    reason_code: RC-11
    description: Length of credit history insufficient
    contribution: -0.07
