services:
  postgres:
    image: postgres:16-alpine
    container_name: novafabric-test-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: novafabric_test
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20

  pgbouncer:
    image: bitnami/pgbouncer:1.22.1
    container_name: novafabric-test-pgbouncer
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DATABASE: novafabric_test
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: testpass
      PGBOUNCER_DATABASE: novafabric_test
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "100"
      PGBOUNCER_DEFAULT_POOL_SIZE: "1"
      PGBOUNCER_AUTH_TYPE: trust
    ports:
      - "16432:6432"
    depends_on:
      postgres:
        condition: service_healthy
