# pgBouncer config for the FR-08 cross-tenant-isolation rig (tests/metadata_store/
# test_cross_tenant_isolation_pgbouncer.py, tc-005b).
#
# Bind-mounted over the image's auto-generated pgbouncer.ini (docker-compose.eval.yaml)
# because the one thing the env-var template cannot express is what this rig actually
# needs: server_reset_query DISABLED.
#
# pgBouncer's own compiled-in default is `server_reset_query = DISCARD ALL`, which runs
# on every connection release *regardless* of `server_reset_query_always` when a client
# fully disconnects after its transaction — verified empirically 2026-07-29: with the
# default in place, a session-scoped `SET` never survives to a different client
# connection even under `pool_mode=transaction, default_pool_size=1`, which made this
# rig's mutant test structurally unable to observe the vulnerability it exists to catch,
# independent of any Docker-image issue. Disabling server_reset_query here isn't a
# weaker test config — it's what makes the rig actually simulate the misconfigured/
# unpatched pgBouncer this ADR's SET LOCAL requirement defends against.
[databases]
novafabric_test = host=postgres port=5432 auth_user=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_file = /etc/pgbouncer/userlist.txt
auth_type = plain
pool_mode = transaction
max_client_conn = 100
default_pool_size = 1
admin_users = postgres
ignore_startup_parameters = extra_float_digits
server_reset_query =
