<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <!--
      Product-local `/` for `nova serve --experimental` (ADR-0299). The wheel
      ships the dashboard only; the public pages live on https://novafabric.ai.
      Forward to the dashboard and keep ?token=… and any #fragment, which a
      plain meta refresh would drop. Works offline.
    -->
    <script>
      location.replace('/dashboard/' + location.search + location.hash);
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=/dashboard/" /></noscript>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NovaFabric — local dashboard</title>
    <style>
      :root { color-scheme: dark light; --bg: #0a0a0c; --text: #e6e6ea; --muted: #a8a8b3; }
      @media (prefers-color-scheme: light) { :root { --bg: #fbfbfc; --text: #14141a; --muted: #4a4a55; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
             color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
      a { color: inherit; }
      p { color: var(--muted); padding: 0 16px; text-align: center; }
    </style>
  </head>
  <body>
    <p>Opening the <a href="/dashboard/">NovaFabric dashboard</a>…</p>
  </body>
</html>
