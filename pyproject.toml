[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novafabric"
version = "0.101.0"
description = "Open-source AI Asset Registry and Agent Lifecycle Management"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Mohsen Seyedkazemi Ardebili"},
]
# Mirrors CITATION.cff's keyword list — single source of intent, two files.
keywords = [
    "ai-agents",
    "llm",
    "observability",
    "reproducibility",
    "provenance",
    "lineage",
    "replay",
    "ai-governance",
    "evidence",
    "opentelemetry",
]
# Kept intentionally narrow and CI-verifiable: only claim what the CI matrix
# (.github/workflows/ci.yml, ubuntu-latest / Python 3.12 only) actually tests.
# Do not add "Programming Language :: Python :: 3.13" or any non-Linux OS
# classifier until CI grows a matrix that exercises them.
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    # The previous `<0.26` ceiling rested on a misdiagnosis, corrected 2026-08-08.
    # It claimed typer 0.27.x "registers no subcommands" and would ship "a
    # completely non-functional CLI". Measured on both versions, `nova --help`
    # lists the same 123 commands, `nova seal verify --help` resolves, and a
    # `nova capture` round-trip succeeds. What actually broke was introspection:
    # typer 0.27 vendors its own Click, so TyperGroup no longer inherits from the
    # installed click.Group and five copies of an isinstance-based walk each saw a
    # one-command CLI. Fixed by novafabric.cli.introspect, which duck-types on
    # `.commands` and refuses to return an empty tree. See ADR-0250.
    # The ceiling stays to keep major Typer jumps deliberate — raise it after
    # running tests/cli/test_introspect.py against the new version.
    "typer>=0.27.1,<0.28",
    "pydantic>=2.11",
    "PyYAML>=6.0",
    "rich>=13.9",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-semantic-conventions>=0.50b0",
    "httpx>=0.28",
    "jinja2>=3.1",
    "python-ulid>=2.7.0",
    "jsonschema>=4.23.0",
    "deepdiff>=8.0",
    "cryptography>=48.0.1",
    # jcs (MIT) — RFC 8785 JSON Canonicalization Scheme for proposal_digest computation.
    # Tier A under ADR-0024.
    "jcs>=0.2",
    # networkx (BSD-3-Clause) — Tier A under ADR-0024.  STAYS IN CORE, unlike
    # duckdb/pyarrow/python-louvain/clickhouse-connect which ADR-0222 moved out
    # to extras.  Reason (verified, not assumed): networkx is imported EAGERLY
    # at CLI start-up — cli/main.py -> cli/insights.py ->
    # lineage/analytics/__init__.py -> centrality.py — and it backs the default,
    # non-optional `nova insights` and `nova lineage` commands.  It is also the
    # implementation behind `nx.community.louvain_communities` used by
    # lineage/analytics/insights.py (networkx's own Louvain, NOT python-louvain).
    # Moving it to an extra would break `nova --help` on a plain install.
    # See design/adr/0222-default-install-dependency-tier-reclassification.md.
    "networkx>=3.6.1",
    # NOTE (ADR-0222 OQ-2): `pyjwt` and `python-multipart` used to be pinned
    # here *and* in the `server` extra. They are declared once now, in `server`,
    # because that is the only tier that needs them: `import jwt` appears only
    # under `src/novafabric/server/`, `python-multipart` is a runtime
    # requirement of FastAPI's form parsing and is never imported directly, and
    # neither is loaded at CLI start-up (verified, not assumed — the same check
    # that kept `networkx` in core above).
]

[project.urls]
Homepage = "https://novafabric.ai"
Documentation = "https://github.com/MSKazemi/novafabric/blob/main/docs/getting-started.md"
Repository = "https://github.com/MSKazemi/novafabric"
Changelog = "https://github.com/MSKazemi/novafabric/blob/main/CHANGELOG.md"
Issues = "https://github.com/MSKazemi/novafabric/issues"

[project.optional-dependencies]
saml = [
    # SAML SSO assertion verification (ADR-0138). Both Tier A under ADR-0024
    # (transitive tree verified 2026-07-25: signxml Apache-2.0, lxml BSD-3-Clause;
    # cryptography + certifi are already present). This clears the ADR-0138 §D5
    # "no XML-signature library has cleared the license gate" premise.
    # signxml (Apache-2.0) — XML-DSIG verification, XSW-resistant verify-then-use.
    "signxml>=5.1.0",
    # lxml (BSD-3-Clause) — XXE-hardenable XML parser (no DTD/entities/network).
    "lxml>=5.2.1",
]
scale = [
    # Evidence Fabric v1.0 infrastructure extras (ADR-0066, cap-001..009).
    # All Tier A licenses under ADR-0024.
    # nats-py (Apache-2.0) — NATS JetStream pull consumer for LineageConsumer (cap-006).
    "nats-py>=2.9.0",
    # clickhouse-connect (Apache-2.0) — ClickHouse sink for cost attribution (cap-002).
    "clickhouse-connect>=0.8.0",
    # fastavro (MIT) — Avro serialisation for capsule event schemas (cap-001).
    "fastavro>=1.9.7",
    # pyiceberg (Apache-2.0) — Iceberg table format for object capsule store (cap-009).
    "pyiceberg>=0.7.0",
    # blake3 (Apache-2.0/CC0-1.0) — BLAKE3 digest for dual-object store (cap-003).
    "blake3>=0.4.1",
    # boto3 (Apache-2.0) — S3-API abstraction for NovaObjectStore (cap-009).
    "boto3>=1.35.0",
    # duckdb (MIT) — in-process store behind evidence_fabric/duckdb_accumulator.py
    # and evidence_fabric/rebuild.py.  Moved here from [project.dependencies] by
    # ADR-0222: every duckdb import site is already extra-gated code.
    "duckdb>=1.5.2",
    # pyarrow (Apache-2.0) — Parquet/Arrow for evidence_fabric/pii_table.py
    # (Iceberg-compatible PII event log) and the LineageConsumer Parquet sink.
    # Moved here from [project.dependencies] by ADR-0222.
    "pyarrow>=24.0.0",
]
worm-s3 = [
    # boto3 (Apache-2.0) — Tier A under ADR-0024.
    "boto3>=1.38",
]
worm-azure = [
    # azure-storage-blob (MIT) — Tier A under ADR-0024.
    "azure-storage-blob>=12.25",
]
worm-gcs = [
    # google-cloud-storage (Apache-2.0) — Tier A under ADR-0024.
    "google-cloud-storage>=3.13.0",
]
seal-aws = [
    # boto3 (Apache-2.0) — Tier A under ADR-0024.
    # AWS KMS backend for NovaSeal Cloud KMS dual-mode signing (B-7).
    "boto3>=1.38.0",
]
seal-azure = [
    # azure-keyvault-keys (MIT) + azure-identity (MIT) — Tier A under ADR-0024.
    # Azure Key Vault backend for NovaSeal Cloud KMS dual-mode signing (B-7).
    "azure-keyvault-keys>=4.9.0",
    "azure-identity>=1.20.0",
]
seal-gcp = [
    # google-cloud-kms (Apache-2.0) — Tier A under ADR-0024.
    # GCP Cloud KMS backend for NovaSeal Cloud KMS dual-mode signing (B-7).
    "google-cloud-kms>=3.3.0",
]
sigstore = [
    # sigstore (Apache-2.0) — Tier A under ADR-0024.
    # Keyless signing backend for novafabric[sigstore] optional extra (ADR-0071).
    "sigstore>=4.5.0",
]
spkg = [
    # Security & Provenance Knowledge Graph (SPKG) — ADR-0111, Phase P1.
    # All Tier A under ADR-0024 (independently license-verified 2026-07-02).
    # rdflib (BSD-3-Clause) — RDF graph + PROV-O serialization for the canonical layer.
    "rdflib>=7.1.0",
    # pyshacl (Apache-2.0) — SHACL shape validation of provenance triples on ingest (R11).
    "pyshacl>=0.29.0",
    # kuzu (MIT) — embedded openCypher LPG store for the SPKG operational view (ADR-0111 D2);
    # same engine as the KuzuDB lineage tier (ADR-0053/0109). Reused, not a second store.
    "kuzu>=0.11.3",
    # NOTE (ADR-0024): Splink was evaluated for SP-3 entity resolution but REJECTED as a
    # runtime dep — Splink 4.x hard-depends on igraph (GPL-2.0, Tier C). Cross-vendor ER is
    # implemented in-house (stdlib difflib Fellegi-Sunter + union-find) with zero non-Tier-A
    # deps. See kg/spkg/entity_resolution.py and ADR-0111 §License verification.
]
seal-postgres = [
    # psycopg3 (LGPL-3.0) — Tier B under ADR-0024.  Same justification as
    # the [server] extra: the only actively maintained async/sync-capable
    # Postgres driver; distributed as an optional extra per LGPL requirements.
    # Enables PostgresMerkleLog for NovaSeal Merkle log at > 1M entries (Scale-S4).
    "psycopg[binary]>=3.2",
]
serve = [
    # Experimental local dashboard, gated behind `nova serve --experimental`.
    # Per ADR-0027 — opt-in install: `pip install novafabric[serve]`.
    # Both Tier A under ADR-0024 (FastAPI: MIT, uvicorn: BSD-3-Clause).
    # Upper bound is deliberate. fastapi 0.141.x (starlette 1.4) changes route
    # mounting and the path exposed to middleware: the holds router stops mounting,
    # the Prometheus route label regresses from template to raw path, and two
    # self-trace privacy assertions fail. Found 2026-08-05 testing the dependabot
    # bulk upgrade. Raise only with tests/test_server_observability.py and
    # tests/test_server_selftrace.py green.
    "fastapi>=0.115,<0.137",
    "uvicorn[standard]>=0.32",
    # --- Live Topology Dashboard backing stores (moved out of core by ADR-0222) ---
    # duckdb (MIT) — the in-process ClusterStore behind
    # serve/topology/cluster_store.py (dashboard ADR-003).
    "duckdb>=1.5.2",
    # pyarrow (Apache-2.0) — Arrow IPC encoder for the binary ADS topology
    # frames in serve/topology/ads_encoder.py.
    "pyarrow>=24.0.0",
    # python-louvain (BSD-3-Clause) — `import community`; the Louvain community
    # detection pass in serve/topology/topology_extractor.py.  This is the ONLY
    # import site of `community` in the tree; lineage/analytics/insights.py uses
    # networkx's own nx.community.louvain_communities instead.
    "python-louvain>=0.16",
]
federation = [
    # Cross-site federation endpoints (Phase 6 Track C).
    # fastapi (MIT) — Tier A under ADR-0024.
    # httpx is NOT re-listed: it is a core dependency, so it is always present.
    # (ADR-0222 OQ-2 — declare each dependency once, in the lowest tier that
    # actually needs it.)
    # Upper bound is deliberate. fastapi 0.141.x (starlette 1.4) changes route
    # mounting and the path exposed to middleware: the holds router stops mounting,
    # the Prometheus route label regresses from template to raw path, and two
    # self-trace privacy assertions fail. Found 2026-08-05 testing the dependabot
    # bulk upgrade. Raise only with tests/test_server_observability.py and
    # tests/test_server_selftrace.py green.
    "fastapi>=0.115,<0.137",
]
server = [
    # Multi-user server mode (v0.7). Optional install: `pip install novafabric[server]`.
    # FastAPI (MIT) + uvicorn (BSD-3-Clause) — Tier A under ADR-0024.
    # Upper bound is deliberate. fastapi 0.141.x (starlette 1.4) changes route
    # mounting and the path exposed to middleware: the holds router stops mounting,
    # the Prometheus route label regresses from template to raw path, and two
    # self-trace privacy assertions fail. Found 2026-08-05 testing the dependabot
    # bulk upgrade. Raise only with tests/test_server_observability.py and
    # tests/test_server_selftrace.py green.
    "fastapi>=0.115,<0.137",
    "uvicorn[standard]>=0.32",
    # python-multipart (Apache-2.0) — Tier A under ADR-0024.  Required by FastAPI
    # for multipart/form-data upload endpoints (capsule upload).
    "python-multipart>=0.0.31",
    # psycopg3 (LGPL-3.0) — Tier B under ADR-0024.  Justification: the only
    # actively maintained async-capable Postgres driver; LGPL requires
    # distributing as a separate optional extra, not bundled in the default install.
    # See ADR-0016 (storage) for the Postgres backend design decision.
    "psycopg[binary]>=3.2",
    # psycopg_pool (LGPL-3.0) — Tier B under ADR-0024.  First-party connection
    # pool for psycopg, same license/justification as psycopg itself; enables the
    # opt-in metadata-store pool (ADR-0221) that removes the per-request connect.
    "psycopg_pool>=3.2",
    # alembic (MIT) — Tier A under ADR-0024.  Schema migration for both SQLite
    # and Postgres tracks.
    "alembic>=1.14",
    # PyJWT (MIT) — Tier A under ADR-0024.  JWT creation and validation for
    # OIDC Bearer tokens and ed25519 offline tokens (ADR-0018).
    # Cryptography extras are provided by the 'cryptography' core dependency.
    "PyJWT>=2.13.0",
    # sqlalchemy (MIT) — Tier A under ADR-0024.  ORM + Core used by the Phase 5
    # MetadataStore (ADR-0040) for both SQLite local mode and Postgres server mode.
    "sqlalchemy>=2.0",
    # asyncpg (Apache-2.0) — Tier A under ADR-0024.  High-performance async Postgres
    # driver; required by sqlalchemy[asyncio] for the MetadataStore async session pool.
    "asyncpg>=0.30",
    # prometheus-client (Apache-2.0) — Tier A under ADR-0024.  Prometheus text
    # exposition for the self-observability surface (/metrics, ADR-0182).
    # Lazy import: lean installs never load it; /metrics 503s with an install hint.
    "prometheus-client>=0.21",
]
lineage-kuzu = [
    # kuzu (MIT) — Tier A under ADR-0024.  Embedded openCypher graph DB for
    # the KuzuDB v2 lineage tier (Phase 6 D-1, ADR-0053).
    # Production-candidate pending depth-5 p99 < 500ms at 10M edges (cap-003).
    "kuzu>=0.11.3",
]
janusgraph = [
    # gremlinpython (Apache-2.0) — Tier A under ADR-0024.  Gremlin Python client
    # for the JanusGraph v3 lineage tier (distributed graph DB, ADR-0053).
    # Lazy import only — not required for local or KuzuDB tiers.
    "gremlinpython>=3.7.0",
]
lineage-migration = [
    # pyarrow (Apache-2.0) — Tier A under ADR-0024.  Parquet read/write for
    # the lineage migration kit (Phase 6 E-1..E-3, ADR-0022 derived-index pattern).
    "pyarrow>=24.0.0",
]
compliance = [
    # presidio-analyzer (MIT) — Tier A under ADR-0024.  NLP-based PII detection
    # for cap-001 (GDPR Art.17 erasure support).  Lazy import only — not required
    # for RegexDetector default path.
    "presidio-analyzer>=2.2",
    # weasyprint (BSD-2-Clause) — Tier A under ADR-0024.  PDF rendering for
    # cap-002 Annex IV technical documentation export.  Lazy import only —
    # JSON-LD export works without it.
    "weasyprint>=60.0",
]
scale-kg = [
    # kuzu (MIT) — Tier A under ADR-0024.  Embedded openCypher graph DB for
    # the Capsule Knowledge Graph secondary derived artifact (ADR-0067).
    # SEPARATE KuzuDB instance from the lineage graph.
    "kuzu>=0.11.3",
    # cachetools (MIT) — Tier A under ADR-0024.  TTLCache for AliasTableResolver
    # (Tier-2 entity resolution hot path, ADR-0067 v1.2).
    "cachetools>=5.5",
]
ocs-compress = [
    # zstandard (BSD-3-Clause) — Tier A under ADR-0024.  Zstd dictionary-based
    # compression for the Object Capsule Store (cap-005).  Lazy import — not
    # required for the default (uncompressed) path.
    "zstandard>=0.23.0",
]
openai-agents = [
    # openai-agents (MIT) — OpenAI Agents SDK tracing processor adapter (E-5).
    # Tier A under ADR-0024.
    "openai-agents>=0.17.3",
]
google-adk = [
    # google-adk (Apache-2.0) — Google ADK BasePlugin adapter (E-6).
    # Tier A under ADR-0024.
    "google-adk>=1.34.0",
]
bedrock-agentcore = [
    # boto3 (Apache-2.0) — AWS Bedrock AgentCore client wrapper (E-7).
    # Tier A under ADR-0024.
    "boto3>=1.43.10",
]
a2a = [
    # a2a-sdk (Apache-2.0) — A2A ClientCallInterceptor adapter (E-8).
    # Tier A under ADR-0024.
    "a2a-sdk>=1.0.3",
]
watch = [
    # watchdog (Apache-2.0) — Tier A under ADR-0024.
    # Filesystem event notifications (inotify/FSEvents/kqueue) for CapsuleWatcher.
    # Optional: polling backend is always available without this extra.
    # Install: pip install 'novafabric[watch]'
    "watchdog>=4.0.0",
]
otlp = [
    # opentelemetry-proto (Apache-2.0) — Tier A under ADR-0024.
    # Decodes binary OTLP ExportTraceServiceRequest for OTLP/protobuf ingest (ADR-0177).
    "opentelemetry-proto>=1.20",
]
query = [
    # duckdb (MIT) — Tier A under ADR-0024.
    # OPTIONAL ACCELERATOR ONLY.  `nova query` builds its derived index on
    # DuckDB when it is importable and transparently falls back to the stdlib
    # `sqlite3` engine when it is not (query/engine.py::_detect_engine); the
    # result rows are identical either way and the engine actually used is
    # reported in the result's `index.engine` field.  Installing this extra is
    # a performance choice, never a correctness one.  See ADR-0222.
    "duckdb>=1.5.2",
]
clickhouse = [
    # clickhouse-connect (Apache-2.0) — Tier A under ADR-0024.
    # Narrow single-package extra so `pip install novafabric[clickhouse]` —
    # already the install hint raised by
    # evidence_fabric/clickhouse_accumulator.py's ImportError — actually
    # resolves (it did not before this extra existed: phantom-extra bug).
    # As of ADR-0222 clickhouse-connect is no longer also an unconditional
    # [project.dependencies] entry, so this extra is now load-bearing: it (or
    # the wider `scale` extra, which pins the same package for the same
    # purpose) is the only way to get ClickHouse cost attribution.
    "clickhouse-connect>=0.8.0",
]
nats = [
    # nats-py (Apache-2.0) — Tier A under ADR-0024.
    # Narrow single-package extra so `pip install novafabric[nats]` — already
    # the install hint raised by evidence_fabric/nats_consumer.py's
    # ImportError — actually resolves (phantom-extra bug fix). Version-aligned
    # with the `scale` extra above, which bundles the same package.
    "nats-py>=2.9.0",
]
avro = [
    # fastavro (MIT) — Tier A under ADR-0024.
    # Narrow single-package extra so `pip install novafabric[avro]` — already
    # the install hint raised by evidence_fabric/avro_serializer.py's
    # ImportError — actually resolves (phantom-extra bug fix). Version-aligned
    # with the `scale` extra above, which bundles the same package.
    "fastavro>=1.9.7",
]
energy-gpu = [
    # nvidia-ml-py (BSD-3-Clause) — Tier A under ADR-0024. Provides the
    # `pynvml` importable module used by energy/_readers.py's optional NVML
    # GPU energy reader (ADR-0093 §A1). This is the phantom-extra bug this
    # slice exists to fix directly: docs/releases/v0.55.0.md and v0.56.0.md
    # already tell users to `pip install 'novafabric[energy-gpu]'`, but the
    # extra did not exist until now.
    # NOTE (verified against PyPI metadata, not assumed): the distribution
    # literally named `pynvml` is upstream-deprecated (Development Status ::
    # 7 - Inactive) and no longer ships the `pynvml` module at all — only the
    # unrelated `pynvml_utils` demo helper. `nvidia-ml-py` is NVIDIA's own,
    # actively maintained package and is what actually provides `import
    # pynvml`; depending on the deprecated `pynvml` distribution here would
    # install a package that cannot satisfy the import it's meant to enable.
    "nvidia-ml-py>=13.610.43",
]
all = [
    # Aggregate escape hatch: a self-referencing PEP 508 extras list so
    # `pip install 'novafabric[all]'` restores the old "just install
    # everything" experience for anyone who relied on it, once a later slice
    # (S2) narrows the default/core install. Deliberately EXCLUDES:
    #   - cloud-vendor extras (worm-s3, worm-azure, worm-gcs, seal-aws,
    #     seal-azure, seal-gcp): each pulls in one specific cloud vendor's SDK
    #     (boto3 / azure-* / google-cloud-*) and a real deployment only ever
    #     needs one vendor — bundling all three by default is dead weight
    #     (and unwanted transitive surface) for every single installer.
    #   - agent-framework adapter extras (openai-agents, google-adk,
    #     bedrock-agentcore, a2a): each targets a distinct, mutually exclusive
    #     third-party agent framework; no installer runs all four at once.
    "novafabric[saml,scale,sigstore,spkg,seal-postgres,serve,federation,server,lineage-kuzu,janusgraph,lineage-migration,compliance,scale-kg,ocs-compress,watch,otlp,query,clickhouse,nats,avro,energy-gpu]",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # pytest-benchmark (BSD-2-Clause) — Tier A under ADR-0024.  Latency
    # benchmarking for the NovaSeal p99 CI gate (ADR-0041, tests/seal/test_benchmark.py).
    "pytest-benchmark>=4.0",
    # pytest-timeout (MIT) — Tier A under ADR-0024.  Suite-health: a hung test
    # fails by name instead of stalling the whole run (suite-health backlog item 2).
    "pytest-timeout>=2.4.0",
    # trove-classifiers (Apache-2.0) — Tier A under ADR-0024.  PyPI's own
    # canonical classifier registry; lets tests/packaging_metadata/test_project_metadata.py
    # validate pyproject.toml's `classifiers` list against real, spelled-correctly
    # trove strings instead of trusting them by inspection.
    "trove-classifiers>=2024.1.31",
    # pytest-xdist (MIT) — Tier A under ADR-0024.  Parallel test execution for
    # the 5.5K-test suite (suite-health backlog item 3); dev runs use `-n auto`.
    "pytest-xdist>=3.8.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
    "novafabric",
    "openapi-spec-validator>=0.8.5",
    # Phase 6 Track C — federation endpoint tests need FastAPI + httpx TestClient.
    # fastapi (MIT) + httpx (BSD-3-Clause) — Tier A under ADR-0024.
    # Upper bound is deliberate. fastapi 0.141.x (starlette 1.4) changes route
    # mounting and the path exposed to middleware: the holds router stops mounting,
    # the Prometheus route label regresses from template to raw path, and two
    # self-trace privacy assertions fail. Found 2026-08-05 testing the dependabot
    # bulk upgrade. Raise only with tests/test_server_observability.py and
    # tests/test_server_selftrace.py green.
    "fastapi>=0.115,<0.137",
    "httpx>=0.28",
    # Phase 4 — Object Capsule Store testing
    # boto3 (Apache-2.0) — S3/MinIO/Ceph WORM adapter + conformance suite.
    "boto3>=1.38",
    # hypothesis (MPL-2.0) — property-based tests for chain invariants (FR-03).
    # MPL-2.0 is Tier A under ADR-0024 for dev dependencies.
    "hypothesis>=6.115",
    # prometheus-client (Apache-2.0) — optional metrics instrumentation.
    "prometheus-client>=0.21",
    # Phase 5 — MetadataStore (ADR-0040) dev tooling
    # mutmut (BSD-2-Clause) — Tier A under ADR-0024.  Mutation testing for the
    # MetadataStore RLS and query invariants.
    # Upper bound is deliberate. mutmut 3.6 renamed the config keys AND changed
    # the execution model: it now runs pytest inside a `mutants/` tree holding
    # only `source_paths`, so this gate's curated single-file target makes the
    # invariant suites unimportable (`ModuleNotFoundError:
    # novafabric.metadata_store.interface`). Bumped 3.5.0 -> 3.7.0 by the
    # 2026-08-05 dependency refresh, which broke the FR-08 gate outright.
    # Migrating the gate to the new model is real work; raise the ceiling only
    # with `uv run mutmut run` green. Note that 3.5 does not work either — the
    # gate has never run on any mutmut 3.x. See issue #25.
    "mutmut>=3.0,<3.8",
    # sqlfluff (MIT) — Tier A under ADR-0024.  SQL linter for migration scripts
    # and raw DDL snippets in the MetadataStore.
    "sqlfluff>=3.0",
    # testcontainers (Apache-2.0) — Tier A under ADR-0024.  Spins up ephemeral
    # Postgres containers for MetadataStore integration tests.
    "testcontainers>=4.0",
    # psycopg3 (LGPL-3.0) — Tier B under ADR-0024.  Needed in dev group so that
    # MetadataStore integration tests can import PostgresMetadataStore without
    # installing the full [server] extra.
    "psycopg[binary]>=3.2",
    # --- Extras-only runtime deps that the TEST SUITE needs unconditionally ---
    # CI's `unit` job installs with `uv sync --frozen` (no `--all-extras`), so
    # the dev group is the only thing that puts these in the test environment.
    # Runtime-optional (ADR-0222 moved them out of [project.dependencies]);
    # dev/test-required because several test modules import the code they back
    # at module level, without an importorskip guard — e.g.
    # tests/test_topology_cluster_store.py and tests/test_topology_extractor.py
    # import serve/topology/*, and the ADR-0222 packaging tests need a baseline
    # where nothing is missing so the import-blocking sweep measures only what
    # the blocker removed. They also keep these modules inside the
    # `--cov-fail-under=90` gate and keep the DuckDB-vs-SQLite `nova query`
    # parity test (ADR-0222's central correctness claim) actually running in CI
    # rather than silently skipping.
    # pyarrow (Apache-2.0) — predates ADR-0222; same reason.
    "pyarrow>=24.0.0",
    # duckdb (MIT) — Tier A under ADR-0024. Extras: [scale]/[serve]/[query].
    "duckdb>=1.5.2",
    # python-louvain (BSD-3-Clause) — Tier A under ADR-0024. Extra: [serve].
    "python-louvain>=0.16",
    # clickhouse-connect (Apache-2.0) — Tier A under ADR-0024.
    # Extras: [scale]/[clickhouse].
    "clickhouse-connect>=0.8.0",
    # openai (Apache-2.0) — Tier A under ADR-0024.  Used by the
    # blackbox_demo example (examples/blackbox_demo/) and the OpenAI
    # capture hook tests.
    "openai>=2.37.0",
    # watchdog (Apache-2.0) — Tier A under ADR-0024.  Enables WatchdogBackend
    # tests (TestWatchdogBackend) to run in dev/CI rather than being skipped.
    # Runtime optional; installed here for coverage completeness.
    "watchdog>=4.0.0",
    # moto (Apache-2.0) — Tier A under ADR-0024.  In-process AWS mock; lets the
    # AWS KMS envelope-wrapping backend (ADR-0185) be tested without live cloud
    # credentials. Dev/test only — never a runtime dependency.
    "moto>=5.0",
    # signxml (Apache-2.0) + lxml (BSD) — Tier A under ADR-0024.  SAML XML-DSIG
    # verification (ADR-0138); in the dev group so the SAML ACS tests run in CI.
    "signxml>=5.1.0",
    "lxml>=5.2.1",
]

# ADR-0135 (experimental): reference masker for the pluggable PII masking
# pipeline. Third parties register theirs under the same group.
[project.entry-points."novafabric.maskers"]
novafabric-email = "novafabric.masking.examples:EmailMasker"

[project.entry-points."novafabric.eval_suites"]
novafabric-smoke-v1 = "novafabric.evals.suites.smoke:SmokeAdapter"
gaia-v1 = "novafabric.evals.suites.gaia:GaiaAdapter"
mmlu-v1 = "novafabric.evals.suites.mmlu:MmluAdapter"
truthful-qa-v1 = "novafabric.evals.suites.truthful_qa:TruthfulQaAdapter"
swe-bench-verified-v1 = "novafabric.evals.suites.swe_bench:SweBenchAdapter"
agentbench-v1 = "novafabric.evals.suites.agent_bench:AgentBenchAdapter"

[project.scripts]
novafabric = "novafabric.cli.main:app"
nova = "novafabric.cli.main:app"
novacap = "novafabric.daemon.client:main"

[tool.hatch.build.targets.wheel]
packages = ["src/novafabric"]
include = [
    "src/novafabric/schemas/*.json",
    "src/novafabric/envelopes/_schemas/*.json",
    "src/novafabric/capture/hooks/*.yaml",
    "src/novafabric/safetycase/templates/*.yaml",
    "src/novafabric/serve/static/**/*",
    "src/novafabric/policies/**/*.rego",
    # PEP 561 marker: this project ships inline type annotations and is
    # checked under `mypy strict = true`. Without this the marker file would
    # not ship in the wheel and downstream mypy/pyright runs would silently
    # treat novafabric as untyped.
    "src/novafabric/py.typed",
]

# ADR-0211 D2: ship the registry-track alembic trees (repo-root alembic/) as
# package data so installed deployments can resolve the migration head — the
# schema-skew guard and `nova db upgrade --track registry` depend on it. The
# root checkout stays the dev entry point; this is a build-time mapping, not a
# second copy in the source tree.
[tool.hatch.build.targets.wheel.force-include]
"alembic" = "novafabric/migrations/registry"
# Canonical JSON Schemas that runtime code loads. They live at the repo root
# because that is the published, spec-owned location, but nothing under
# `schemas/` ships in the wheel by default — so `novafabric.envelope.validator`
# raised FileNotFoundError and `novafabric.import_blob` resolved a path outside
# site-packages on every pip install. Both were invisible to the test suite,
# which runs from the source tree where the repo-root fallback resolves.
#
# force-include (not a copy under src/) is deliberate: the packaged-vs-
# canonical schema split (BL-028) already cost a release, so there is exactly
# ONE copy of each file and the build maps it into the package.
"schemas/event-envelope-v1/envelope-v1.json" = "novafabric/envelope/_schemas/envelope-v1.json"
"schemas/export-manifest.schema.json" = "novafabric/schemas/export-manifest.schema.json"
"schemas/parent_child_capsule_v1.schema.json" = "novafabric/schemas/parent_child_capsule_v1.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "packages/nova_worm_conformance/src", "tests"]
# Suite-health (2026-07-15): no single test may hang the run. 300s is ~20x the
# slowest legitimate test outside the benchmark suite; hangs fail by name.
timeout = 300

[tool.coverage.run]
omit = [
    # Cloud-backend adapters require live infrastructure — excluded from coverage gate
    "src/novafabric/object_capsule_store/worm/s3.py",
    "src/novafabric/object_capsule_store/worm/minio.py",
    "src/novafabric/object_capsule_store/worm/ceph.py",
    "src/novafabric/object_capsule_store/worm/azure.py",
    # Alembic migration env.py and version scripts only execute against a live database engine
    "src/novafabric/metadata_store/migrations/*/env.py",
    "src/novafabric/metadata_store/migrations/*/versions/*.py",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
# Enterprise-hardening (2026-07-24): expanding the ruleset in reviewable,
# per-family steps rather than one mass-autofix commit.
#   Enabled: E/F/I (baseline) + C4 (flake8-comprehensions).
#   Deferred (each needs a dedicated per-site pass, tracked in the
#   enterprise-hardening plan): B (bugbear — 178 B904 exception-chaining +
#   B905 zip-strict need judgment), S (bandit — 239, per-site security
#   review), UP/RUF (~1300 cosmetic autofixes; land as isolated mechanical
#   commits so review stays tractable).
select = ["E", "F", "I", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# Optional deps without type stubs — all Tier A per ADR-0024.
module = [
    "gremlin_python.*",
    # pyarrow 25.0.0 stopped shipping a py.typed marker, so mypy can no longer
    # analyse it. Same treatment as every other untyped third-party module here.
    "pyarrow",
    "pyarrow.*",
    "cffi.*",
    "zstandard.*",
    "boto3.*",
    "botocore.*",
    "azure.*",
    "google.cloud.*",
    "google.adk.*",
    "agents.*",
    "a2a.*",
    "watchdog",
    "watchdog.*",
    # sigstore (Apache-2.0, Tier A) — optional extra novafabric[sigstore] (ADR-0071).
    # Not installed by default; lazily imported in sigstore_signer.py.
    "sigstore.*",
    # Installed-but-untyped optional extras (no py.typed): silence import-untyped
    # so `mypy --all-extras` (CI typecheck job) and lean envs agree.
    "clickhouse_connect.*",
    "weasyprint.*",
    "presidio_analyzer.*",
    # pynvml (BSD-3, Tier A) — optional extra novafabric[energy-gpu] (ADR-0093).
    # Lazily imported in energy/_readers.py for GPU energy; RAPL path needs no dep.
    "pynvml",
    "pynvml.*",
    # opentelemetry-proto (Apache-2.0, Tier A) — optional extra novafabric[otlp]
    # (ADR-0177). Lazily imported in otel/genai_ingest.py for OTLP/protobuf ingest.
    # google.protobuf ships no py.typed, so silence import-untyped in both lean and
    # --all-extras (CI) envs.
    "google.protobuf.*",
    "opentelemetry.proto.*",
    # signxml (Apache-2.0) + lxml (BSD) — Tier A, optional extra novafabric[saml]
    # (ADR-0138). Lazily imported in server/saml_verify.py for XML-DSIG verification.
    "signxml.*",
    "lxml.*",
]
ignore_missing_imports = true

[tool.mutmut]
paths_to_mutate = "src/novafabric/metadata_store/postgres.py"
runner = "uv run pytest tests/metadata_store/test_cross_tenant_isolation_pgbouncer.py tests/metadata_store/test_set_local_invariant.py -x --tb=short -q"
tests_dir = "tests/metadata_store/"

[tool.uv.sources]
novafabric = { workspace = true }

[tool.uv]
# Dependabot: transitive advisories forced to patched lines.
#   starlette  — Host-header validation (GHSA, fixed in 1.3.1); via fastapi
#   joserfc    — fixed in 1.6.7; via authlib
#   pydantic-settings — fixed in 2.14.2; via pydantic stack
constraint-dependencies = [
    "starlette>=1.3.1",
    "joserfc>=1.6.7",
    "pydantic-settings>=2.14.2",
]
