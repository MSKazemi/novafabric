<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 693" width="980" height="693" role="img" aria-labelledby="t d">
<title id="t">OTLP ingest: traces become a new capsule, logs go to a sidecar</title>
<desc id="d">Two OTLP routes on nova serve. Trace exports that carry OTel GenAI spans are written as a brand-new run capsule. Log exports are appended to a sidecar log store outside every capsule; a sealed capsule is observed, never written. Step 1: Traces: the exporter POSTs to /api/otlp/v1/traces; the route needs a token holding scope operate. Step 2: Only spans carrying a gen_ai.* attribute become events; the rest are counted as skipped, never guessed at. Step 3: write_ingest_capsule creates a new capsule under a fresh ULID; no existing capsule is ever opened for writing. Step 4: Logs: the exporter POSTs to /api/otlp/v1/logs (scope operate); over 16 MiB or 10,000 records is a 400 and nothing is written. Step 5: Each record is routed by link key: novafabric.run_id, else a valid traceId, else the UTC day of the record. Step 6: A run-linked record gets the capsule's observed state (sealed, unsealed or absent) stamped on it. The capsule is never written. Step 7: Lines are appended with O_APPEND under flock; records past a stream's 64 MiB cap are rejected and counted in partialSuccess.</desc>
