<rect width="699" height="596" rx="10" fill="#0a0a0c"/>
<rect width="699" height="30" rx="10" fill="#26262c"/>
<rect y="20" width="699" height="10" fill="#26262c"/>
<circle cx="18" cy="15" r="5" fill="#ff5f57"/><circle cx="36" cy="15" r="5" fill="#febc2e"/><circle cx="54" cy="15" r="5" fill="#28c840"/>
<text x="349" y="15" fill="#8b8b94" text-anchor="middle" font-size="11">novafabric</text>
<text class="l0" x="22" y="44" fill="#d8d8dd" font-weight="600"><tspan fill="#7aa2f7">$</tspan> pip install novafabric</text>
<text class="l1" x="22" y="66" fill="#8b8b94">Successfully installed novafabric-0.100.1</text>
<text class="l3" x="22" y="110" fill="#d8d8dd" font-weight="600"><tspan fill="#7aa2f7">$</tspan> nova capture python agent.py</text>
<text class="l4" x="22" y="132" fill="#8b8b94">planning: summarise the Q3 incident report</text>
<text class="l5" x="22" y="154" fill="#8b8b94">tool: search(index=&#x27;incidents&#x27;, q=&#x27;Q3 outage&#x27;)  -&gt; 3 hits</text>
<text class="l6" x="22" y="176" fill="#8b8b94">done: 412 tokens</text>
<text class="l7" x="22" y="198" fill="#c4f0a8">✓ Capsule written: ~/.novafabric/capsules/01KZ9VZPFQB95A63</text>
<text class="l9" x="22" y="242" fill="#d8d8dd" font-weight="600"><tspan fill="#7aa2f7">$</tspan> nova validate 01KZ9VZPFQB95A63</text>
<text class="l10" x="22" y="264" fill="#c4f0a8">✓ Valid capsule: 01KZ9VZPFQB95A63  status=success</text>
<text class="l12" x="22" y="308" fill="#d8d8dd" font-weight="600"><tspan fill="#7aa2f7">$</tspan> nova replay 01KZ9VZPFQB95A63 --mode forensic</text>
<text class="l13" x="22" y="330" fill="#c4f0a8">✓ Replay written: .novafabric/replays/01KZ9VZX0A9KAXGD</text>
<text class="l14" x="22" y="352" fill="#8b8b94">  (mode=forensic — no network, no API keys, no tokens spent)</text>
<text class="l16" x="22" y="396" fill="#d8d8dd" font-weight="600"><tspan fill="#7aa2f7">$</tspan> nova capture python agent.py</text>
<text class="l17" x="22" y="418" fill="#c4f0a8">✓ Capsule written: ~/.novafabric/capsules/01KZ9W3B7RT2M8QH</text>
<text class="l19" x="22" y="462" fill="#d8d8dd" font-weight="600"><tspan fill="#7aa2f7">$</tspan> nova diff 01KZ9VZPFQB95A63 01KZ9W3B7RT2M8QH</text>
<text class="l20" x="22" y="484" fill="#d8d8dd">Diff: 01KZ9VZPFQB95A63 → 01KZ9W3B7RT2M8QH</text>
<text class="l21" x="22" y="506" fill="#d8d8dd">  changed=1  added=0  removed=0</text>
<text class="l22" x="22" y="528" fill="#d8d8dd">Outputs:</text>
<text class="l23" x="22" y="550" fill="#8b8b94">  ~ outputs/stdout.txt</text>
