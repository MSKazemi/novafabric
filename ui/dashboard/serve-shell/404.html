<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Not found — NovaFabric local dashboard</title>
    <!--
      Product-local 404 for `nova serve --experimental` (ADR-0299). This server
      hosts the dashboard and its API only; explanatory pages are external links
      to https://novafabric.ai and are never required to operate it.
    -->
    <style>
      :root { color-scheme: dark light; --bg: #0a0a0c; --text: #e6e6ea; --muted: #a8a8b3; --faint: #6b6b76; }
      @media (prefers-color-scheme: light) { :root { --bg: #fbfbfc; --text: #14141a; --muted: #4a4a55; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
             color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 34rem; padding: 0 16px; text-align: center; }
      .code { font: 12px/1 ui-monospace, "JetBrains Mono", monospace; letter-spacing: .08em; color: var(--faint); }
      h1 { margin: .75rem 0 0; font-size: 1.75rem; font-weight: 500; }
      p { color: var(--muted); }
      a { color: inherit; text-underline-offset: 4px; }
      nav { margin-top: 1.5rem; display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; justify-content: center; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Nothing is served at this path.</h1>
      <p>
        This is the local <code>nova serve</code> dashboard. It serves the dashboard and its
        API, not the NovaFabric website.
      </p>
      <nav aria-label="Where to go">
        <a href="/dashboard/">Open the dashboard</a>
        <a href="/api/docs">API docs</a>
        <a href="https://novafabric.ai/docs/" rel="noopener noreferrer">Documentation on novafabric.ai</a>
      </nav>
    </main>
  </body>
</html>
