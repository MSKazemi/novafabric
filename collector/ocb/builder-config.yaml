# OpenTelemetry Collector Builder configuration for NovaFabric custom collector.
#
# Build with:
#   ocb --config collector/ocb/builder-config.yaml
#
# Install OCB:
#   go install go.opentelemetry.io/collector/cmd/builder@v0.104.0
#
# The otelcol_version here is pinned to match the go.mod versions used by
# the collector module (github.com/novafabric/collector).  Update both in
# lockstep when upgrading OTel dependencies.

dist:
  name: novafabric-collector
  description: "NovaFabric custom OTel Collector with NovaSeal batch processor"
  output_path: ./bin
  otelcol_version: "0.104.0"

extensions:
  - gomod: go.opentelemetry.io/collector/extension/zpagesextension v0.104.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.104.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.104.0
  # NovaSeal batch processor — local module replace below.
  # Implements the Ed25519 signing step described in ADR-0041.
  - gomod: github.com/novafabric/collector v0.0.0
    path: ../../collector

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.104.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.104.0

connectors: []

replaces:
  - github.com/novafabric/collector => ../../collector
