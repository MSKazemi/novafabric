# alembic.ini — NovaFabric SQLite migration configuration (default backend).
# Usage: alembic upgrade head
#
# For Postgres: alembic -c alembic-postgres.ini upgrade head

[alembic]
script_location = alembic
version_locations = alembic/sqlite/versions
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
