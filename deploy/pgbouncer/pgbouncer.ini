; NovaFabric production PgBouncer configuration template.
;
; Deploy alongside the NovaFabric server (nova serve / docker compose).
; Replace all <PLACEHOLDER> values with site-specific credentials.
;
; References:
;   ADR-0016 — Postgres storage backend design decision
;   ADR-0040 — Production MetadataStore interface
;   docs/ops/server-deployment.md

[databases]
; Primary NovaFabric application database.
; Replace <HOST>, <PORT>, <DBNAME> with your Postgres server details.
novafabric = host=<HOST> port=<PORT> dbname=<DBNAME>

; (Optional) Read replica for analytics / reporting queries.
; Uncomment and configure if you have a Postgres streaming replica.
; novafabric_ro = host=<REPLICA_HOST> port=<PORT> dbname=<DBNAME>

[pgbouncer]
; -----------------------------------------------------------------
; Connection pooling
; -----------------------------------------------------------------
; transaction pooling is correct for NovaFabric: the app uses
; short-lived SQLAlchemy connection checkouts, not server-side
; cursors or session-level SET commands (except within explicit
; transactions where RLS is SET LOCAL — transaction pooling is safe).
pool_mode = transaction

; Maximum total backend connections PgBouncer will open.
; Rule of thumb: (Postgres max_connections - 10 reserved for admin) * 0.8
; Default Postgres max_connections=100 → set this to 72.
max_client_conn = 300
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5

; -----------------------------------------------------------------
; Authentication
; -----------------------------------------------------------------
; Use scram-sha-256 (Postgres default since 14).
; The userlist.txt file must contain:
;   "novafabric_app"  "<scram-sha-256 verifier>"
;   "novafabric_migrator"  "<scram-sha-256 verifier>"
; Generate verifiers with: psql -c "SELECT * FROM pg_authid WHERE rolname='novafabric_app';"
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; -----------------------------------------------------------------
; Networking
; -----------------------------------------------------------------
listen_addr = 127.0.0.1
listen_port = 5432

; Expose metrics on localhost only (not externally).
; Prometheus exporter at :9127/metrics scrapes these via pgbouncer_exporter.
; stats_users = pgbouncer_monitor

; -----------------------------------------------------------------
; TLS (recommended for production)
; -----------------------------------------------------------------
; Uncomment and configure for TLS between PgBouncer and Postgres.
; client_tls_sslmode = require
; client_tls_cert_file = /etc/pgbouncer/server.crt
; client_tls_key_file = /etc/pgbouncer/server.key
; server_tls_sslmode = require
; server_tls_ca_file = /etc/ssl/certs/ca-certificates.crt

; -----------------------------------------------------------------
; Timeouts
; -----------------------------------------------------------------
; Idle connection keepalive — close idle server connections after 600s.
server_idle_timeout = 600
; Close server connections that have been idle for longer than this.
server_lifetime = 3600
; Client connections that are idle and have no pending queries.
client_idle_timeout = 0

; -----------------------------------------------------------------
; Logging
; -----------------------------------------------------------------
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
; stats_period controls how often PgBouncer logs aggregate statistics.
stats_period = 60

; -----------------------------------------------------------------
; Admin interface (localhost only)
; -----------------------------------------------------------------
; Access the admin console via: psql -p 5432 -U pgbouncer pgbouncer
admin_users = pgbouncer_admin
