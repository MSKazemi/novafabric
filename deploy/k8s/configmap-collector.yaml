apiVersion: v1
kind: ConfigMap
metadata:
  name: novafabric-collector-config
  namespace: novafabric
  labels:
    app.kubernetes.io/name: novafabric
    app.kubernetes.io/component: collector
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

    processors:
      batch:
        # Maximum number of log records per batch before flush
        send_batch_size: 1000
        # Maximum time to wait before flushing an incomplete batch
        timeout: 5s

      # NovaSeal Batch Signer — signs each OTLP batch with Ed25519 before export.
      # This is a custom OTel processor extension from the novafabric-collector image.
      # fail_open: false — drop the batch if NovaSeal is unreachable (never forward unsigned events).
      novaseal_batch_signer:
        keystore_endpoint: "${NOVASEAL_KMS_ENDPOINT}"
        fail_open: false
        cache_ttl: 5m
        key_rotation_interval: 1h

    exporters:
      kafka:
        brokers: ["${KAFKA_BOOTSTRAP_SERVERS}"]
        topic: "nova.evidence"
        producer:
          # required_acks: -1 = all in-sync replicas (strongest durability guarantee)
          required_acks: -1
          compression: lz4
          idempotent: true

    service:
      telemetry:
        logs:
          level: info
        metrics:
          address: "0.0.0.0:8888"
      pipelines:
        logs:
          receivers: [otlp]
          processors: [batch, novaseal_batch_signer]
          exporters: [kafka]
