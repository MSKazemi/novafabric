{{- /*
DB password secret. Created when using bundled Postgres, or when using an
external database without a pre-existing secret. Skipped when
externalDatabase.existingSecret is set (the user manages it).
*/ -}}
{{- if or .Values.postgres.enabled (and (not .Values.postgres.enabled) (not .Values.externalDatabase.existingSecret)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "novafabric.fullname" .) }}
  labels:
    {{- include "novafabric.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ if .Values.postgres.enabled }}{{ .Values.postgres.auth.password | quote }}{{ else }}{{ required "externalDatabase.password is required when postgres.enabled is false and no existingSecret is set" .Values.externalDatabase.password | quote }}{{ end }}
{{- end }}
