# Default values for the novafabric chart.
# Deploys `nova serve` (dashboard + REST API). See deploy/helm/novafabric/README.md.

image:
  repository: ghcr.io/novafabric/novafabric
  # Defaults to .Chart.AppVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# Secrets for pulling from a private registry, e.g. [{ name: ghcr-creds }].
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Single replica: nova serve is one writer over the local registry/capsule
# volume. Scaling out is a server-mode (Postgres) concern, not a chart concern.
replicaCount: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Pod- and container-level hardening. No-root by default (CLAUDE.md anti-pattern):
# the app runs as uid/gid 1000 and writes only to the mounted data volume, whose
# group ownership is set via fsGroup.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# Deployment mode (ADR-0230):
#   server (default)  — `nova server start`, the multi-user REST API with
#                       OIDC/RBAC over Postgres. Auth is ON by default.
#   dashboard         — `nova serve`, the experimental dashboard. NOT read-only:
#                       it exposes irreversible operations including
#                       DELETE /api/runs/{id}, POST /api/compliance/pii/erase,
#                       POST /api/seal/{id}/bypass and POST /api/admin/roles.
#                       Since ADR-0228 every route carries a scope, so a narrower
#                       credential can be minted — but the shared token still
#                       holds `admin`. Requires TLS and authentication in front
#                       of ANY non-loopback exposure.
#
# The default was `dashboard` with `serve.insecure: true` until v0.102.0. That
# combination matched none of ADR-0042's four named, tested and supported
# deployment tiers — it was an unsupported configuration, not merely a risky
# one. To keep it, set `mode: dashboard` and the acknowledgement below.
mode: server

# Alembic revision the migration initContainer upgrades to. Default "head":
# the server refuses to start when stamped behind head, so pinning below head
# breaks a server-mode deploy. Override only if you must hold a schema back.
dbRevision: head

serve:
  port: 4321
  # `--insecure` disables the non-loopback bind refusal, serving the dashboard
  # over plain HTTP guarded only by a printed shared token (`kubectl logs`).
  # That token grants `admin` scope: full, irreversible power over signed
  # evidence. Default `false` since v0.102.0 (ADR-0230 D1).
  #
  # Setting it true makes `helm template`/`helm install` FAIL unless you also set
  # `serve.acknowledgeInsecureExposure` (see below). The failure is deliberate:
  # a NOTES.txt warning prints after the exposure already exists.
  insecure: false
  # Set to the exact string "i-accept-serving-evidence-over-plain-http" to allow
  # `insecure: true`. Deliberately awkward — the unsafe path stays possible but
  # effortful, and the choice is recorded in your own values file and in git.
  acknowledgeInsecureExposure: ""
  topology: true
  tv5: true
  # Extra args appended verbatim to the `nova serve` command, e.g. ["--no-browser"].
  extraArgs: []

# server-mode settings (mode: server). OIDC is configured via env
# (NOVAFABRIC_SERVER_* — see extraEnv / secret); without it the server runs in
# local-token mode (auth still ON). Do not disable auth here.
server:
  port: 7433
  # uvicorn worker processes for horizontal scaling (requires Postgres).
  workers: 1

service:
  type: ClusterIP
  port: 4321

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: novafabric.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Persistent volume for capsules + SQLite registry + embedded KuzuDB (mounted at
# /data). Disable to use an ephemeral emptyDir (data lost on pod restart).
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Bundled Postgres for evaluation. For production, set enabled: false and point
# externalDatabase at a managed Postgres.
postgres:
  enabled: true
  image: postgres:16-alpine
  auth:
    username: nova
    password: nova
    database: nova
  persistence:
    enabled: true
    storageClass: ""
    size: 8Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# Used only when postgres.enabled is false.
externalDatabase:
  host: ""
  port: 5432
  username: nova
  password: ""
  database: nova
  # Read the password from an existing secret instead of externalDatabase.password.
  existingSecret: ""
  existingSecretPasswordKey: password

# Extra environment variables for the nova container, e.g. [{ name: FOO, value: bar }].
extraEnv: []

nodeSelector: {}
tolerations: []
affinity: {}

# ADR-0230 D5: set once when upgrading across v0.102.0, after reading the
# message the chart prints. A fresh install never needs it.
upgradeAcknowledged: false
