# NovaFabric HPC Collector — 10-leaf + 1-hub + 1-mock-KMS + 1-Kafka reference deployment
#
# Purpose: Integration testing for the collector tier.
# NOT for production use.
#
# Topology:
#   nats-hub         — cluster hub with JetStream (aggregate stream)
#   nats-leaf-01..10 — per-node leaf nodes connected to hub
#   mock-kms         — stub NovaSeal KMS endpoint (dev-only; see note below)
#   kafka            — single-node Kafka/KRaft broker
#
# NOTE: The 10-minute hub-disconnect test window.
# The test harness uses a 5-minute disconnect simulation window (see tests/integration/).
# The hub JetStream stream is configured with --max-age 24h, so events written
# during the 5-minute disconnect gap are replayed on reconnect. However, the
# mock-kms stub does not persist key state across container restarts — if mock-kms
# is restarted during the 10-minute window between disconnect and re-verification,
# signature verification will fail. Always verify within the same mock-kms session.

services:

  nats-hub:
    image: nats:2.10-alpine
    container_name: novafabric-nats-hub
    command:
      - "--name"
      - "nova-hub"
      - "--js"
      - "--store_dir"
      - "/data/nats"
      - "--port"
      - "4222"
      - "--leafnodes_listen"
      - "0.0.0.0:7422"
    ports:
      - "4222:4222"
      - "7422:7422"
      - "8222:8222"
    volumes:
      - nats-hub-data:/data/nats
    healthcheck:
      test: ["CMD", "nats-server", "--healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats-leaf-01:
    image: nats:2.10-alpine
    container_name: novafabric-nats-leaf-01
    command:
      - "--name"
      - "nova-leaf-test-node01-job001"
      - "--js"
      - "--store_dir"
      - "/data/nats"
      - "--leafnode_remotes"
      - "nats://nats-hub:7422"
    depends_on:
      nats-hub:
        condition: service_healthy

  nats-leaf-02:
    image: nats:2.10-alpine
    container_name: novafabric-nats-leaf-02
    command:
      - "--name"
      - "nova-leaf-test-node02-job001"
      - "--js"
      - "--store_dir"
      - "/data/nats"
