  nats-leaf-10:
    image: nats:2.10-alpine
    container_name: novafabric-nats-leaf-10
    command:
      - "--name"
      - "nova-leaf-test-node10-job001"
      - "--js"
      - "--store_dir"
      - "/data/nats"
      - "--leafnode_remotes"
      - "nats://nats-hub:7422"
    depends_on:
      nats-hub:
        condition: service_healthy

  mock-kms:
    # NOTE: This is a stub mock only — it returns a fixed JSON response.
    # Replace with the real NovaSeal KMS (src/novafabric/trust/novaseal/) in production.
    # This stub does NOT implement Ed25519 signing, key rotation, or audit logging.
    image: alpine:3.19
    container_name: novafabric-mock-kms
    command:
      - sh
      - -c
      - |
        apk add --no-cache ncat > /dev/null 2>&1
        while true; do
          ncat -l -p 8443 -e sh -c \
            'echo -e "HTTP/1.1 200 OK\r\nContent-Type: application/json\r\n\r\n{\"key_id\":\"test-key-1\",\"public_key\":\"mock\",\"status\":\"ok\"}"'
        done
    ports:
      - "8443:8443"

  kafka:
    # Single-node Kafka in KRaft mode (no ZooKeeper)
    image: apache/kafka:3.7.0
    container_name: novafabric-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  nats-hub-data:
  kafka-data:

networks:
  default:
    name: novafabric-hpc-test
