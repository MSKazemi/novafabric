; pgBouncer 1.24 production configuration for NovaFabric
;
; Usage
; -----
;   docker compose --profile prod up pgbouncer
;
; The Nova application should connect via pgBouncer on port 6432:
;   postgresql://novafabric_app:<password>@pgbouncer:6432/novafabric
;
; See deploy/docker/README-pgbouncer.md for setup and SCRAM hash generation.

[databases]
novafabric = host=postgres port=5432 dbname=novafabric

[pgbouncer]
; ── Network ──────────────────────────────────────────────────────────────────
listen_addr = 0.0.0.0
listen_port = 6432

; ── Authentication ────────────────────────────────────────────────────────────
; scram-sha-256 is required for production; never use 'trust' or 'plain' here.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; ── Pooling ───────────────────────────────────────────────────────────────────
; transaction mode is the right choice for the async psycopg / asyncpg drivers
; used by NovaFabric's MetadataStore (ADR-0040).
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
; seconds to wait before using the reserve pool
reserve_pool_timeout = 3

; ── Timeouts ─────────────────────────────────────────────────────────────────
; idle server connections are closed after 10 minutes
server_idle_timeout = 600
; 0 = never close idle client connections (apps manage their own pool)
client_idle_timeout = 0

; ── Keepalive ─────────────────────────────────────────────────────────────────
tcp_keepalive = 1

; ── Logging ───────────────────────────────────────────────────────────────────
; disable per-connection log lines in production to avoid log flooding
log_connections = 0
log_disconnections = 0

; ── Admin / stats ─────────────────────────────────────────────────────────────
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats

; ── TLS (server side — pgBouncer → Postgres) ─────────────────────────────────
; require TLS from pgBouncer to Postgres in production deployments
server_tls_sslmode = require

; ── Compatibility ─────────────────────────────────────────────────────────────
; asyncpg / psycopg3 set extra_float_digits=2; pgBouncer must not fail on this
ignore_startup_parameters = extra_float_digits
