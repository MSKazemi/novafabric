; pgBouncer 1.25 reference configuration for NovaFabric — standalone
; deployment (this repo's `docker compose --profile prod up pgbouncer` does
; NOT read this file; that service is configured entirely via environment
; variables — DB_NAME=nova/DB_USER=nova/DB_PASSWORD=nova, AUTH_TYPE=trust —
; see deploy/docker/README-pgbouncer.md). This file documents the settings
; for running pgBouncer standalone with NovaFabric's real production role
; split (novafabric_app/novafabric_migrator, ADR-0040 §3).
;
; Standalone usage: mount this file into your own pgBouncer container or
; systemd unit, then connect on port 6432:
;   postgresql://novafabric_app:<password>@pgbouncer:6432/novafabric
;
; See deploy/docker/README-pgbouncer.md for setup and SCRAM hash generation.

[databases]
novafabric = host=postgres port=5432 dbname=novafabric

; (Optional) Read replica for analytics / reporting queries.
; Uncomment and configure if you have a Postgres streaming replica.
; novafabric_ro = host=<REPLICA_HOST> port=5432 dbname=novafabric

[pgbouncer]
; ── Network ──────────────────────────────────────────────────────────────────
listen_addr = 0.0.0.0
listen_port = 6432

; ── Authentication ────────────────────────────────────────────────────────────
; scram-sha-256 is required for production; never use 'trust' or 'plain' here.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; Two Postgres roles are provisioned (ADR-0040 §3, test_role_split.py):
; novafabric_app (NOBYPASSRLS, normal query execution) and
; novafabric_migrator (BYPASSRLS, schema migrations only). The migrator role
; must never be used by this application pool — run migrations via a separate
; one-shot connection (`nova migrate-to-postgres`), not through pgBouncer.

; ── Pooling ───────────────────────────────────────────────────────────────────
; transaction mode is the right choice for the async psycopg / asyncpg drivers
; used by NovaFabric's MetadataStore (ADR-0040). It is also RLS-safe: the app
; uses short-lived connection checkouts, not server-side cursors or
; session-level SET, except within explicit transactions where RLS is
; SET LOCAL — which transaction pooling handles correctly.
pool_mode = transaction
; Rule of thumb for max_client_conn: (Postgres max_connections - 10 reserved
; for admin) * 0.8 — tune to your deployment's Postgres max_connections.
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
; seconds to wait before using the reserve pool
reserve_pool_timeout = 3

; ── Timeouts ─────────────────────────────────────────────────────────────────
; idle server connections are closed after 10 minutes
server_idle_timeout = 600
; maximum lifetime of a server connection before it is recycled, even if
; otherwise healthy (bounds e.g. connection-level state drift over time)
server_lifetime = 3600
; 0 = never close idle client connections (apps manage their own pool)
client_idle_timeout = 0

; ── Keepalive ─────────────────────────────────────────────────────────────────
tcp_keepalive = 1

; ── Logging ───────────────────────────────────────────────────────────────────
; disable per-connection log lines in production to avoid log flooding
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
; how often (seconds) pgBouncer logs aggregate pool statistics
stats_period = 60

; ── Admin / stats ─────────────────────────────────────────────────────────────
; access the admin console via: psql -p 6432 -U pgbouncer_admin pgbouncer
admin_users = pgbouncer_admin
; pgbouncer_exporter (Prometheus, Apache-2.0) can scrape these stats;
; see deploy/docker/README-pgbouncer.md "Monitoring" for exporter setup
stats_users = pgbouncer_stats

; ── TLS (server side — pgBouncer → Postgres) ─────────────────────────────────
; require TLS from pgBouncer to Postgres in production deployments
server_tls_sslmode = require
; server_tls_ca_file = /etc/ssl/certs/ca-certificates.crt

; ── TLS (client side — app → pgBouncer) ──────────────────────────────────────
; uncomment and configure for TLS between the application and pgBouncer
; client_tls_sslmode = require
; client_tls_cert_file = /etc/pgbouncer/server.crt
; client_tls_key_file = /etc/pgbouncer/server.key

; ── Compatibility ─────────────────────────────────────────────────────────────
; asyncpg / psycopg3 set extra_float_digits=2; pgBouncer must not fail on this
ignore_startup_parameters = extra_float_digits
