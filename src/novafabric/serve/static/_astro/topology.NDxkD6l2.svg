<rect class="card2" x="38" y="340" width="264" height="46" rx="8"/><text class="t" x="48" y="359" text-anchor="start" style="font-weight:600">nova serve  (experimental)</text><text class="s mono" x="48" y="376" text-anchor="start">dashboard · 127.0.0.1:4321</text>
