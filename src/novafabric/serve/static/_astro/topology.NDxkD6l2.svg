<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-labelledby="t d">
<title id="t">Deployment topologies from local to cluster</title>
<desc id="d">Three columns. Local (works today): nova capture writes capsule directories under ~/.novafabric/capsules, a SQLite registry.db holds assets and the lineage index, nova serve is an experimental local dashboard, and runners cover local, Docker, SLURM, Kubernetes, LSF and PBS. Server (experimental): nova server start runs a FastAPI app with OIDC or local-token auth, SQLite or Postgres metadata with row-level security, and stores capsule bytes in a filesystem directory fed by POST /v0/capsules; the S3-compatible object store is a library not wired to the server. Cluster-scale (experimental, partial): nova capture --emit-spool writes to a node spool, a Go spool forwarder ships events to NATS JetStream, and consumers index lineage and evidence; hub signing is planned and multi-cluster federation is future design.</desc>
<style>
