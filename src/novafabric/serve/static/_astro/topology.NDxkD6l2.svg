.rg2{opacity:0;animation:rg 12.0s ease-in-out 3.00s infinite}
.rg3{opacity:0;animation:rg 12.0s ease-in-out 4.50s infinite}
.rg4{opacity:0;animation:rg 12.0s ease-in-out 6.00s infinite}
.rg5{opacity:0;animation:rg 12.0s ease-in-out 7.50s infinite}
.rg6{opacity:0;animation:rg 12.0s ease-in-out 9.00s infinite}
