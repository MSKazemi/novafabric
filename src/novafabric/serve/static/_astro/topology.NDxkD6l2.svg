<text class="title" x="22" y="38" text-anchor="start">Deployment topologies: local → server → cluster</text>
<text class="s" x="22" y="58" text-anchor="start">Every tier reads the same capsule format. Solid = works today / experimental · dashed = planned or future design</text>
