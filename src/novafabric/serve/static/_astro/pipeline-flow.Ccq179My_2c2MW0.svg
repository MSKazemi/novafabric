<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" role="img" aria-labelledby="t d">
<title id="t">NovaFabric pipeline: capture, seal, replay, diff, audit</title>
<desc id="d">Five stages left to right. Capture (nova capture) installs hooks, runs the workload and redacts secrets, writing a Run Capsule directory. Seal runs automatically at the end of capture when NovaSeal is configured, writing a DSSE signature, an RFC 3161 timestamp and a Merkle log entry into .seal/. Replay (nova replay) re-runs the captured command with recorded LLM responses (mocked mode, the default) or analyses the capsule in four other modes, writing a replay_result.yaml. Diff (nova diff) compares two capsules. Diff can fail a CI job. Audit verifies the seal offline (nova verify), exports a signed Evidence Bundle (nova export-evidence) and maps evidence to controls (nova audit). A band underneath states that the capsule on disk is the source of truth.</desc>
<style>
svg{--bg:#111114;--card:#1c1c22;--card2:#24242c;--stroke:#3a3a44;--fg:#ececf1;--muted:#a8a8b3;--line:#6b6b78;--cap:#7dd3fc;--seal:#c4b5fd;--rep:#5eead4;--diff:#fcd34d;--aud:#c4f0a8;--warn:#fda4af}
@media (prefers-color-scheme:light){svg{--bg:#fafaf9;--card:#ffffff;--card2:#f1f1f3;--stroke:#d4d4d8;--fg:#18181b;--muted:#52525b;--line:#a1a1aa;--cap:#0369a1;--seal:#6d28d9;--rep:#0f766e;--diff:#a16207;--aud:#3f6212;--warn:#be123c}}
.bg{fill:var(--bg)}
.card{fill:var(--card);stroke:var(--stroke);stroke-width:1.2}
.card2{fill:var(--card2);stroke:var(--stroke);stroke-width:1}
text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:var(--fg)}
.mono{font-family:ui-monospace,'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace}
.h{font-size:15px;font-weight:650}
.t{font-size:12.5px}
.s{font-size:11px;fill:var(--muted)}
.title{font-size:17px;font-weight:700}
.wire{fill:none;stroke:var(--line);stroke-width:1.6}
.flow{fill:none;stroke-width:2;stroke-dasharray:6 8;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.c-cap{stroke:var(--cap)}.f-cap{fill:var(--cap)}
.c-seal{stroke:var(--seal)}.f-seal{fill:var(--seal)}
.c-rep{stroke:var(--rep)}.f-rep{fill:var(--rep)}
.c-diff{stroke:var(--diff)}.f-diff{fill:var(--diff)}
.c-aud{stroke:var(--aud)}.f-aud{fill:var(--aud)}
.c-warn{stroke:var(--warn)}.f-warn{fill:var(--warn)}
.c-muted{stroke:var(--line)}.f-muted{fill:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}.flow{stroke-dasharray:none}}
@keyframes ring{0%{opacity:0}4%{opacity:1}16%{opacity:1}22%{opacity:0}100%{opacity:0}}
.ring0{opacity:0;animation:ring 10.0s ease-in-out 0.00s infinite}
.ring1{opacity:0;animation:ring 10.0s ease-in-out 2.00s infinite}
.ring2{opacity:0;animation:ring 10.0s ease-in-out 4.00s infinite}
.ring3{opacity:0;animation:ring 10.0s ease-in-out 6.00s infinite}
.ring4{opacity:0;animation:ring 10.0s ease-in-out 8.00s infinite}
@media (prefers-reduced-motion:reduce){[class^=ring]{opacity:0}}
</style>
