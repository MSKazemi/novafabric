<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img" aria-labelledby="t d">
<title id="t">How a Run Capsule is assembled</title>
<desc id="d">Left: the workload runs as a subprocess with the sitecustomize hook loader injected by the runner; hooks record model calls, tool calls and HTTP traffic, and the runner captures stdout and stderr. After the workload exits the orchestrator writes env.lock, runs the secret scanner and maskers, writes replay.yaml, the capsule.yaml manifest, lineage.jsonl, per-file SHA-256 evidence digests, and finally the .seal/ files when NovaSeal is configured. Right: the resulting capsule directory, one row per file, highlighted in write order.</desc>
<style>
svg{--bg:#111114;--card:#1c1c22;--card2:#24242c;--stroke:#3a3a44;--fg:#ececf1;--muted:#a8a8b3;--line:#6b6b78;--cap:#7dd3fc;--seal:#c4b5fd;--rep:#5eead4;--diff:#fcd34d;--aud:#c4f0a8;--warn:#fda4af}
@media (prefers-color-scheme:light){svg{--bg:#fafaf9;--card:#ffffff;--card2:#f1f1f3;--stroke:#d4d4d8;--fg:#18181b;--muted:#52525b;--line:#a1a1aa;--cap:#0369a1;--seal:#6d28d9;--rep:#0f766e;--diff:#a16207;--aud:#3f6212;--warn:#be123c}}
.bg{fill:var(--bg)}
.card{fill:var(--card);stroke:var(--stroke);stroke-width:1.2}
.card2{fill:var(--card2);stroke:var(--stroke);stroke-width:1}
text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:var(--fg)}
.mono{font-family:ui-monospace,'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace}
.h{font-size:15px;font-weight:650}
.t{font-size:12.5px}
.s{font-size:11px;fill:var(--muted)}
.title{font-size:17px;font-weight:700}
.wire{fill:none;stroke:var(--line);stroke-width:1.6}
.flow{fill:none;stroke-width:2;stroke-dasharray:6 8;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.c-cap{stroke:var(--cap)}.f-cap{fill:var(--cap)}
.c-seal{stroke:var(--seal)}.f-seal{fill:var(--seal)}
.c-rep{stroke:var(--rep)}.f-rep{fill:var(--rep)}
.c-diff{stroke:var(--diff)}.f-diff{fill:var(--diff)}
.c-aud{stroke:var(--aud)}.f-aud{fill:var(--aud)}
.c-warn{stroke:var(--warn)}.f-warn{fill:var(--warn)}
.c-muted{stroke:var(--line)}.f-muted{fill:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}.flow{stroke-dasharray:none}}
@keyframes row{0%{opacity:0}2%{opacity:1}9%{opacity:1}14%{opacity:0}100%{opacity:0}}
.row0{opacity:0;animation:row 13.0s ease-in-out 0.00s infinite}
.row1{opacity:0;animation:row 13.0s ease-in-out 1.00s infinite}
.row2{opacity:0;animation:row 13.0s ease-in-out 2.00s infinite}
.row3{opacity:0;animation:row 13.0s ease-in-out 3.00s infinite}
.row4{opacity:0;animation:row 13.0s ease-in-out 4.00s infinite}
.row5{opacity:0;animation:row 13.0s ease-in-out 5.00s infinite}
.row6{opacity:0;animation:row 13.0s ease-in-out 6.00s infinite}
.row7{opacity:0;animation:row 13.0s ease-in-out 7.00s infinite}
.row8{opacity:0;animation:row 13.0s ease-in-out 8.00s infinite}
.row9{opacity:0;animation:row 13.0s ease-in-out 9.00s infinite}
.row10{opacity:0;animation:row 13.0s ease-in-out 10.00s infinite}
.row11{opacity:0;animation:row 13.0s ease-in-out 11.00s infinite}
.row12{opacity:0;animation:row 13.0s ease-in-out 12.00s infinite}
@media (prefers-reduced-motion:reduce){[class^=row]{opacity:0}}
</style>
