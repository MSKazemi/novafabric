<text class="h" x="34" y="100" text-anchor="start">Start-up: tenancy gate</text>
<text class="t" x="34" y="122" text-anchor="start">assert_multi_tenant_ready()</text>
<text class="t" x="34" y="139" text-anchor="start">NOVAFABRIC_SERVE_TENANCY=multi</text>
<text class="t" x="34" y="156" text-anchor="start">and an unsafe store ⇒ exit 2</text>
<text class="t" x="34" y="173" text-anchor="start">default: single-tenant</text>
<rect class="card" x="358" y="76" width="600" height="112" rx="10"/>
<rect class="f-seal" x="358" y="76" width="600" height="4" rx="2"/>
<text class="h" x="370" y="100" text-anchor="start">Read-path stores (STORE_TENANCY)</text>
<text class="t" x="370" y="122" text-anchor="start">aware: metadata_store · evidence_fabric · cost_store · object_capsule_store</text>
<text class="t" x="370" y="139" text-anchor="start">agnostic: capsule_dir (isolated by the deployment)</text>
<text class="t" x="370" y="156" text-anchor="start">unsafe: runs_cache · knowledge_graph · lineage_store</text>
<text class="t" x="370" y="173" text-anchor="start">posture reported by GET /api/doctor → tenancy_posture</text>
<rect class="card" x="22" y="230" width="130" height="104" rx="10"/>
<rect class="f-cap" x="22" y="230" width="130" height="4" rx="2"/>
<text class="h" x="34" y="254" text-anchor="start">Client</text>
<text class="t" x="34" y="276" text-anchor="start">Bearer header</text>
<text class="t" x="34" y="293" text-anchor="start">or ?token=</text>
<text class="t" x="34" y="310" text-anchor="start">browser / curl</text>
<rect class="card" x="182" y="230" width="140" height="104" rx="10"/>
<rect class="f-rep" x="182" y="230" width="140" height="4" rx="2"/>
<text class="h" x="194" y="254" text-anchor="start">Host guard</text>
<text class="t" x="194" y="276" text-anchor="start">middleware</text>
<text class="t" x="194" y="293" text-anchor="start">Host must be</text>
<text class="t" x="194" y="310" text-anchor="start">localhost</text>
<rect class="card" x="352" y="230" width="176" height="104" rx="10"/>
<rect class="f-seal" x="352" y="230" width="176" height="4" rx="2"/>
<text class="h" x="364" y="254" text-anchor="start">resolve_scope</text>
<text class="t" x="364" y="276" text-anchor="start">server token → admin</text>
<text class="t" x="364" y="293" text-anchor="start">issued token → its</text>
<text class="t" x="364" y="310" text-anchor="start">scope · unknown → defer</text>
<rect class="card" x="558" y="230" width="176" height="104" rx="10"/>
<rect class="f-seal" x="558" y="230" width="176" height="4" rx="2"/>
<text class="h" x="570" y="254" text-anchor="start">ROUTE_SCOPES</text>
<text class="t" x="570" y="276" text-anchor="start">(method, template)</text>
<text class="t" x="570" y="293" text-anchor="start">public · read · operate</text>
<text class="t" x="570" y="310" text-anchor="start">admin · audit · None</text>
<rect class="card" x="764" y="230" width="194" height="104" rx="10"/>
<rect class="f-seal" x="764" y="230" width="194" height="4" rx="2"/>
<text class="h" x="776" y="254" text-anchor="start">satisfies(held, req)</text>
<text class="t" x="776" y="276" text-anchor="start">admin ⊇ operate ⊇ read</text>
<text class="t" x="776" y="293" text-anchor="start">audit: audit + read only</text>
<text class="t" x="776" y="310" text-anchor="start">None: denied to all</text>
<rect class="card warnbox" x="182" y="384" width="140" height="86" rx="10"/>
<rect class="f-warn" x="182" y="384" width="140" height="4" rx="2"/>
<text class="h" x="194" y="408" text-anchor="start">403</text>
<text class="t" x="194" y="430" text-anchor="start">host_not_localhost</text>
<text class="t" x="194" y="447" text-anchor="start">before any</text>
<text class="t" x="194" y="464" text-anchor="start">scope check</text>
<rect class="card warnbox" x="352" y="384" width="382" height="86" rx="10"/>
<rect class="f-warn" x="352" y="384" width="382" height="4" rx="2"/>
<text class="h" x="364" y="408" text-anchor="start">403 + one audit record</text>
<text class="t" x="364" y="430" text-anchor="start">action authz.denied · required_scope · held_scope</text>
<text class="t" x="364" y="447" text-anchor="start">identity_source: shared-token | credential</text>
<text class="t" x="364" y="464" text-anchor="start">→ $NOVAFABRIC_HOME/dashboard-audit.jsonl</text>
<rect class="card" x="764" y="384" width="194" height="86" rx="10"/>
<rect class="f-ver" x="764" y="384" width="194" height="4" rx="2"/>
<text class="h" x="776" y="408" text-anchor="start">Route handler</text>
<text class="t" x="776" y="430" text-anchor="start">own verify_token check:</text>
<text class="t" x="776" y="447" text-anchor="start">401 if missing/invalid</text>
<text class="t" x="776" y="464" text-anchor="start">then the endpoint runs</text>
