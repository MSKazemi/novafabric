<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 676" width="980" height="676" role="img" aria-labelledby="t d">
<title id="t">nova serve: from request to handler</title>
<desc id="d">How nova serve decides whether a request may run. Start-up refuses multi-tenant mode while any read-path store is tenant-unsafe. Each request passes a Host guard, then one app-level dependency that maps the credential to a scope and the route to its required scope. Unclassified routes and insufficient scopes get 403 and an audit record. Step 1: Start-up: NOVAFABRIC_SERVE_TENANCY=multi exits with code 2 while any read-path store is unsafe. The default is single-tenant. Step 2: Every HTTP request first meets the Host guard: a Host header that is not localhost gets 403 host_not_localhost. Step 3: One app-level dependency, enforce_scope, maps the credential: the server token holds admin, an issued token its minted scope. Step 4: required_scope looks up (method, route template). A public route or an unknown credential goes on to the route, which answers 401. Step 5: If the held scope does not satisfy the route, or the route is unclassified, the answer is 403 and one authz.denied record is appended. Step 6: Scope satisfied: the route's own verify_token checks the credential again and the endpoint runs.</desc>
