<circle class="f-seal" cx="48" cy="534" r="8"/>
<text class="num" x="48" y="538" style="fill:var(--bg)">1</text>
<text class="t" x="64" y="538" text-anchor="start">Start-up: NOVAFABRIC_SERVE_TENANCY=multi exits with code 2 while any read-path store is unsafe. The default is single-tenant.</text>
<rect class="k lit f-rep" x="30" y="545" width="920" height="20" rx="5" style="animation-delay:3.4s"/>
<circle class="f-rep" cx="48" cy="555" r="8"/>
<text class="num" x="48" y="559" style="fill:var(--bg)">2</text>
<text class="t" x="64" y="559" text-anchor="start">Every HTTP request first meets the Host guard: a Host header that is not localhost gets 403 host_not_localhost.</text>
<rect class="k lit f-seal" x="30" y="566" width="920" height="20" rx="5" style="animation-delay:6.8s"/>
<circle class="f-seal" cx="48" cy="576" r="8"/>
<text class="num" x="48" y="580" style="fill:var(--bg)">3</text>
<text class="t" x="64" y="580" text-anchor="start">One app-level dependency, enforce_scope, maps the credential: the server token holds admin, an issued token its minted scope.</text>
<rect class="k lit f-seal" x="30" y="587" width="920" height="20" rx="5" style="animation-delay:10.2s"/>
<circle class="f-seal" cx="48" cy="597" r="8"/>
<text class="num" x="48" y="601" style="fill:var(--bg)">4</text>
<text class="t" x="64" y="601" text-anchor="start">required_scope looks up (method, route template). A public route or an unknown credential goes on to the route, which answers 401.</text>
<rect class="k lit f-warn" x="30" y="608" width="920" height="20" rx="5" style="animation-delay:13.6s"/>
<circle class="f-warn" cx="48" cy="618" r="8"/>
<text class="num" x="48" y="622" style="fill:var(--bg)">5</text>
<text class="t" x="64" y="622" text-anchor="start">If the held scope does not satisfy the route, or the route is unclassified, the answer is 403 and one authz.denied record is appended.</text>
<rect class="k lit f-ver" x="30" y="629" width="920" height="20" rx="5" style="animation-delay:17s"/>
<circle class="f-ver" cx="48" cy="639" r="8"/>
<text class="num" x="48" y="643" style="fill:var(--bg)">6</text>
<text class="t" x="64" y="643" text-anchor="start">Scope satisfied: the route's own verify_token checks the credential again and the endpoint runs.</text>
