id: soc2-type2-v1
name: SOC 2 Type 2 — AI System Controls
framework: SOC 2 Type 2
version: "2017"
# Criterion identifiers only. Titles and descriptions are NovaFabric's own summaries,
# not AICPA text; load your licensed catalog with `--profile path.yaml` for the wording.
controls:
  - id: CC6.1-LOGICAL-ACCESS
    title: Controlling software access (CC6.1)
    description: >
      Tool-permission and policy-decision records showing which tools agents were
      allowed or denied during a run.
    evidence_requirements:
      - evidence_type: tool_permissions
        required: true
        description: Tool permission events showing logical access control enforcement
      - evidence_type: policy_events
        required: true
        description: Policy decision events documenting access control decisions

  - id: CC6.6-THREAT-MITIGATION
    title: Defending the boundary against external threats (CC6.6)
    description: >
      Policy-decision records showing requests that were blocked by policy during a run.
    evidence_requirements:
      - evidence_type: policy_events
        required: true
        description: Policy enforcement events documenting threat detection and mitigation

  - id: CC6.7-DATA-TRANSMISSION
    title: Protecting data in transit (CC6.7)
    description: >
      A personal-data redaction manifest for the run and, optionally, a seal that
      makes later changes to the recorded data detectable.
    evidence_requirements:
      - evidence_type: pii_scan
        required: true
        description: PII scan evidence showing personal data protection in AI outputs
      - evidence_type: seal_signature
        required: false
        description: Cryptographic seals verifying integrity of transmitted data

  - id: CC7.1-MONITORING
    title: Spotting configuration changes and weaknesses (CC7.1)
    description: >
      A per-run record of model calls and, optionally, lineage records that help
      trace what changed between runs.
    evidence_requirements:
      - evidence_type: model_calls
        required: true
        description: Run capsules providing continuous monitoring trail of AI system operation
      - evidence_type: lineage
        required: false
        description: Lineage graph for change tracking and impact assessment

  - id: CC7.2-ANOMALY-MONITORING
    title: Watching for unusual system behaviour (CC7.2)
    description: >
      A per-run record of model calls, and optionally policy decisions, that a
      reviewer can examine for unusual behaviour.
    evidence_requirements:
      - evidence_type: model_calls
        required: true
        description: Run capsules enabling anomaly detection in AI system behaviour
      - evidence_type: policy_events
        required: false
        description: Policy events capturing anomaly responses

  - id: CC9.1-RISK-ASSESSMENT
    title: Responding to business-disruption risk (CC9.1)
    description: >
      Policy-decision records that document how risky actions were handled during a run.
    evidence_requirements:
      - evidence_type: policy_events
        required: true
        description: Policy decision events documenting risk assessment outcomes

  - id: CC9.2-VENDOR-RISK
    title: Third-party supplier risk (CC9.2)
    description: >
      Records of which third-party models a run called and, optionally, lineage
      showing where models and data came from.
    evidence_requirements:
      - evidence_type: model_calls
        required: true
        description: Run capsules capturing third-party AI model usage for vendor risk evidence
      - evidence_type: lineage
        required: false
        description: Lineage records showing third-party model and data provenance
