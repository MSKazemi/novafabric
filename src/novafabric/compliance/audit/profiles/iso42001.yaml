id: iso42001-v1
name: ISO/IEC 42001 — AI Management System
framework: ISO/IEC 42001
version: "2023"
# Clause numbers only. Titles and descriptions are NovaFabric's own summaries, not
# ISO text; load your licensed catalog with `--profile path.yaml` for the wording.
controls:
  - id: ISO42-4.1-CONTEXT
    title: Organisational context (§4.1)
    description: >
      Per-run records of the model calls each AI system made.
    evidence_requirements:
      - evidence_type: model_calls
        required: true
        description: Run capsules documenting AI system context and operational environment

  - id: ISO42-6.1-RISK-OPPORTUNITIES
    title: Addressing risks and opportunities (§6.1)
    description: >
      Policy-decision records showing actions taken in response to risky requests.
    evidence_requirements:
      - evidence_type: policy_events
        required: true
        description: Policy decision events as evidence of risk-response actions

  - id: ISO42-7.4-COMMUNICATION
    title: Communication (§7.4)
    description: >
      A per-run record of model interactions that can support reporting on AI
      system behaviour.
    evidence_requirements:
      - evidence_type: model_calls
        required: true
        description: Run capsules providing communication audit trail for AI system

  - id: ISO42-7.5-DOCUMENTED-INFORMATION
    title: Documented information (§7.5)
    description: >
      Per-run records and, optionally, a seal that makes later changes to those
      records detectable.
    evidence_requirements:
      - evidence_type: model_calls
        required: true
        description: Run capsules as the documented record of AI system operation
      - evidence_type: seal_signature
        required: false
        description: Cryptographic seals ensuring integrity of AI system records

  - id: ISO42-8.1-OPERATIONAL-PLANNING
    title: Operating AI processes under control (§8.1)
    description: >
      Run records, tool-permission decisions and, optionally, lineage showing how AI
      processes were executed and constrained.
    evidence_requirements:
      - evidence_type: model_calls
        required: true
        description: Operational run capsules documenting AI system execution
      - evidence_type: tool_permissions
        required: true
        description: Tool permission records showing operational access controls
      - evidence_type: lineage
        required: false
        description: Lineage records for process traceability

  - id: ISO42-8.4-AI-SYSTEM-IMPACT
    title: AI system impact assessment (§8.4)
    description: >
      Policy decisions and, optionally, a personal-data redaction manifest that can
      feed an assessment of impacts on people.
    evidence_requirements:
      - evidence_type: policy_events
        required: true
        description: Policy decision events documenting impact assessment outcomes
      - evidence_type: pii_scan
        required: false
        description: PII scan evidence showing assessment of personal data impact

  - id: ISO42-9.1-MONITORING-EVAL
    title: Monitoring and evaluating performance (§9.1)
    description: >
      Per-run records of model calls and, optionally, lineage that can feed the
      monitoring of AI system performance.
    evidence_requirements:
      - evidence_type: model_calls
        required: true
        description: Evaluation run capsules with performance measurements
      - evidence_type: lineage
        required: false
        description: Lineage for tracing evaluation history

  - id: ISO42-10.1-CONTINUAL-IMPROVEMENT
    title: Continual improvement (§10.1)
    description: >
      Historical run records and, optionally, policy decisions that support analysis
      of improvement over time.
    evidence_requirements:
      - evidence_type: model_calls
        required: true
        description: Historical run capsules enabling continual improvement analysis
      - evidence_type: policy_events
        required: false
        description: Policy decisions documenting improvement-driven changes
