# Automated dependency-update PRs (ADR-0186).
#
# Weekly cadence, grouped updates: patch + minor bumps are grouped per
# ecosystem so the lockfiles stay current without PR noise; major bumps stay
# individual PRs. Every Dependabot PR still passes the existing gates — CI,
# the dependency license policy (ADR-0024), and the pip-audit gate.
#
# Dependabot is dev-infra service configuration, not a runtime or dev
# dependency; ADR-0024's license tiers apply to the updated packages it
# proposes, not to the service itself (ADR-0186).
#
# EVERY publicly-tracked manifest must appear below. Dependabot only looks
# where it is pointed, so a manifest with no entry here is silently
# unmonitored — it does not warn, it simply never proposes a fix. That gap is
# how `examples/`, `packages/` and `collector/` accumulated vulnerable
# dependencies while the root lockfile was kept clean. Re-check with:
#
#   git ls-files | grep -E '(uv\.lock|package-lock\.json|go\.mod|Dockerfile)$'
#
# and confirm each result is covered by a directory or directories entry.
version: 2
updates:
  # Python dependencies. The repo is uv-managed (pyproject.toml + uv.lock),
  # so the dedicated uv ecosystem keeps the lockfile authoritative.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The OpenTelemetry API/SDK pair is held by google-adk, not by us. uv.lock is
      # ONE universal resolution over every extra, and novafabric[google-adk]
      # (google-adk>=2.6.2) caps opentelemetry-api/-sdk at <=1.43 (2.7.0) and at
      # <=1.42.1 (2.7.1 and later, incl. 2.11.0). Any newer OpenTelemetry is
      # therefore unresolvable for the lock, so Dependabot's update job failed with
      # `dependency_file_not_resolvable` (2026-10-08, otel 1.45.0 / 0.66b0) — and
      # resolving 1.43 instead silently DOWNGRADES google-adk to 2.7.0.
      # fastapi is held for the same reason: fastapi>=0.142 requires
      # opentelemetry-api>=1.44.
      # opentelemetry-proto is independent of this cap and keeps flowing.
      #
      # Drop these four entries when google-adk lifts its OpenTelemetry ceiling.
      # Check with:  uv lock --dry-run -P opentelemetry-sdk -P fastapi
      # — the cap is gone when that moves opentelemetry-sdk past 1.42.1 WITHOUT
      # a "google-adk v2.x -> v2.7.0" downgrade line.
      - dependency-name: "opentelemetry-api"
        versions: [">=1.43"]
      - dependency-name: "opentelemetry-sdk"
        versions: [">=1.43"]
      - dependency-name: "opentelemetry-semantic-conventions"
        versions: [">=0.64b0"]
      - dependency-name: "fastapi"
        versions: [">=0.142"]
    open-pull-requests-limit: 10

  # GitHub Actions used by the workflows in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"

  # Standalone Python projects that carry their own lockfile and are therefore
  # NOT resolved by the root uv.lock. There is no [tool.uv.workspace] table, so
  # nothing about the root entry above reaches these.
  - package-ecosystem: "uv"
    directories:
      - "/examples/plugin-hook-reference"
      - "/packages/nova_worm_conformance"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # examples/plugin-hook-reference takes novafabric from the working tree
      # ([tool.uv.sources] novafabric = { path = "../..", editable = true }), so
      # its version is whatever pyproject.toml at the root says. Dependabot treats
      # it as a PyPI pin and tries `novafabric==<latest PyPI>`, which can never
      # match the local path's version: the job failed with
      # `dependency_file_not_resolvable` on 2026-10-08 (0.103.0 vs local 0.104.0).
      # Refresh this lock with `uv lock` in that directory after a version bump.
      - dependency-name: "novafabric"
    open-pull-requests-limit: 5

  # npm workspaces. Each directory gets its own PRs; the group applies within
  # a directory, not across them.
  - package-ecosystem: "npm"
    directories:
      - "/ui/dashboard"
      - "/packages/nova-sdk-ts"
      - "/packages/nova-dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      web-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

  # The Go collector. An entire language ecosystem that went unwatched until
  # 2026-08-06 — nats-server and the CloudEvents SDK both ship security
  # releases, and none of them were being surfaced.
  - package-ecosystem: "gomod"
    directory: "/collector"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # ⚠ Do not read "minor-patch" as "low risk" for this ecosystem. PR #52 came
      # through this group carrying component, processor, receiver, exporter and
      # extension across a v0 -> v1 transition, and otelcol up 54 minor versions.
      # Go module resolution drags the rest of a release train along to stay
      # consistent, and that resolution is not filtered by update-types.
      #
      # It also did not compile: the same PR left go.opentelemetry.io/collector
      # itself at v0.104.0 while everything else moved to v0.158.0, so xconnector
      # bound to a fanoutconsumer that had since been split into its own module.
      # CI caught it — Build Artifacts, Lint, Unit Tests and the Vulnerability
      # Scan all failed on the unresolved symbol.
      #
      # So the group is kept, and the gate is CI rather than the label: review a
      # go-minor-patch PR by reading its go.mod diff, not by trusting its title.
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  # Docker base images (runtime image; ADR-0186 names these explicitly).
  - package-ecosystem: "docker"
    directory: "/deploy/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # The runtime image tracks the interpreter the test suite actually runs on.
      # ci.yml is Python 3.12 only, and pyproject.toml deliberately claims no
      # classifier beyond 3.12 "until CI grows a matrix that exercises them" —
      # so a 3.14 base image would ship users a runtime nothing here has tested.
      # PR #55 proposed exactly that, skipping 3.13 outright.
      #
      # Patch updates still flow, which is what carries the CPython security
      # fixes. Lift this when the CI matrix gains the newer interpreter.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
