# Automated dependency-update PRs (ADR-0186).
#
# Weekly cadence, grouped updates: patch + minor bumps are grouped per
# ecosystem so the lockfiles stay current without PR noise; major bumps stay
# individual PRs. Every Dependabot PR still passes the existing gates — CI,
# the dependency license policy (ADR-0024), and the pip-audit gate.
#
# Dependabot is dev-infra service configuration, not a runtime or dev
# dependency; ADR-0024's license tiers apply to the updated packages it
# proposes, not to the service itself (ADR-0186).
#
# EVERY publicly-tracked manifest must appear below. Dependabot only looks
# where it is pointed, so a manifest with no entry here is silently
# unmonitored — it does not warn, it simply never proposes a fix. That gap is
# how `examples/`, `packages/` and `collector/` accumulated vulnerable
# dependencies while the root lockfile was kept clean. Re-check with:
#
#   git ls-files | grep -E '(uv\.lock|package-lock\.json|go\.mod|Dockerfile)$'
#
# and confirm each result is covered by a directory or directories entry.
version: 2
updates:
  # Python dependencies. The repo is uv-managed (pyproject.toml + uv.lock),
  # so the dedicated uv ecosystem keeps the lockfile authoritative.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # fastapi 0.137+ (starlette 1.4 route mounting) is a KNOWN incompatibility,
      # not a stale pin. It regresses the Prometheus route label from template to
      # raw path and breaks two self-trace privacy assertions. Established
      # 2026-08-05 and re-confirmed by PR #53, which failed exactly the five tests
      # the pyproject.toml comment predicted.
      #
      # Dependabot rewrites the `fastapi<0.137` constraint in pyproject.toml
      # rather than respecting it, so the manifest bound alone does not stop the
      # bump — only this rule does.
      #
      # Lift this together with the four pyproject.toml bounds, and only with
      # tests/test_server_observability.py and tests/test_server_selftrace.py green.
      - dependency-name: "fastapi"
        versions: [">=0.137"]
    open-pull-requests-limit: 10

  # GitHub Actions used by the workflows in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"

  # Standalone Python projects that carry their own lockfile and are therefore
  # NOT resolved by the root uv.lock. There is no [tool.uv.workspace] table, so
  # nothing about the root entry above reaches these.
  - package-ecosystem: "uv"
    directories:
      - "/examples/plugin-hook-reference"
      - "/packages/nova_worm_conformance"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  # npm workspaces. Each directory gets its own PRs; the group applies within
  # a directory, not across them.
  - package-ecosystem: "npm"
    directories:
      - "/web"
      - "/packages/nova-sdk-ts"
      - "/packages/nova-dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      web-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

  # The Go collector. An entire language ecosystem that went unwatched until
  # 2026-08-06 — nats-server and the CloudEvents SDK both ship security
  # releases, and none of them were being surfaced.
  - package-ecosystem: "gomod"
    directory: "/collector"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  # Docker base images (runtime image; ADR-0186 names these explicitly).
  - package-ecosystem: "docker"
    directory: "/deploy/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # The runtime image tracks the interpreter the test suite actually runs on.
      # ci.yml is Python 3.12 only, and pyproject.toml deliberately claims no
      # classifier beyond 3.12 "until CI grows a matrix that exercises them" —
      # so a 3.14 base image would ship users a runtime nothing here has tested.
      # PR #55 proposed exactly that, skipping 3.13 outright.
      #
      # Patch updates still flow, which is what carries the CPython security
      # fixes. Lift this when the CI matrix gains the newer interpreter.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
