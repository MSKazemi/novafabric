name: Scan candidate image
description: >-
  The release image gate (the release scan policy, issue #218). Scans ONE image digest
  once per shipped platform and fails the job on any fixable CRITICAL finding,
  crash, timeout or missing platform. Used by publish-image.yml (the real
  candidate) and release-toolchain.yml (fixtures), so the pull-request run
  executes the gate that a release uses.
inputs:
  image-ref:
    description: "REPO@sha256:<digest> -- a digest, never a tag"
    required: true
runs:
  using: composite
  steps:
    - name: Refuse anything that is not a digest reference
      shell: bash
      env:
        REF: ${{ inputs.image-ref }}
      run: |
        if ! [[ "$REF" =~ @sha256:[0-9a-f]{64}$ ]]; then
          echo "::error::scan target must be REPO@sha256:<64 hex>, got '$REF'"
          exit 1
        fi

    # Evidence, all severities, both platforms, as JSON. These never fail on findings
    # (exit-code 0) but still fail on a crash. They run BEFORE the gates so that
    # both platforms' reports exist even when the first gate stops the job.
    # `scripts/release_image.py check-reports` (and `promote`) later require, per
    # platform, a report that names the scanned digest and the right architecture:
    # the gate steps below prove trivy exited 0, the reports prove WHAT it scanned.
    # The first step installs the pinned trivy and fills the vulnerability DB cache;
    # every later step reuses both.
    - name: Report (trivy, all severities, linux/amd64 - evidence)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      env:
        TRIVY_PLATFORM: linux/amd64
      with:
        image-ref: ${{ inputs.image-ref }}
        format: json
        output: trivy-report-linux-amd64.json
        exit-code: "0"
        version: v0.76.2
    - name: Report (trivy, all severities, linux/arm64 - evidence)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      env:
        TRIVY_PLATFORM: linux/arm64
        TRIVY_SKIP_DB_UPDATE: true
        TRIVY_SKIP_JAVA_DB_UPDATE: true
      with:
        image-ref: ${{ inputs.image-ref }}
        format: json
        output: trivy-report-linux-arm64.json
        exit-code: "0"
        skip-setup-trivy: true

    # The gate: one step per shipped platform, fixable CRITICAL only (the release scan policy).
    # Unfixable criticals appear in the reports above but do not wedge a release
    # behind upstream base-image lag; if they persist they enter the waiver
    # discipline. trivy scans the runner's platform (amd64) unless told
    # otherwise, so each platform needs its own step.
    - name: Gate (trivy, fixable CRITICAL, linux/amd64)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      env:
        TRIVY_PLATFORM: linux/amd64
        TRIVY_SKIP_DB_UPDATE: true
        TRIVY_SKIP_JAVA_DB_UPDATE: true
      with:
        image-ref: ${{ inputs.image-ref }}
        severity: CRITICAL
        ignore-unfixed: true
        exit-code: "1"
        timeout: 8m
        skip-setup-trivy: true
    - name: Gate (trivy, fixable CRITICAL, linux/arm64)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      env:
        TRIVY_PLATFORM: linux/arm64
        TRIVY_SKIP_DB_UPDATE: true
        TRIVY_SKIP_JAVA_DB_UPDATE: true
      with:
        image-ref: ${{ inputs.image-ref }}
        severity: CRITICAL
        ignore-unfixed: true
        exit-code: "1"
        timeout: 8m
        skip-setup-trivy: true
