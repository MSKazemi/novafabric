name: "NovaFabric Capture"
description: >-
  Run a command and capture it as a portable, schema-valid, secret-scanned
  NovaFabric Run Capsule — then upload it as a build artifact you can replay and
  diff months later.
author: "NovaFabric"

branding:
  icon: "archive"
  color: "green"

inputs:
  run:
    description: "The command to capture. Runs under `nova capture`."
    required: true
  environment:
    description: >-
      Deployment environment recorded on the capsule (ADR-0126). Defaults to
      `test`, which is in NovaFabric's conventional set
      {development, test, staging, production}. A custom value like `ci` is
      legitimate and recorded verbatim, but `nova validate` prints a warning for
      anything outside that set — and a warning on every CI run just teaches
      people to ignore warnings.
    required: false
    default: "test"
  timeout:
    description: "Wall-clock deadline in seconds for the captured command. Empty uses `nova capture`'s default of 600 seconds; the workload is killed (exit 124) when it is exceeded. Set a larger value for long jobs."
    required: false
    default: ""
  validate:
    description: "Run `nova validate` on the capsule. An invalid capsule is still uploaded, and the action then fails (exit 1, or the captured command's own exit code if that failed too)."
    required: false
    default: "true"
  upload-artifact:
    description: "Upload the capsule as a workflow artifact."
    required: false
    default: "true"
  artifact-name:
    description: "Name for the uploaded artifact."
    required: false
    default: "novafabric-capsule"
  retention-days:
    description: "How long to retain the artifact."
    required: false
    default: "90"
  novafabric-version:
    description: >-
      Version passed to the installer (uv), e.g. `0.100.1`. Empty installs the
      latest release. **Pin this** if you want reproducible CI.
    required: false
    default: ""
  python-version:
    description: "Python version. NovaFabric requires 3.12+."
    required: false
    default: "3.12"
  extras:
    description: >-
      Optional extras to install, e.g. `all`. Empty installs the core package —
      what most CI needs, and ~113 MB rather than ~412 MB.
    required: false
    default: ""

outputs:
  run-id:
    description: "ULID of the captured run."
    value: ${{ steps.capture.outputs.run-id }}
  capsule-path:
    description: "Filesystem path to the capsule directory."
    value: ${{ steps.capture.outputs.capsule-path }}
  status:
    description: >-
      `success` or `failure` — the captured command's own outcome. **Empty when
      the action fails**; GitHub does not propagate a composite action's outputs
      in that case. Use `$NOVAFABRIC_STATUS`, which is also exported and does
      survive.
    value: ${{ steps.capture.outputs.status }}
  exit-code:
    description: "The captured command's exit code."
    value: ${{ steps.capture.outputs.exit-code }}
  valid:
    description: >-
      `true` or `false` — whether `nova validate` accepted the capsule. Empty when
      `validate: false`, and (like every output) empty when the action fails; use
      `$NOVAFABRIC_VALID`, which is also exported and survives.
    value: ${{ steps.validate.outputs.valid }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        # The cache would key on files in the CALLER's repository, which says
        # nothing about this install; keep the action's footprint to its job.
        enable-cache: false

    - name: Install NovaFabric
      shell: bash
      run: |
        set -euo pipefail
        spec="novafabric"
        if [ -n "${{ inputs.extras }}" ]; then
          spec="novafabric[${{ inputs.extras }}]"
        fi
        if [ -n "${{ inputs.novafabric-version }}" ]; then
          spec="${spec}==${{ inputs.novafabric-version }}"
        fi
        # Into the interpreter set up above — the same environment pip used, so
        # `nova` and `import novafabric` resolve exactly as before — via uv.
        uv pip install --quiet --python "$(command -v python)" "${spec}"
        nova --version

    - name: Capture
      id: capture
      shell: bash
      run: |
        # `set +e` is load-bearing and must come first. GitHub runs composite
        # `shell: bash` steps as `bash --noprofile --norc -eo pipefail {0}` — so
        # -e is ALREADY ON, and `set -uo pipefail` does not turn it off. Without
        # the explicit `+e`, a captured command exiting non-zero aborts this step
        # before `capture_rc=$?` runs, the composite action abandons its
        # remaining steps, and the capsule is never uploaded. That is exactly how
        # the first two versions of this action failed.
        set +e
        set -uo pipefail
        out_dir="${RUNNER_TEMP}/novafabric-capsules"
        mkdir -p "${out_dir}"

        args=(--environment "${{ inputs.environment }}" --output-dir "${out_dir}")
        if [ -n "${{ inputs.timeout }}" ]; then
          args+=(--timeout "${{ inputs.timeout }}")
        fi

        # `--` separates NovaFabric's own flags from the captured command's.
        nova capture "${args[@]}" -- ${{ inputs.run }}
        capture_rc=$?

        # A crashed run is captured evidence, not lost state — NovaFabric writes a
        # complete capsule with `status: failure`. So locate the capsule regardless
        # of the exit code, and only then decide whether to fail the step.
        capsule="$(find "${out_dir}" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
        if [ -z "${capsule}" ]; then
          echo "::error title=No capsule::nova capture produced no capsule directory."
          exit 1
        fi

        run_id="$(basename "${capsule}")"
        status="success"
        [ "${capture_rc}" -eq 0 ] || status="failure"

        {
          echo "run-id=${run_id}"
          echo "capsule-path=${capsule}"
          echo "status=${status}"
          echo "exit-code=${capture_rc}"
        } >> "${GITHUB_OUTPUT}"

        # Also as environment variables. A composite action's declared `outputs`
        # are EMPTY to the calling workflow when the action fails, so a caller
        # that wants the capsule after a failed capture cannot read them.
        # GITHUB_ENV survives.
        {
          echo "NOVAFABRIC_RUN_ID=${run_id}"
          echo "NOVAFABRIC_CAPSULE_PATH=${capsule}"
          echo "NOVAFABRIC_STATUS=${status}"
        } >> "${GITHUB_ENV}"

        {
          echo "### NovaFabric capture"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| Run ID | \`${run_id}\` |"
          echo "| Status | \`${status}\` |"
          echo "| Environment | \`${{ inputs.environment }}\` |"
        } >> "${GITHUB_STEP_SUMMARY}"

        # Deliberately exits 0 even when the captured command failed. A composite
        # action ABORTS its remaining steps once one of them fails — `always()`
        # does not rescue them — so failing here would skip the validate and
        # upload below and lose the capsule from precisely the run that needed
        # it. Measured, not assumed: the first version of this action failed that
        # way and uploaded nothing for a crashing command. The real exit code is
        # re-raised by the last step instead.
        exit 0

    - name: Validate the capsule
      id: validate
      if: ${{ inputs.validate == 'true' }}
      shell: bash
      run: |
        # Records the verdict and exits 0 on purpose, for the same reason as the
        # capture step: a failing step here would abandon the upload below, and an
        # invalid capsule is still evidence. The last step fails the job instead.
        set +e
        nova validate "${{ steps.capture.outputs.capsule-path }}"
        rc=$?
        if [ "${rc}" -eq 0 ]; then valid=true; else valid=false; fi
        {
          echo "valid=${valid}"
          echo "validate-exit-code=${rc}"
        } >> "${GITHUB_OUTPUT}"
        # Declared outputs are empty to the caller when the action fails; GITHUB_ENV survives.
        echo "NOVAFABRIC_VALID=${valid}" >> "${GITHUB_ENV}"
        echo "| Valid | \`${valid}\` |" >> "${GITHUB_STEP_SUMMARY}"
        exit 0

    - name: Upload the capsule
      if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.capture.outputs.capsule-path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error

    - name: Propagate the captured command's exit code
      # Last, so the capsule is validated and uploaded before the step fails.
      # The calling workflow still sees the command's own exit code; when the
      # command succeeded but the capsule is invalid, the job fails with exit 1.
      shell: bash
      run: |
        rc="${{ steps.capture.outputs.exit-code }}"
        valid="${{ steps.validate.outputs.valid }}"
        validate_rc="${{ steps.validate.outputs.validate-exit-code }}"
        run_id="${{ steps.capture.outputs.run-id }}"
        invalid_note=""
        if [ "${valid}" = "false" ]; then
          invalid_note="; nova validate rejected the capsule (exit ${validate_rc})"
        fi
        if [ "${rc}" != "0" ]; then
          echo "::error title=Captured command failed::exited ${rc}; capsule ${run_id} was still captured and uploaded${invalid_note}"
          exit "${rc}"
        fi
        if [ "${valid}" = "false" ]; then
          echo "::error title=Invalid capsule::nova validate rejected capsule ${run_id} (exit ${validate_rc}); it was still uploaded as artifact ${{ inputs.artifact-name }}"
          exit 1
        fi
