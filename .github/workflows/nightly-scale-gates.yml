name: Nightly scale & concurrency gates

# The default CI tier deliberately skips the infra-gated tests (NOVA_INTEGRATION=1):
# concurrent chain writers, Postgres Merkle log, 100K-row scale migration, the
# S3-compatible conditional-PUT (OCC) path, the 1M-replay rebuild bench. Those
# are exactly the highest-risk scalability/concurrency paths (2026-07-16
# audit), so this scheduled tier runs them nightly with real services instead
# of leaving them permanently skipped.
#
# Deliberately NOT wired into PR CI: these jobs are slow and service-heavy.
# Still skipped even here (documented in the backlog plan, Bucket C):
#   - pgBouncer cross-tenant isolation (needs the docker-compose.eval.yaml rig)
#   - live Slurm / real HSM / cloud-KMS verification

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-scale:
    runs-on: ubuntu-latest
    # CI and every other action belong to the PUBLIC repository. The private
    # mirror carries the same .github/ tree, so without this it runs the whole
    # suite again on billable minutes and leaves that repo permanently red.
    if: github.repository == 'MSKazemi/novafabric'
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: novafabric_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project + all extras
        # --all-extras: the gated tiers exercise psycopg/testcontainers/etc.
        run: uv sync --frozen --all-extras

      - name: Run Postgres schema migrations
        env:
          NOVAFABRIC_POSTGRES_DSN: postgresql://postgres:test@localhost:5432/novafabric_test
        run: uv run alembic -c alembic-postgres.ini upgrade head

      - name: Postgres + testcontainers tiers
        env:
          NOVA_INTEGRATION: "1"
          NOVA_TEST_POSTGRES_DSN: postgresql://postgres:test@localhost:5432/novafabric_test
          NOVAFABRIC_TEST_POSTGRES_DSN: postgresql://postgres:test@localhost:5432/novafabric_test
        # metadata_store spins its own ephemeral Postgres via testcontainers
        # (Docker is available on ubuntu runners); the seal tier uses the
        # service container's DSN directly.
        run: >-
          uv run pytest
          tests/metadata_store
          tests/seal/test_postgres_merkle.py
          tests/integration
          -q --timeout=600

  object-store-scale:
    runs-on: ubuntu-latest
    # CI and every other action belong to the PUBLIC repository. The private
    # mirror carries the same .github/ tree, so without this it runs the whole
    # suite again on billable minutes and leaves that repo permanently red.
    if: github.repository == 'MSKazemi/novafabric'
    timeout-minutes: 45

    # S3 endpoint: SeaweedFS (Apache-2.0), pinned by digest.
    #
    # History: this job ran MinIO and lost its image three times —
    # `bitnami/minio` (retired 2026-08-05), Docker Hub `minio/minio` (removed
    # ~2026-09-17), then `quay.io/minio/minio:latest`, which now refuses an
    # anonymous pull — "unauthorized", exit 125 (run 37913204453, 2026-10-09);
    # quay's anonymous token for minio/minio carries no pull action. MinIO is also AGPL-3.0, Tier C under ADR-0024 ("replace with
    # a Tier-A S3-compatible alternative"), so the fix is to stop depending on
    # it rather than chase a fourth mirror.
    #
    # Why SeaweedFS: Apache-2.0 (upstream LICENSE); its official image
    # `chrislusf/seaweedfs` is pulled anonymously from Docker Hub; one
    # `weed server -s3` process gives path-style S3 (what boto3 sends to a
    # localhost endpoint_url), CreateBucket, PutObject/GetObject and — the one
    # semantic the OCC test exists for — `If-None-Match: *` on PutObject
    # answering 412 PreconditionFailed when the key exists
    # (weed/s3api/s3api_object_handlers_put.go, validateConditionalHeaders,
    # tag 4.48). The tests need no Object Lock, versioning or multipart.
    # versitygw (also Apache-2.0) was the alternative; SeaweedFS was chosen
    # because one container needs no backend setup and its conditional-PUT
    # handling was read in source at the pinned tag.
    #
    # The digest is the multi-arch index of tag 4.48 (latest stable,
    # 2026-09-28), read from registry-1.docker.io's Docker-Content-Digest.
    # Bump tag and digest together. AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
    # make SeaweedFS create a static admin identity and enforce SigV4 auth;
    # they are throwaway CI constants, not secrets.
    # -master.telemetry=false: no usage report leaves the runner.
    #
    # The tests read S3COMPAT_* and use the generic S3WormAdapter, so a pass
    # here is recorded as an S3-compatible confirmation, never as a MinIO one
    # (the MinIO-specific test stays skipped: MINIO_ENDPOINT is unset).
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Start SeaweedFS (S3 gateway)
        env:
          SEAWEEDFS_IMAGE: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
        run: |
          docker run -d --name seaweedfs \
            -p 9000:8333 \
            -e AWS_ACCESS_KEY_ID=novatest \
            -e AWS_SECRET_ACCESS_KEY=novatest-secret \
            "$SEAWEEDFS_IMAGE" \
            server -s3 -s3.port=8333 -ip.bind=0.0.0.0 -master.telemetry=false
          # /healthz only proves the S3 gateway is listening; the filer and
          # the volume server can still be registering, so readiness is
          # proven by the bucket + probe write in the next step.
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:9000/healthz >/dev/null; then
              echo "SeaweedFS S3 gateway is up"; exit 0
            fi
            sleep 1
          done
          echo "SeaweedFS S3 gateway did not come up within 90s"
          docker logs seaweedfs; exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project + all extras
        run: uv sync --frozen --all-extras

      - name: Create the OCC test bucket and prove a write lands
        # The tests take the bucket as given and never create it, so a missing
        # bucket would surface as NoSuchBucket on the first PutObject rather
        # than as a setup error. The probe put/get/delete retries until the
        # volume server accepts writes, which /healthz alone does not prove.
        env:
          AWS_ACCESS_KEY_ID: novatest
          AWS_SECRET_ACCESS_KEY: novatest-secret
        run: |
          uv run python - <<'PY' || { docker logs seaweedfs; exit 1; }
          import time

          import boto3
          from botocore.config import Config

          client = boto3.client(
              "s3",
              endpoint_url="http://localhost:9000",
              config=Config(signature_version="s3v4"),
              region_name="us-east-1",
          )
          deadline = time.monotonic() + 120
          while True:
              try:
                  names = [b["Name"] for b in client.list_buckets()["Buckets"]]
                  if "nova-occ-test" not in names:
                      client.create_bucket(Bucket="nova-occ-test")
                  client.put_object(Bucket="nova-occ-test", Key="_ci_probe", Body=b"ok")
                  body = client.get_object(Bucket="nova-occ-test", Key="_ci_probe")["Body"].read()
                  assert body == b"ok", body
                  client.delete_object(Bucket="nova-occ-test", Key="_ci_probe")
                  break
              except Exception as exc:  # readiness retry; re-raised at the deadline
                  if time.monotonic() > deadline:
                      raise
                  print("not ready yet:", type(exc).__name__, exc)
                  time.sleep(2)
          print("buckets:", [b["Name"] for b in client.list_buckets()["Buckets"]])
          PY

      - name: Object-store concurrency + WORM + rebuild tiers
        env:
          NOVA_INTEGRATION: "1"
          S3COMPAT_ENDPOINT: http://localhost:9000
          S3COMPAT_ACCESS_KEY: novatest
          S3COMPAT_SECRET_KEY: novatest-secret
          S3COMPAT_BUCKET: nova-occ-test
          AWS_ACCESS_KEY_ID: novatest
          AWS_SECRET_ACCESS_KEY: novatest-secret
        run: uv run pytest tests/object_capsule_store -q --timeout=900

  # Dashboard endpoint latency at a 100K-row runs_cache (ADR-0199 §6).
  # SQLite-only — no service containers; thresholds live in the test file and
  # docs/ops/dashboard-scale.md.
  dashboard-scale:
    runs-on: ubuntu-latest
    # CI and every other action belong to the PUBLIC repository. The private
    # mirror carries the same .github/ tree, so without this it runs the whole
    # suite again on billable minutes and leaves that repo permanently red.
    if: github.repository == 'MSKazemi/novafabric'
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project + all extras
        run: uv sync --frozen --all-extras

      - name: Dashboard scale gate (100K rows, p95 thresholds)
        env:
          NOVA_DASHBOARD_SCALE: "1"
        run: uv run pytest tests/bench/test_dashboard_scale_gate.py -v --timeout=900
