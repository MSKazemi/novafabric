name: Nightly scale & concurrency gates

# The default CI tier deliberately skips the infra-gated tests (NOVA_INTEGRATION=1):
# concurrent chain writers, Postgres Merkle log, 100K-row scale migration, MinIO
# WORM end-to-end, the 1M-replay rebuild bench. Those are exactly the highest-risk
# scalability/concurrency paths (2026-07-16 audit), so this scheduled tier runs
# them nightly with real services instead of leaving them permanently skipped.
#
# Deliberately NOT wired into PR CI: these jobs are slow and service-heavy.
# Still skipped even here (documented in the backlog plan, Bucket C):
#   - pgBouncer cross-tenant isolation (needs the docker-compose.eval.yaml rig)
#   - live Slurm / real HSM / cloud-KMS verification

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: novafabric_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project + all extras
        # --all-extras: the gated tiers exercise psycopg/testcontainers/etc.
        run: uv sync --frozen --all-extras

      - name: Run Postgres schema migrations
        env:
          NOVAFABRIC_POSTGRES_DSN: postgresql://postgres:test@localhost:5432/novafabric_test
        run: uv run alembic -c alembic-postgres.ini upgrade head

      - name: Postgres + testcontainers tiers
        env:
          NOVA_INTEGRATION: "1"
          NOVA_TEST_POSTGRES_DSN: postgresql://postgres:test@localhost:5432/novafabric_test
          NOVAFABRIC_TEST_POSTGRES_DSN: postgresql://postgres:test@localhost:5432/novafabric_test
        # metadata_store spins its own ephemeral Postgres via testcontainers
        # (Docker is available on ubuntu runners); the seal tier uses the
        # service container's DSN directly.
        run: >-
          uv run pytest
          tests/metadata_store
          tests/seal/test_postgres_merkle.py
          tests/integration
          -q --timeout=600

  object-store-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # MinIO runs as an explicit step rather than a `services:` container.
    # Bitnami retired its free Docker Hub catalog, so `bitnami/minio:latest`
    # now returns "manifest unknown" and this job failed at container startup
    # every night from 2026-08-05 onward.  (The surviving `bitnamilegacy/*`
    # mirror is an unmaintained archive with no security updates — not a
    # dependency this project should adopt.)  The official `minio/minio` image
    # needs `server /data` as its command, and `services:` cannot supply one,
    # so the container is started here instead.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=novatest \
            -e MINIO_ROOT_PASSWORD=novatest-secret \
            minio/minio:latest server /data
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO is live"; exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become live within 60s"; docker logs minio; exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project + all extras
        run: uv sync --frozen --all-extras

      - name: Create the OCC test bucket
        # The tests take the bucket as given and never create it, so a missing
        # bucket surfaces as NoSuchBucket on the first PutObject rather than as
        # a setup error.  The retired Bitnami image was configurable to
        # pre-create buckets; the official image is not, and this job never set
        # that variable anyway — so this step is a genuine gap being closed,
        # not a port of previous behaviour.
        env:
          AWS_ACCESS_KEY_ID: novatest
          AWS_SECRET_ACCESS_KEY: novatest-secret
        run: |
          uv run python - <<'PY'
          import boto3
          from botocore.config import Config

          client = boto3.client(
              "s3",
              endpoint_url="http://localhost:9000",
              config=Config(signature_version="s3v4"),
              region_name="us-east-1",
          )
          client.create_bucket(Bucket="nova-occ-test")
          print("buckets:", [b["Name"] for b in client.list_buckets()["Buckets"]])
          PY

      - name: Object-store concurrency + WORM + rebuild tiers
        env:
          NOVA_INTEGRATION: "1"
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: novatest
          MINIO_SECRET_KEY: novatest-secret
          AWS_ACCESS_KEY_ID: novatest
          AWS_SECRET_ACCESS_KEY: novatest-secret
        run: uv run pytest tests/object_capsule_store -q --timeout=900

  # Dashboard endpoint latency at a 100K-row runs_cache (ADR-0199 §6).
  # SQLite-only — no service containers; thresholds live in the test file and
  # docs/ops/dashboard-scale.md.
  dashboard-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project + all extras
        run: uv sync --frozen --all-extras

      - name: Dashboard scale gate (100K rows, p95 thresholds)
        env:
          NOVA_DASHBOARD_SCALE: "1"
        run: uv run pytest tests/bench/test_dashboard_scale_gate.py -v --timeout=900
