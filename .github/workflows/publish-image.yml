name: Publish container image

# Builds the NovaFabric runtime image (deploy/docker/Dockerfile) and pushes a
# multi-arch (amd64 + arm64) image to GHCR. Docker Hub is an optional mirror:
# it is pushed only when the DOCKERHUB_TOKEN secret is configured, so this
# workflow is a no-op for Docker Hub until the user opts in.
#
# GHCR auth uses the built-in GITHUB_TOKEN (OIDC) — no stored secret required,
# mirroring the PyPI Trusted Publisher in publish-pypi.yml.
#
# Fires when a v* tag is pushed (same trigger as release.yml / publish-pypi.yml).
on:
  push:
    tags:
      - "v*"
  # Allow a manual re-publish from the Actions tab if a tag run needs a retry.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-green:
    # Nothing in this workflow publishes until CI has passed on this exact
    # commit (ADR-0316) — v0.106.0 shipped while it was red.
    if: github.repository == 'MSKazemi/novafabric'
    uses: ./.github/workflows/require-green-ci.yml
    permissions:
      actions: read
      contents: read

  image:
    needs: ci-green
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Publish only from the public repo. A tag pushed to the private mirror
    # (MSKazemi/novafabric-private) must never publish images.
    if: github.repository == 'MSKazemi/novafabric'
    permissions:
      contents: read
      # Required to push to GHCR with the built-in GITHUB_TOKEN.
      packages: write
      # Keyless cosign signing + SLSA provenance attestation use the OIDC token.
      id-token: write
      # actions/attest-build-provenance writes an attestation for the image.
      attestations: write
    env:
      # Presence of this secret toggles the optional Docker Hub mirror.
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          # Username is not sensitive; override with the DOCKERHUB_USERNAME repo
          # variable if it ever changes.
          username: ${{ vars.DOCKERHUB_USERNAME || 'kazemi' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # GHCR always; Docker Hub only when the mirror secret is present.
          # DOCKERHUB_REPO repo variable overrides the default namespace/name.
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ vars.DOCKERHUB_REPO || 'kazemi/novafabric' }},enable=${{ secrets.DOCKERHUB_TOKEN != '' }}
          # latest=auto (default flavor) tags :latest for non-prerelease semver tags.
          tags: |
            type=semver,pattern={{version}}
            # Fallbacks for `workflow_dispatch`. The comment above promises a
            # manual re-publish "if a tag run needs a retry", but with only the
            # semver rule a dispatch from a branch derives NO tags at all and
            # buildx fails with "tag is needed when pushing to registry" — so
            # the escape hatch was broken in exactly the situation it exists
            # for. Dispatching with `--ref v1.2.3` still takes the semver path;
            # these only apply when the ref is not a tag.
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attach an SBOM and SLSA build provenance to the image as OCI
          # referrers — the provenance product attesting its own build.
          sbom: true
          provenance: mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve the lowercase image reference
        # An OCI repository name MUST be lowercase, but `github.repository`
        # preserves the owner's case ("MSKazemi/novafabric"). docker/metadata-action
        # lowercases it for the build tags, which is why the push succeeds — but the
        # raw expression does not, and v0.102.0's signing step died on it:
        #   Error: signing [ghcr.io/MSKazemi/novafabric@sha256:...]:
        #          parsing reference: could not parse reference
        # The image shipped unsigned as a result. Resolve it once, here, and let
        # every downstream step consume the same value.
        id: image
        run: |
          echo "ref=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Sign the image (keyless, Sigstore/Fulcio + Rekor)
        # Signs the immutable digest, not the mutable tag. Keyless: the identity
        # is this workflow's OIDC token, logged transparently to Rekor.
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign "${{ steps.image.outputs.ref }}@${DIGEST}"

      - name: Attest build provenance (SLSA, GitHub-native)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.ref }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Scan image (trivy, full report — informational)
        # Vulnerability scan of the image we just published (ADR-0186).
        # This pass reports ALL severities for the release record and never
        # blocks by itself; the gate is the next step.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}:${{ steps.meta.outputs.version }}
          format: table
          output: trivy-report.txt
          exit-code: "0"

      - name: Upload trivy scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report-${{ github.sha }}
          path: trivy-report.txt
          retention-days: 90

      - name: Gate on fixable CRITICAL vulnerabilities (trivy)
        # ADR-0186: block the release on CRITICAL findings that have an
        # available fix. Unfixable criticals (ignore-unfixed) report in the
        # full scan above but do not wedge the release behind upstream
        # base-image lag; if they persist they enter the waiver discipline.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}:${{ steps.meta.outputs.version }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # trivy is already installed and its DB cached by the report step.
          skip-setup-trivy: true
        env:
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true
