# G-F: verified complete
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly scan — Mondays at 06:30 UTC.
    - cron: "30 6 * * 1"
  push:
    branches: [main]

# Least privilege, like every other workflow here: the one job below declares
# exactly what it needs, so nothing is granted at workflow level beyond reading
# the repository. scorecard-action forbids only workflow-level WRITE
# permissions when publish_results is on; `read-all` was broader than needed.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    # Slowest of 8 green runs to 2026-11-27: 53 s. The action pulls its image by tag
    # and retries a failed pull, so the cap bounds that retry loop too.
    timeout-minutes: 15
    # CI and every other action belong to the PUBLIC repository. The private
    # mirror carries the same .github/ tree, so without this it runs the whole
    # suite again on billable minutes and leaves that repo permanently red.
    if: github.repository == 'MSKazemi/novafabric'
    permissions:
      # Required to upload SARIF results to GitHub code scanning.
      security-events: write
      # Needed to publish results and retrieve Scorecard data for private repos.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to OSSF REST API (public repos only — safe to enable).
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
