name: Release

# Triggered when a v* tag is pushed. Creates a GitHub Release with notes
# extracted from docs/releases/<tag>.md (the source of truth for release
# notes — also linked from CHANGELOG.md and discoverable in-repo).
#
# Does NOT publish to PyPI — that requires repository secrets and is a
# user-driven decision per release.
on:
  push:
    tags:
      - "v*"

permissions:
  # Required to create the release. No write access to code.
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Locate release notes
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          notes_file="docs/releases/${tag}.md"
          if [ ! -f "$notes_file" ]; then
            echo "::error file=docs/releases::Missing release notes file: $notes_file"
            echo "Tag $tag was pushed but $notes_file does not exist." >&2
            exit 1
          fi
          # First H1 in the notes is the release title (drop the leading '# ').
          title=$(head -1 "$notes_file" | sed 's/^# //')
          if [ -z "$title" ]; then
            echo "::error file=$notes_file::First line is not an H1; cannot derive title"
            exit 1
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Interpolated into env, not into the script body: `title` is derived
          # from the first line of a file in the repo, so inlining it as
          # ${{ }} inside `run:` would let that line run as shell.
          RELEASE_TITLE: ${{ steps.notes.outputs.title }}
          RELEASE_NOTES: ${{ steps.notes.outputs.notes_file }}
        run: |
          # Two things create the release for a tag: this workflow, on the tag
          # push, and a human running the command `dualgit release` prints for
          # them. `gh release create` is not idempotent, so whichever arrived
          # second got HTTP 422 "Release.tag_name already exists" and the run
          # went red for a release that had in fact been published. That is
          # 6 of the last 10 runs of this workflow, including v0.99.0 — where
          # the release was created at 12:44:20Z and this step failed at
          # 12:44:35Z, 15 seconds behind.
          #
          # The job's contract is "a release exists for this tag with these
          # notes", and an existing release satisfies it. Report what is there
          # so a divergence is visible in the log, but do not fail on it.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::notice::Release ${GITHUB_REF_NAME} already exists; created outside this run, not recreating."
            echo "existing title: $(gh release view "${GITHUB_REF_NAME}" --json name --jq .name)"
            echo "notes this run would have used: ${RELEASE_TITLE}"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${RELEASE_TITLE}" \
            --notes-file "${RELEASE_NOTES}" \
            --latest=true
