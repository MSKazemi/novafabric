name: Publish to PyPI

# Builds the novafabric distribution and publishes it to PyPI using
# Trusted Publishing (OIDC) — no API token or stored secret is required.
# PyPI is configured to trust this exact tuple via a Trusted Publisher entry:
#
#   PyPI project   : novafabric
#   Owner          : novafabric
#   Repository     : novafabric
#   Workflow name  : publish-pypi.yml   <-- the value to enter on pypi.org
#   Environment    : pypi
#
# Fires when a v* tag is pushed (same trigger as release.yml, which creates
# the GitHub Release). The two workflows run independently.
on:
  push:
    tags:
      - "v*"
  # Allow a manual re-publish from the Actions tab if a tag run needs a retry.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # SLSA build provenance attestation for the sdist + wheel.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Generate SBOM (syft)
        # CycloneDX SBOM of the built distribution — the provenance product
        # shipping a bill of materials for its own wheel.
        #
        # continue-on-error, deliberately. This step failed on five consecutive
        # release tags (v0.98.0 through v0.99.0, 2026-07-31 to 2026-08-05) and,
        # because it was blocking, took the whole `build` job down with it — so
        # `publish` never ran and **none of those releases reached PyPI**. Users
        # running `pip install novafabric` kept getting 0.97.0, still carrying
        # three defects v0.99.0 had already fixed, while the repository, the
        # tags, and the GitHub Releases all said otherwise.
        #
        # A supply-chain nicety must not be able to block the supply chain. The
        # SBOM is still generated and still uploaded when the action works; when
        # a third-party action breaks, the release ships and the missing SBOM is
        # visible as a failed step rather than as a silent non-release.
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          path: dist/
          format: cyclonedx-json
          output-file: novafabric-sbom.cyclonedx.json
          artifact-name: novafabric-sbom.cyclonedx.json

      - name: Warn when the SBOM step did not produce a file
        if: always()
        run: |
          if [ ! -f novafabric-sbom.cyclonedx.json ]; then
            echo "::warning title=SBOM missing::syft did not produce an SBOM for this build. \
          The release still ships. Investigate anchore/sbom-action before the next tag."
          fi

      - name: Attest build provenance (SLSA) for the distributions
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Publish only from the public repo. PyPI's Trusted Publisher trusts
    # novafabric/novafabric — a tag in the private mirror must not attempt to publish.
    if: github.repository == 'novafabric/novafabric'
    # Must match the "Environment name" configured in the PyPI Trusted Publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/novafabric
    permissions:
      # Required for Trusted Publishing: mints the OIDC token PyPI exchanges
      # for a short-lived upload credential. No long-lived secret is stored.
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
