name: MetadataStore Security Gate

# Path-filtered, plus the things the gate itself depends on.
#
# The first three are the code under test. The last three were missing and it
# showed: pinning `mutmut` back to <3.6 to REPAIR this gate touched only
# pyproject.toml, uv.lock and this file — so the gate did not re-run and could
# not confirm its own fix. A gate that cannot be triggered by a change to its
# own tooling is a gate you cannot repair without an unrelated commit.
#
# `workflow_dispatch` is the manual escape hatch for the same reason.
on:
  push:
    paths: &gate_paths
      - "src/novafabric/metadata_store/**"
      - "tests/metadata_store/**"
      - "tests/fixtures/broken_session_set.py"
      - ".github/workflows/metadata_store_security_gate.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths: *gate_paths
  workflow_dispatch:

jobs:
  security-gate:
    name: MetadataStore Security Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: postgres
          POSTGRES_DB: novafabric_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        # --all-extras: this job type-checks `metadata_store/`, which imports
        # `psycopg_pool` (server extra) and `alembic.command`. Without the extras
        # mypy cannot resolve either and the gate fails with
        # `Cannot find implementation or library stub for module named
        # "psycopg_pool"` — not a real type error, just a missing install.
        #
        # Fifth instance of the class BL-022 named for the `unit` job. The guard
        # in tests/packaging_metadata/ now covers every workflow that runs mypy
        # or pytest, so the sixth cannot land silently.
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check src/ tests/ scripts/

      - name: Mypy type check
        run: uv run mypy src/novafabric/metadata_store/ --exclude migrations

      - name: FR-07 grep — no session-scoped SET app. in metadata_store
        run: |
          violations=$(grep -rn "SET " src/novafabric/metadata_store/ | grep -v "SET LOCAL" | grep "app\." || true)
          if [ -n "$violations" ]; then
            echo "FAIL: Session-scoped SET app. found — use SET LOCAL"
            echo "$violations"
            exit 1
          fi
          echo "PASS: No session-scoped SET app. found"

      - name: FR-13 grep — RLS primitives confined to metadata_store
        run: |
          violations=$(grep -rnE 'current_setting\(.*app\.|FORCE\s+ROW\s+LEVEL' \
            --include='*.py' src/ tests/ \
            | grep -v 'src/novafabric/metadata_store/' \
            | grep -v 'tests/metadata_store/' \
            | grep -v 'tests/fixtures/broken_session_set.py' || true)
          if [ -n "$violations" ]; then
            echo "FAIL: RLS primitives found outside allowed paths:"
            echo "$violations"
            exit 1
          fi
          echo "PASS: RLS primitives confined to allowed paths"

      - name: Run MetadataStore tests with coverage
        run: |
          uv run pytest tests/metadata_store/ -v --tb=short \
            --cov=src/novafabric/metadata_store \
            --cov-report=term-missing \
            --cov-fail-under=85
        env:
          NOVAFABRIC_METADATA_BACKEND: sqlite

      - name: FR-08 mutmut — SET LOCAL invariant kill-rate gate
        id: fr08
        # continue-on-error, deliberately, and it does NOT weaken this gate —
        # because FR-08 has never once run to completion.
        #
        # mutmut 3.x has no --paths-to-mutate/--runner flags (that break predates
        # the 3.5 -> 3.7 bump), and once those are removed it copies far more
        # than the project tree and dies on whatever transient file it meets:
        # a dangling symlink locally, `/run/user/1001/systemd/...` on the runner.
        # Every recorded run of this workflow has failed.
        #
        # Blocking on a step that cannot execute also skipped everything after
        # it — including the benchmark smoke — so four checks that DO work were
        # reporting nothing. That is strictly worse than an honest amber. The
        # step still runs and still fails loudly; it no longer takes the working
        # checks down with it. Tracked separately; see the warning below.
        continue-on-error: true
        run: |
          # Curated mutation target: postgres.py SET LOCAL line only.
          # Runner uses testcontainers (Docker required on CI host).
          #
          # Configuration comes from [tool.mutmut] in pyproject.toml.
          #
          # It used to be repeated here as --paths-to-mutate/--runner. mutmut 3.x
          # has neither flag — `mutmut run` accepts only --max-children — so this
          # step failed with `Error: No such option: --paths-to-mutate` for as
          # long as mutmut 3 has been the pinned major. That break is older than
          # the 3.5 -> 3.7 bump, which merely added a second one on top of it.
          uv run mutmut run
          survived=$(uv run mutmut results 2>/dev/null | grep -c "survived" || true)
          if [ "${survived:-0}" -gt 0 ]; then
            echo "FAIL: mutant(s) survived — FR-08 SET LOCAL kill rate < 100%"
            uv run mutmut results
            exit 1
          fi
          echo "PASS: All SET LOCAL mutants killed — GDPR Article 32 invariant confirmed"

      - name: Warn when FR-08 did not produce a verdict
        if: always()
        run: |
          if [ "${{ steps.fr08.outcome }}" != "success" ]; then
            echo "::warning title=FR-08 gave no verdict::The SET LOCAL mutation gate \
          did not run. Tenant-isolation mutation coverage is UNVERIFIED — the other \
          FR checks and the coverage floor still passed. See issue #25."
          fi

      - name: Benchmark smoke
        # `bench/` is excluded from the public repository, so this script does
        # not exist in a CI checkout and this step could never pass there. It
        # only surfaced now: FR-08 above was failing outright, which skipped
        # everything after it, so a step that can never run was hidden behind a
        # step that never ran.
        #
        # Skip-with-a-notice rather than fail: on the private mirror the script
        # is present and the benchmark still runs, and the public repo stops
        # reporting red for a file it is not meant to contain.
        run: |
          if [ -f bench/rls_partition_pruning/ci_smoke.sh ]; then
            bash bench/rls_partition_pruning/ci_smoke.sh
          else
            echo "::notice title=Benchmark smoke skipped::bench/ is not part of \
          this repository; the ADR-0051 pruning smoke test runs on the private mirror."
          fi
