name: CI

# Runs the same quality gates the project's PR template asks contributors
# to run locally: pytest with coverage, ruff lint, mypy strict. Mirrors
# CONTRIBUTING.md and the v0.6.1-baseline gates (558 tests, 90% coverage,
# 87 source files clean under mypy strict).
#
# Jobs:
#   lint        — lockfile check, ruff, CLI smoke; the fast signal.
#   unit        — six duration-balanced shards of the suite (ADR-0316).
#   coverage    — combines the shards: 90% floor + proof every test ran once.
#   integration — runs on every PR/push; spins up a Postgres 16 service.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub runs push CI only on the pushed head. A tag on any other commit gets
  # its CI run here (`gh workflow run ci.yml --ref <tag>`), which is what the
  # release gate (require-green-ci.yml) waits for.
  workflow_dispatch:

# Cancel in-flight runs of the same ref when new commits land. Saves CI
# minutes on rapid-fire pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job here only reads the repository. Without this the
# token inherits the repository default (OpenSSF Scorecard TokenPermissions).
permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Lint + packaging smoke — the fast signal (~1-2 min), independent of the
  # suite so a lint or lockfile failure is reported without waiting for it.
  # --------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    # CI and every other action belong to the PUBLIC repository. The private
    # mirror carries the same .github/ tree, so without this it runs the whole
    # suite again on billable minutes and leaves that repo permanently red.
    if: github.repository == 'MSKazemi/novafabric'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python (matches requires-python in pyproject.toml)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Lockfile is in sync with pyproject.toml
        # Every other step installs with `uv sync --frozen`, which takes the
        # lockfile as given and never compares it to pyproject.toml.  That is
        # the right behaviour for a build (reproducible, no surprise resolve)
        # but it means a lockfile that no longer matches the manifest installs
        # cleanly and CI stays green.  Four merged Dependabot PRs raised
        # dependency floors in pyproject.toml without regenerating uv.lock, and
        # nothing noticed until `uv lock --check` was run by hand.
        # This step is the check `--frozen` deliberately skips.  It resolves
        # only metadata, so it costs a couple of seconds.
        run: uv lock --check

      - name: Install project + dev deps
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check src tests scripts

      - name: Smoke-test the CLI
        # Confirms the `nova` entry point installs cleanly and reports
        # the version. Catches packaging regressions that pure unit
        # tests miss.
        run: |
          uv run nova --version
          uv run nova --help > /dev/null

  # --------------------------------------------------------------------------
  # Unit tests — six duration-balanced shards (ADR-0316)
  # No external services beyond the testcontainers tier. Each shard runs a
  # disjoint set of test FILES (tests/_shard.py), records which tests it ran,
  # and uploads its coverage data; the `coverage` job below proves the shards
  # partition the suite and enforces the 90% floor over their union.
  #
  # One job ran the whole ~20K-test suite until 2026-10-22: 31-57 min per run
  # (measured on runs 39793113378 and 39787883698).
  # --------------------------------------------------------------------------
  unit:
    name: unit (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # CI and every other action belong to the PUBLIC repository. The private
    # mirror carries the same .github/ tree, so without this it runs the whole
    # suite again on billable minutes and leaves that repo permanently red.
    if: github.repository == 'MSKazemi/novafabric'
    # Sized from measurement, not hope: the single job took 30.5-37.4 min on a
    # normal 4-CPU runner and ~57 min on a slow one (uniformly ~1.8x, not a
    # hang). A sixth of that plus install and collection is ~10 min, ~17 on a
    # slow runner; 30 leaves room for that spread, and a shard that still hits
    # it is a real stall.
    timeout-minutes: 30
    strategy:
      # Every shard reports even if another fails: a red run should name every
      # failing test, not the first shard's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Keep the uv binary cached across runs.
          enable-cache: true

      - name: Set up Python (matches requires-python in pyproject.toml)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install project + dev deps
        # --all-extras is REQUIRED, not a convenience.  Without it ~61 tests
        # ERROR instead of skipping (alembic, uvicorn, nats-py, a2a-sdk, mcp),
        # because those suites import the optional dependency at module scope.
        # This was invisible until 2026-07-31: `tests/coverage/` shadowed the
        # `coverage` distribution, so pytest-cov failed to load and this job
        # went red before it ever reported a test result.  Matches the
        # documented dev/release invocation in CONTRIBUTING.md.
        run: uv sync --frozen --all-extras

      - name: Record runner capacity and start a memory sampler
        # A runner that dies mid-job leaves NO evidence: GitHub surfaces
        # `The runner has received a shutdown signal`, never an OOM message, and
        # the VM is gone before anything can be read off it. Six kills in one week
        # were therefore only ever explicable by inference. This makes the next
        # one an observation instead: capacity up front, and a 5-second trace of
        # free memory that is uploaded even when the job fails.
        #
        # Costs nothing measurable -- one `free` call per 5 s for the job's life.
        run: |
          echo "cpus=$(nproc)"
          free -h
          df -h / | tail -1
          nohup bash -c 'while :; do echo "$(date +%s) $(free -m | awk "/^Mem:/{print \$3\" \"\$7}")"; sleep 5; done' \
            > "$RUNNER_TEMP/mem-trace.txt" 2>/dev/null &
          echo "sampler_pid=$!"

      - name: Run unit tests with coverage (this shard)
        # Excludes tests/integration/ which requires optional external services.
        # Coverage is collected here and ENFORCED in the `coverage` job over the
        # union of all shards — a per-shard floor would be meaningless.
        # --benchmark-disable skips the 100-round latency benchmark; that gate
        # runs in the dedicated seal-latency-gate job below.
        # --dist=loadgroup is mandatory, not a tuning knob:
        # tests/metadata_store/conftest.py pins its testcontainers Postgres to a
        # single xdist_group, and plain --dist=load scatters that group across
        # workers and makes the tier fail. Sharding is by FILE for the same
        # reason — a module's container and module fixtures stay in one shard.
        #
        # Peak memory is the sum of the xdist workers AND every testcontainer
        # alive at once. That is what killed the single job six times between
        # 2026-09-04 and 2026-09-09: the grouping above was inert (a conftest
        # hook without `tryfirst` adds its xdist_group mark after pytest-xdist
        # has already read the marks), so a single module scattered across
        # workers started one container per worker -- measured at three
        # simultaneous JanusGraph JVMs, 3.4-4.4 GiB each. The runner died
        # mid-run at exactly [ 38%] with zero FAILED tests, which reads as a
        # timeout rather than the resource exhaustion it was.
        env:
          COVERAGE_FILE: reports/coverage-shard-${{ matrix.shard }}.dat
        run: >-
          mkdir -p reports &&
          uv run pytest tests/ --ignore=tests/integration --benchmark-disable
          -n auto --dist=loadgroup
          --cov=novafabric --cov-report=
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --shard-manifest=reports/manifest-shard-${{ matrix.shard }}.txt
          -o junit_family=xunit1 --junitxml=reports/junit-shard-${{ matrix.shard }}.xml

      - name: Peak memory during the test run
        # `always()` is the point: this matters most when the step above failed.
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/mem-trace.txt" ]; then
            awk '{if ($2+0 > peak) peak=$2+0; if (min=="" || $3+0 < min) min=$3+0}
                 END {printf "peak used: %d MiB\nlowest available: %d MiB\nsamples: %d\n", peak, min, NR}' \
              "$RUNNER_TEMP/mem-trace.txt"
          else
            echo "no trace captured"
          fi
          cp "$RUNNER_TEMP/mem-trace.txt" reports/ 2>/dev/null || true

      - name: Upload this shard's results
        # Coverage data, the JUnit report and the manifest of tests this shard
        # ran — the `coverage` job needs all three, from every shard.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-shard-${{ matrix.shard }}
          path: reports/
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------------------------------
  # Coverage + shard completeness (ADR-0316)
  # The one place the 90% floor is enforced, over the union of the shards.
  # Also proves the shards PARTITION the suite: a test that fell between
  # shards would never run and never be reported, so the union of the shard
  # manifests is compared with a fresh collection of the same scope.
  # --------------------------------------------------------------------------
  coverage:
    runs-on: ubuntu-latest
    needs: unit
    # Runs even when a shard failed, so a red run still gets its summary and
    # the completeness check; skipped only when the run was cancelled.
    if: (!cancelled()) && github.repository == 'MSKazemi/novafabric'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python (matches requires-python in pyproject.toml)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install project + dev deps
        # --all-extras: the reference collection below must import exactly what
        # the shards imported, or the comparison is between different suites.
        run: uv sync --frozen --all-extras

      - name: Download every shard's results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-shard-*
          path: reports
          merge-multiple: true

      - name: Test report (job summary)
        if: always()
        run: python3 scripts/ci_test_report.py summary reports/junit-shard-*.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Every test ran in exactly one shard
        run: |
          uv run pytest tests/ --ignore=tests/integration --collect-only -q \
            --shard-manifest=reports/manifest-all.txt > /dev/null
          python3 scripts/ci_test_report.py check-manifests \
            --expected reports/manifest-all.txt reports/manifest-shard-*.txt

      - name: Combined coverage (floor 90%)
        # Independent of the partition check above: a red partition must not hide
        # the coverage figure (the first sharded run reported neither).
        if: (!cancelled())
        run: |
          uv run coverage combine --keep reports/coverage-shard-*.dat
          uv run coverage report -m --skip-covered --fail-under=90

      - name: Refresh per-file test durations
        # Uploaded, not committed: `make test-durations` (docs/developer-guide.md)
        # folds an artifact into tests/.test-durations.json when balance drifts.
        if: always()
        run: |
          if [ -f tests/.test-durations.json ]; then
            cp tests/.test-durations.json reports/test-durations.json
          fi
          python3 scripts/ci_test_report.py durations \
            --out reports/test-durations.json reports/junit-shard-*.xml

      - name: Upload refreshed durations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-durations
          path: reports/test-durations.json
          if-no-files-found: ignore
          retention-days: 30

  # --------------------------------------------------------------------------
  # Type check (mypy strict) against the FULL dependency surface
  # Separate job with --all-extras so optional-extra integrations (sigstore,
  # kuzu, clickhouse, adapters, …) are type-checked against their real APIs
  # instead of being silenced as missing imports.
  #
  # (This block used to add "the unit job stays lean so its coverage denominator
  # is unaffected".  That reasoning was wrong and has been removed: `--cov=novafabric`
  # scopes coverage to the novafabric package, so third-party extras never enter
  # the denominator — installing them can only raise the numerator.  Measured:
  # the unit job went from 61 errors to 0 and coverage from unmeasurable to
  # 92.75% once --all-extras was added.)
  # --------------------------------------------------------------------------
  typecheck:
    runs-on: ubuntu-latest
    # CI and every other action belong to the PUBLIC repository. The private
    # mirror carries the same .github/ tree, so without this it runs the whole
    # suite again on billable minutes and leaves that repo permanently red.
    if: github.repository == 'MSKazemi/novafabric'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python (matches requires-python in pyproject.toml)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install project + dev deps + all extras
        run: uv sync --frozen --all-extras

      - name: Type check (mypy strict)
        run: uv run mypy src

  # --------------------------------------------------------------------------
  # NovaSeal latency gate
  # Runs 100 seal() rounds; FAILS if the median >= 50 ms, WARNS (::warning::
  # annotation, non-blocking) if the p99 >= 200 ms. Gating on p99 flaked on
  # shared runners: the 100-round p99 is the second-slowest sample (BL-061).
  # Separate from the unit job so benchmark overhead does not inflate
  # the coverage-measurement run.
  # --------------------------------------------------------------------------
  seal-latency-gate:
    runs-on: ubuntu-latest
    # CI and every other action belong to the PUBLIC repository. The private
    # mirror carries the same .github/ tree, so without this it runs the whole
    # suite again on billable minutes and leaves that repo permanently red.
    if: github.repository == 'MSKazemi/novafabric'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install project + dev deps
        run: uv sync --frozen

      - name: Run NovaSeal latency gate
        # --benchmark-json saves results as a JSON artifact for trend tracking
        # (extra_info carries median_s / p99_s / tail_alarm). The median < 50 ms
        # assertion is inside the test itself and blocks the PR merge; the p99
        # tail alarm only annotates the run.
        run: |
          mkdir -p bench-results
          uv run pytest tests/seal/test_benchmark.py -v \
            --benchmark-json=bench-results/seal_latency.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seal-latency-${{ github.sha }}
          path: bench-results/seal_latency.json
          retention-days: 90

  # --------------------------------------------------------------------------
  # Capture-overhead gate
  # Runs 30 full captured runs of `python -c pass` through
  # CaptureOrchestrator(fast_emit=True) and asserts p95 < 2000 ms
  # (ROADMAP W1; ADR-0021 §6, ADR-0092). Separate from the unit job so
  # benchmark overhead does not inflate the coverage-measurement run.
  # --------------------------------------------------------------------------
  capture-overhead-gate:
    runs-on: ubuntu-latest
    # CI and every other action belong to the PUBLIC repository. The private
    # mirror carries the same .github/ tree, so without this it runs the whole
    # suite again on billable minutes and leaves that repo permanently red.
    if: github.repository == 'MSKazemi/novafabric'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install project + dev deps
        run: uv sync --frozen

      - name: Run capture-overhead p95 gate
        # --benchmark-json saves results as a JSON artifact for trend tracking.
        # The p95 < 2000 ms assertion is inside the test itself; a failing
        # assertion fails this step and blocks the PR merge.
        run: |
          mkdir -p bench-results
          uv run pytest tests/bench/test_capture_overhead_gate.py -v \
            --benchmark-json=bench-results/capture_overhead.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capture-overhead-${{ github.sha }}
          path: bench-results/capture_overhead.json
          retention-days: 90

  # --------------------------------------------------------------------------
  # Showcase site build
  # Confirms the Astro site (ui/dashboard/) builds cleanly and TypeScript types check.
  # e2e tests require a running server so are not run here.
  # --------------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    # CI and every other action belong to the PUBLIC repository. The private
    # mirror carries the same .github/ tree, so without this it runs the whole
    # suite again on billable minutes and leaves that repo permanently red.
    if: github.repository == 'MSKazemi/novafabric'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Must satisfy ui/dashboard/package.json "engines". Astro 7 refuses to build on
          # Node 20 ("not supported by Astro! Please upgrade to >=22.12.0"), and
          # this job pinned 20 — so the `web` job failed on every run until
          # 2026-08-05. package.json also *claimed* >=20.0.0, so the pin looked
          # correct; the declaration was the thing that was wrong.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/dashboard/package-lock.json

      - name: Install web dependencies
        working-directory: ui/dashboard
        run: npm ci

      - name: Type check (tsc)
        working-directory: ui/dashboard
        run: npm run lint

      # ui/dashboard/ carries vitest.config.ts and tests/unit/*.test.tsx, but no job ran
      # them until 2026-09-08 — a vitest bump here was unverifiable by CI.
      # Playwright suites (test:e2e/test:visual/test:a11y) stay out: they need
      # browsers and a served build.
      - name: Unit tests (vitest)
        working-directory: ui/dashboard
        run: npm run test:unit

      - name: Build showcase site
        working-directory: ui/dashboard
        run: npm run build

  # --------------------------------------------------------------------------
  # Integration tests
  # Spins up a Postgres 16 service container and runs tests/integration/.
  # Tests that don't need Postgres (server, auth, rbac, storage SQLite) still
  # run here; Postgres-requiring tests (migration, storage Postgres) are
  # automatically enabled via the env var.
  # --------------------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest
    # CI and every other action belong to the PUBLIC repository. The private
    # mirror carries the same .github/ tree, so without this it runs the whole
    # suite again on billable minutes and leaves that repo permanently red.
    if: github.repository == 'MSKazemi/novafabric'
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: novafabric_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python (matches requires-python in pyproject.toml)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install project + dev deps
        # --all-extras: alembic and psycopg live in an optional extra, so a plain
        # `uv sync --frozen` installs neither. This job therefore failed at
        # `Failed to spawn: alembic` on every run from at least 2026-07-30 — the
        # integration tests below have not executed in over a week.
        #
        # Fourth instance of the class BL-022 named for the `unit` job: a CI job
        # installing without the extras it needs. The two benchmark jobs above
        # deliberately keep the plain sync — they measure capture overhead, and
        # installing extras would change what gets imported and skew the numbers.
        run: uv sync --frozen --all-extras

      - name: Run Postgres schema migrations
        env:
          NOVAFABRIC_POSTGRES_DSN: postgresql://postgres:test@localhost:5432/novafabric_test
        run: uv run alembic -c alembic-postgres.ini upgrade head

      - name: Run integration tests
        env:
          NOVAFABRIC_TEST_POSTGRES_DSN: postgresql://postgres:test@localhost:5432/novafabric_test
        run: uv run pytest tests/integration/ -v
