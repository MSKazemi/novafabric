name: CI

# Runs the same quality gates the project's PR template asks contributors
# to run locally: pytest with coverage, ruff lint, mypy strict. Mirrors
# CONTRIBUTING.md and the v0.6.1-baseline gates (558 tests, 90% coverage,
# 87 source files clean under mypy strict).
#
# Jobs:
#   unit        — runs on every PR/push; no external services required.
#   integration — runs on every PR/push; spins up a Postgres 16 service.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs of the same ref when new commits land. Saves CI
# minutes on rapid-fire pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Unit tests + quality gates
  # No external services. Must pass without Postgres or any network access.
  # --------------------------------------------------------------------------
  unit:
    runs-on: ubuntu-latest
    # 15 minutes was not enough and had not been for weeks. This job hit the cap
    # at ~15m15s on EVERY run from 2026-07-31 to 2026-08-05 — GitHub reports a
    # timeout as `cancelled`, which reads like an interrupted run rather than a
    # failure, so it never looked like the standing defect it was. The
    # consequence: the ~11.6K-test suite and the 90% coverage gate have not
    # actually executed in CI since BL-022 nominally fixed this job.
    #
    # The 205 s figure BL-022 recorded was measured on a developer machine with
    # many cores. `-n auto` on a GitHub-hosted runner gets a handful, so that
    # number never transferred — a local measurement is not a CI measurement.
    # Raised to 40 to let the job finish and report a real duration; tighten it
    # once there is a measured number from an actual green run.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Keep the uv binary cached across runs.
          enable-cache: true

      - name: Set up Python (matches requires-python in pyproject.toml)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project + dev deps
        # --all-extras is REQUIRED, not a convenience.  Without it ~61 tests
        # ERROR instead of skipping (alembic, uvicorn, nats-py, a2a-sdk, mcp),
        # because those suites import the optional dependency at module scope.
        # This was invisible until 2026-07-31: `tests/coverage/` shadowed the
        # `coverage` distribution, so pytest-cov failed to load and this job
        # went red before it ever reported a test result.  Matches the
        # documented dev/release invocation in CLAUDE.md and CONTRIBUTING.md.
        run: uv sync --frozen --all-extras

      - name: Lint (ruff)
        run: uv run ruff check src tests scripts

      - name: Run unit tests with coverage
        # Excludes tests/integration/ which requires optional external services.
        # --cov-fail-under=90 enforces the project's coverage floor at the
        # CI gate so a regression cannot land silently.
        # --benchmark-disable skips the 100-round latency benchmark; that gate
        # runs in the dedicated seal-latency-gate job below.
        # -n auto keeps the full-extras run inside the 15-minute timeout
        # (measured 205 s vs. a serial run that no longer fits).  --dist=loadgroup
        # is mandatory, not a tuning knob: tests/metadata_store/conftest.py pins
        # its testcontainers Postgres to a single xdist_group, and plain
        # --dist=load scatters that group across workers and makes the tier fail.
        run: uv run pytest tests/ --ignore=tests/integration --benchmark-disable -n auto --dist=loadgroup --cov=novafabric --cov-report=term-missing --cov-fail-under=90

      - name: Smoke-test the CLI
        # Confirms the `nova` entry point installs cleanly and reports
        # the version. Catches packaging regressions that pure unit
        # tests miss.
        run: |
          uv run nova --version
          uv run nova --help > /dev/null

  # --------------------------------------------------------------------------
  # Type check (mypy strict) against the FULL dependency surface
  # Separate job with --all-extras so optional-extra integrations (sigstore,
  # kuzu, clickhouse, adapters, …) are type-checked against their real APIs
  # instead of being silenced as missing imports.
  #
  # (This block used to add "the unit job stays lean so its coverage denominator
  # is unaffected".  That reasoning was wrong and has been removed: `--cov=novafabric`
  # scopes coverage to the novafabric package, so third-party extras never enter
  # the denominator — installing them can only raise the numerator.  Measured:
  # the unit job went from 61 errors to 0 and coverage from unmeasurable to
  # 92.75% once --all-extras was added.)
  # --------------------------------------------------------------------------
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python (matches requires-python in pyproject.toml)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project + dev deps + all extras
        run: uv sync --frozen --all-extras

      - name: Type check (mypy strict)
        run: uv run mypy src

  # --------------------------------------------------------------------------
  # NovaSeal p99 latency gate
  # Runs 100 seal() rounds and asserts p99 < 200 ms (ADR-0041).
  # Separate from the unit job so benchmark overhead does not inflate
  # the coverage-measurement run.
  # --------------------------------------------------------------------------
  seal-latency-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project + dev deps
        run: uv sync --frozen

      - name: Run NovaSeal p99 latency gate
        # --benchmark-json saves results as a JSON artifact for trend tracking.
        # The p99 < 200 ms assertion is inside the test itself; a failing
        # assertion fails this step and blocks the PR merge.
        run: |
          mkdir -p bench-results
          uv run pytest tests/seal/test_benchmark.py -v \
            --benchmark-json=bench-results/seal_latency.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seal-latency-${{ github.sha }}
          path: bench-results/seal_latency.json
          retention-days: 90

  # --------------------------------------------------------------------------
  # Capture-overhead gate
  # Runs 30 full captured runs of `python -c pass` through
  # CaptureOrchestrator(fast_emit=True) and asserts p95 < 2000 ms
  # (ROADMAP W1; ADR-0021 §6, ADR-0092). Separate from the unit job so
  # benchmark overhead does not inflate the coverage-measurement run.
  # --------------------------------------------------------------------------
  capture-overhead-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project + dev deps
        run: uv sync --frozen

      - name: Run capture-overhead p95 gate
        # --benchmark-json saves results as a JSON artifact for trend tracking.
        # The p95 < 2000 ms assertion is inside the test itself; a failing
        # assertion fails this step and blocks the PR merge.
        run: |
          mkdir -p bench-results
          uv run pytest tests/bench/test_capture_overhead_gate.py -v \
            --benchmark-json=bench-results/capture_overhead.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-overhead-${{ github.sha }}
          path: bench-results/capture_overhead.json
          retention-days: 90

  # --------------------------------------------------------------------------
  # Showcase site build
  # Confirms the Astro site (web/) builds cleanly and TypeScript types check.
  # e2e tests require a running server so are not run here.
  # --------------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Must satisfy web/package.json "engines". Astro 7 refuses to build on
          # Node 20 ("not supported by Astro! Please upgrade to >=22.12.0"), and
          # this job pinned 20 — so the `web` job failed on every run until
          # 2026-08-05. package.json also *claimed* >=20.0.0, so the pin looked
          # correct; the declaration was the thing that was wrong.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Type check (tsc)
        working-directory: web
        run: npm run lint

      - name: Build showcase site
        working-directory: web
        run: npm run build

  # --------------------------------------------------------------------------
  # Integration tests
  # Spins up a Postgres 16 service container and runs tests/integration/.
  # Tests that don't need Postgres (server, auth, rbac, storage SQLite) still
  # run here; Postgres-requiring tests (migration, storage Postgres) are
  # automatically enabled via the env var.
  # --------------------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: novafabric_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python (matches requires-python in pyproject.toml)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project + dev deps
        # --all-extras: alembic and psycopg live in an optional extra, so a plain
        # `uv sync --frozen` installs neither. This job therefore failed at
        # `Failed to spawn: alembic` on every run from at least 2026-07-30 — the
        # integration tests below have not executed in over a week.
        #
        # Fourth instance of the class BL-022 named for the `unit` job: a CI job
        # installing without the extras it needs. The two benchmark jobs above
        # deliberately keep the plain sync — they measure capture overhead, and
        # installing extras would change what gets imported and skew the numbers.
        run: uv sync --frozen --all-extras

      - name: Run Postgres schema migrations
        env:
          NOVAFABRIC_POSTGRES_DSN: postgresql://postgres:test@localhost:5432/novafabric_test
        run: uv run alembic -c alembic-postgres.ini upgrade head

      - name: Run integration tests
        env:
          NOVAFABRIC_TEST_POSTGRES_DSN: postgresql://postgres:test@localhost:5432/novafabric_test
        run: uv run pytest tests/integration/ -v
