name: pip-audit

# Dependency vulnerability gate (ADR-0186). Audits the LOCKED dependency set
# (uv.lock exported as a fully pinned requirements file) against the PyPA
# advisory databases via pip-audit, then applies the severity + waiver gate
# (scripts/pip_audit_gate.py):
#
#   - HIGH/CRITICAL findings (and findings whose severity cannot be
#     determined — fail closed) BLOCK the job.
#   - MODERATE/LOW findings report without blocking.
#   - Exceptions go through .pip-audit-waivers.toml (id, justification,
#     expiry); an EXPIRED waiver fails the job by construction.
#
# This extends — does not replace — Scorecard (posture) and CodeQL (our own
# code): pip-audit scans what we consume.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-audit — newly published advisories must surface even when
    # the lockfile has not changed. Tuesdays 06:30 UTC (Scorecard runs
    # Mondays at the same time).
    - cron: "30 6 * * 2"
  # Allow a manual run from the Actions tab (e.g. to confirm a waiver).
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-flight runs of the same ref when new commits land.
concurrency:
  group: pip-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: pip-audit (locked deps)
    runs-on: ubuntu-24.04
    # CI and every other action belong to the PUBLIC repository. The private
    # mirror carries the same .github/ tree, so without this it runs the whole
    # suite again on billable minutes and leaves that repo permanently red.
    if: github.repository == 'MSKazemi/novafabric'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python (matches requires-python in pyproject.toml)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Export the locked dependency set
        # --all-extras: audit the full resolved environment (dev group
        # included by default), not just top-level pins (ADR-0186).
        # --no-emit-project: skip novafabric itself — it is what we ship,
        # not what we consume, and pip-audit cannot look it up on PyPI.
        # --no-hashes: pip-audit resolves via `pip --dry-run`, which may
        # select a wheel uploaded after uv.lock recorded its hash set and
        # then fail hash verification; versions are what get audited, and
        # the hashes still gate real installs via uv.lock itself.
        run: uv export --frozen --all-extras --no-emit-project --no-hashes -o requirements-audit.txt

      - name: Run pip-audit against the locked set
        # --no-deps: the export is already a complete pinned closure, so no
        # resolution (and no package installation) is needed.
        # pip-audit exits non-zero when it finds anything; the severity +
        # waiver gate below decides what actually blocks, so findings are
        # not a failure of THIS step — a missing/empty report is.
        # Run through uv (`uvx`, already installed above) at an EXACT version:
        # `pipx run pip-audit` took whatever release was newest that day, so the
        # auditor itself was the one unpinned tool in the gate. Bump deliberately.
        run: |
          uvx --from "pip-audit==2.10.1" pip-audit -r requirements-audit.txt --no-deps \
            --format json --output pip-audit-report.json \
            || echo "pip-audit reported findings; the gate step decides below"
          test -s pip-audit-report.json

      - name: Severity + waiver gate
        # Blocks on HIGH/CRITICAL (or undeterminable severity); an expired
        # or malformed waiver in .pip-audit-waivers.toml also fails here.
        run: |
          python3 scripts/pip_audit_gate.py \
            --report pip-audit-report.json \
            --waivers .pip-audit-waivers.toml

      # Every tracked uv.lock is audited, not only the root one
      # (tests/docs/test_pip_audit_covers_every_uv_lock.py enforces this).
      # examples/plugin-hook-reference has its OWN lock — a file readers clone
      # and install — and it pins its own versions of novafabric's transitive
      # dependencies, which can lag the root lock. It once carried a vulnerable
      # cryptography release while the root lock was clean.
      - name: Export the example plugin's locked dependency set
        # !cancelled(): run even when the root gate above failed, so a run with
        # a blocking root finding still reports the example lock's verdict. The
        # job still fails if either gate fails (a failed step fails the job).
        if: ${{ !cancelled() }}
        # --no-emit-package novafabric: the example takes novafabric from the
        # working tree as an editable path dependency (`-e ../../`), which
        # pip-audit cannot look up; its dependencies are still exported.
        run: >-
          uv export --project examples/plugin-hook-reference --frozen --all-extras
          --no-emit-project --no-emit-package novafabric --no-hashes
          -o requirements-audit-example-plugin.txt

      - name: Run pip-audit against the example plugin's locked set
        if: ${{ !cancelled() }}
        run: |
          uvx --from "pip-audit==2.10.1" pip-audit -r requirements-audit-example-plugin.txt --no-deps \
            --format json --output pip-audit-report-example-plugin.json \
            || echo "pip-audit reported findings; the gate step decides below"
          test -s pip-audit-report-example-plugin.json

      - name: Severity + waiver gate (example plugin)
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/pip_audit_gate.py \
            --report pip-audit-report-example-plugin.json \
            --waivers .pip-audit-waivers.toml

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pip-audit-${{ github.sha }}
          path: |
            pip-audit-report.json
            pip-audit-report-example-plugin.json
          retention-days: 90
