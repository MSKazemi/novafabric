name: capture-action

# Dogfoods .github/actions/capture against the *published* package.
#
# Two reasons this exists rather than a unit test. A composite action can only
# really be exercised by running it, and this is also the project's own smoke
# test of `pip install novafabric` from PyPI — the exact path a new user takes,
# and the one that was silently broken for five releases while every local test
# passed.
#
# It deliberately does NOT install from the working tree.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a broken PyPI release surfaces without waiting for a push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  success-path:
    name: captures a successful command
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Write a workload
        run: |
          cat > workload.py <<'EOF'
          print("planning: summarise the incident report")
          print("tool: search(index='incidents') -> 3 hits")
          EOF

      - name: Capture it
        id: capture
        uses: ./.github/actions/capture
        with:
          run: python workload.py
          artifact-name: capsule-success

      - name: The action reported what it should have
        run: |
          set -euo pipefail
          test -n "${{ steps.capture.outputs.run-id }}" || { echo "no run-id"; exit 1; }
          test "${{ steps.capture.outputs.status }}" = "success" || {
            echo "expected status=success, got '${{ steps.capture.outputs.status }}'"; exit 1; }
          test -d "${{ steps.capture.outputs.capsule-path }}" || { echo "no capsule dir"; exit 1; }
          for f in capsule.yaml env.lock redaction-proof.json; do
            test -f "${{ steps.capture.outputs.capsule-path }}/$f" || { echo "missing $f"; exit 1; }
          done
          echo "run-id=${{ steps.capture.outputs.run-id }}"

  failure-path:
    name: a failing command still yields a capsule
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Write a workload that exits non-zero
        run: |
          cat > crash.py <<'EOF'
          import sys
          print("about to fail")
          sys.exit(3)
          EOF

      - name: Capture it — expected to fail the step
        id: capture
        continue-on-error: true
        uses: ./.github/actions/capture
        with:
          run: python crash.py
          artifact-name: capsule-failure

      - name: The crash was captured, not lost
        # The whole promise of this path: the step fails with the command's own
        # exit code AND the capsule still exists, recording the failure.
        run: |
          set -euo pipefail
          test "${{ steps.capture.outcome }}" = "failure" || {
            echo "the step should have failed with the command's exit code"; exit 1; }

          # Asserts on the exported env vars, NOT on the action's declared
          # outputs: GitHub leaves a composite action's outputs EMPTY when the
          # action fails, which is exactly the case under test here.
          test "${NOVAFABRIC_STATUS}" = "failure" || {
            echo "expected NOVAFABRIC_STATUS=failure, got '${NOVAFABRIC_STATUS}'"; exit 1; }
          grep -q "status: failure" "${NOVAFABRIC_CAPSULE_PATH}/capsule.yaml"
          grep -q "exit_code: 3" "${NOVAFABRIC_CAPSULE_PATH}/capsule.yaml"
          echo "crash captured as ${NOVAFABRIC_RUN_ID}"

  artifact-survives-failure:
    name: the failing run's capsule is downloadable
    runs-on: ubuntu-latest
    needs: failure-path
    if: always()
    timeout-minutes: 5
    steps:
      - name: Download the capsule from the failed capture
        uses: actions/download-artifact@v8
        with:
          name: capsule-failure
          path: recovered/

      - name: It records the failure
        # The promise this action makes, verified end to end: a crashing command
        # still leaves a downloadable capsule that records how it crashed.
        run: |
          set -euo pipefail
          test -f recovered/capsule.yaml || { echo "no capsule.yaml in artifact"; exit 1; }
          grep -q "status: failure" recovered/capsule.yaml
          grep -q "exit_code: 3" recovered/capsule.yaml
          echo "recovered the crashed run's capsule from the artifact"
