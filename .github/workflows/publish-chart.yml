name: Publish Helm chart

# Lints, packages, and pushes the NovaFabric Helm chart as an OCI artifact to
# GHCR, under THIS repository's owner namespace. One registry + one auth model
# for both the container image (publish-image.yml) and the chart.
#
# The namespace is derived from `github.repository_owner`, never hardcoded:
# publish-image.yml already resolves `ghcr.io/${{ github.repository }}`, and a
# hardcoded org path silently diverged from it when the repository moved —
# v0.102.0's chart push failed with "unexpected status from HEAD request"
# because a repo-scoped GITHUB_TOKEN cannot write another owner's package.
# GHCR namespaces are lowercase, so the owner is lowercased before use.
#
# Install from the published chart with:
#   helm install nova oci://ghcr.io/<owner>/charts/novafabric --version X.Y.Z
#
# Fires when a v* tag is pushed. Chart version and appVersion are derived from
# the tag (v0.57.0 -> 0.57.0), so the chart always pins the matching image tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chart:
    name: Package and push chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Publish only from the public repo (never from the private mirror).
    if: github.repository == 'MSKazemi/novafabric'
    permissions:
      contents: read
      # Required to push the OCI chart to GHCR with the built-in GITHUB_TOKEN.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Lint chart
        run: helm lint deploy/helm/novafabric

      - name: Package chart
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/novafabric \
            --version "$version" \
            --app-version "$version" \
            --destination "$RUNNER_TEMP"
          echo "path=$RUNNER_TEMP/novafabric-$version.tgz" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push "${{ steps.package.outputs.path }}" "oci://ghcr.io/$owner/charts"
