name: Release toolchain

# publish-image.yml and publish-chart.yml fire only on a v* tag, so no pull
# request has ever executed the actions they depend on. Dependabot PR #58 made
# that concrete: seven MAJOR action bumps across the image build and the cosign
# signing path, with a fully green check run that exercised none of them. The
# next release tag would have been their first execution — on the workflow that
# builds and signs what users install.
#
# This job runs that toolchain whenever the publish path changes, doing what the
# real workflows do minus the publishing: build the image without pushing,
# install cosign and helm and prove they run, lint and package the chart.
#
# The `image-gate` job additionally runs the release scan gate
# (.github/actions/scan-candidate) and the promotion script
# (scripts/release_image.py) against synthetic fixtures and two local registries, so a
# pull request proves both that a clean image is promoted and that a vulnerable one
# (on either platform) leaves the stand-in production registry empty.
#
# Keep the action versions below IDENTICAL to publish-image.yml and
# publish-chart.yml. Dependabot's `actions` group bumps every workflow together,
# so a version that would break a release now surfaces here, on a pull request,
# instead of on a tag.
#
# Not covered, deliberately:
#   - docker/login-action needs real registry credentials, which must never be
#     exposed to a pull request. Its majors have so far been runtime-only.
#   - Multi-arch emulation. setup-qemu-action runs, but the build below is
#     linux/amd64 so a pull request does not pay for arm64 emulation.
#   - cosign sign / attest, which require the OIDC identity of a tag run.

on:
  pull_request:
    paths:
      - ".github/workflows/publish-image.yml"
      - ".github/workflows/publish-chart.yml"
      - ".github/workflows/release-toolchain.yml"
      - "deploy/docker/**"
      - "deploy/helm/**"
      # The image build reads these too. Omitting them is what let the wheel's
      # force-include list drift away from the Dockerfile's COPY list twice:
      # alembic/ (2026-07-24) and the three canonical JSON Schemas (v0.99.0,
      # which left the image unbuildable for two releases). Both were edits to
      # pyproject.toml that deliberately did NOT touch deploy/docker/, so this
      # filter could not see them. The invariant itself is asserted by
      # tests/docs/test_force_include_reaches_the_docker_build.py; this is the
      # slower belt to that braces.
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
      - ".github/actions/scan-candidate/action.yml"
      - "scripts/release_image.py"
      - "tests/fixtures/release_gate/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-image.yml"
      - ".github/workflows/publish-chart.yml"
      - ".github/workflows/release-toolchain.yml"
      - "deploy/docker/**"
      - "deploy/helm/**"
      # The image build reads these too. Omitting them is what let the wheel's
      # force-include list drift away from the Dockerfile's COPY list twice:
      # alembic/ (2026-07-24) and the three canonical JSON Schemas (v0.99.0,
      # which left the image unbuildable for two releases). Both were edits to
      # pyproject.toml that deliberately did NOT touch deploy/docker/, so this
      # filter could not see them. The invariant itself is asserted by
      # tests/docs/test_force_include_reaches_the_docker_build.py; this is the
      # slower belt to that braces.
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
      - ".github/actions/scan-candidate/action.yml"
      - "scripts/release_image.py"
      - "tests/fixtures/release_gate/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-toolchain:
    name: Image build toolchain (no push)
    runs-on: ubuntu-24.04
    # CI and every other action belong to the PUBLIC repository. The private
    # mirror carries the same .github/ tree, so without this it runs the whole
    # suite again on billable minutes and leaves that repo permanently red.
    if: github.repository == 'MSKazemi/novafabric'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # A pull request has no v* ref, so the semver rules in
          # publish-image.yml derive nothing here. These stand in only to prove
          # the action runs and emits a usable tag set.
          tags: |
            type=ref,event=pr
            type=sha,format=short

      - name: Fail if metadata-action produced no tags
        # Silent-failure guard. An empty `tags` output is exactly the condition
        # that makes the real build fail with "tag is needed when pushing to
        # registry", and an unasserted empty string would sail past the build
        # below because push is false.
        run: |
          tags="${{ steps.meta.outputs.tags }}"
          if [ -z "${tags//[[:space:]]/}" ]; then
            echo "::error::metadata-action produced no tags; the tagging rules regressed."
            exit 1
          fi
          echo "Derived tags:"; echo "$tags"

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          # amd64 only: this validates the build inputs, not arm64 emulation.
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Every input the real publish step passes is exercised here, so an
          # input removed by a major surfaces as a failure rather than at a tag.
          sbom: true
          provenance: mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # Pinned: cosign-installer v4.1.3 changed its default to cosign v3.1.4. Keep the
          # signing tool unchanged until a tag run has verified the new one (the signature
          # layout moved once before, with cosign v3).
          cosign-release: 'v3.0.6'

      - name: Prove cosign runs
        # The signing call itself needs a tag run's OIDC identity, so this
        # confirms the installer produced a working binary of the expected
        # major — the part the version bump can break.
        run: cosign version

  chart-toolchain:
    name: Helm chart toolchain (no push)
    runs-on: ubuntu-24.04
    # CI and every other action belong to the PUBLIC repository. The private
    # mirror carries the same .github/ tree, so without this it runs the whole
    # suite again on billable minutes and leaves that repo permanently red.
    if: github.repository == 'MSKazemi/novafabric'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.16.4

      - name: Lint chart
        run: helm lint deploy/helm/novafabric

      - name: Package chart
        # Mirrors publish-chart.yml. The real step derives the version from the
        # tag; a pull request has none, so a placeholder proves packaging works.
        run: |
          helm package deploy/helm/novafabric \
            --version 0.0.0-ci \
            --app-version 0.0.0-ci \
            --destination "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/novafabric-0.0.0-ci.tgz"

  image-gate:
    name: Image gate on fixtures (candidate scan, local registries only)
    runs-on: ubuntu-24.04
    # Runs the SAME composite gate and promotion script a release uses, against
    # synthetic fixtures, with a second local registry standing in for GHCR. It
    # proves the negative path on every pull request: a failing candidate leaves
    # the "production" registry empty.
    if: github.repository == 'MSKazemi/novafabric'
    timeout-minutes: 20
    services:
      candidate:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 127.0.0.1:5000:5000
      production:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 127.0.0.1:5001:5000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Build the three fixtures into the candidate registry
        id: fixtures
        run: |
          for f in clean vulnerable mixed; do
            docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --sbom=false \
              --metadata-file "$RUNNER_TEMP/$f.json" --push \
              -t "localhost:5000/gate-$f:candidate" "tests/fixtures/release_gate/$f"
            echo "$f=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/$f.json")" >> "$GITHUB_OUTPUT"
          done

      - name: Gate - clean fixture must pass
        uses: ./.github/actions/scan-candidate
        with:
          image-ref: localhost:5000/gate-clean@${{ steps.fixtures.outputs.clean }}

      - name: Clean fixture was really scanned on both platforms and has no finding
        run: |
          for arch in amd64 arm64; do
            test -f "trivy-report-$arch.txt" || { echo "::error::no $arch report"; exit 1; }
            ! grep -q "CVE-2024-45491" "trivy-report-$arch.txt" || { echo "::error::clean fixture has a finding on $arch"; exit 1; }
          done

      - name: Promote the clean fixture
        run: |
          python3 scripts/release_image.py promote \
            --src-repo localhost:5000/gate-clean --dest-repo localhost:5001/gate-clean \
            --digest "${{ steps.fixtures.outputs.clean }}" --stage-tag scanned \
            --platform linux/amd64 --platform linux/arm64

      - name: Gate - vulnerable fixture must FAIL
        id: vulnerable
        continue-on-error: true
        uses: ./.github/actions/scan-candidate
        with:
          image-ref: localhost:5000/gate-vulnerable@${{ steps.fixtures.outputs.vulnerable }}

      - name: Vulnerable fixture failed because of the finding, on both platforms
        # A gate that fails for any other reason (registry unreachable, scanner crash)
        # would pass the "must FAIL" check above for the wrong reason.
        run: |
          for arch in amd64 arm64; do
            grep -q "CVE-2024-45491" "trivy-report-$arch.txt" || { echo "::error::no finding on $arch"; exit 1; }
          done

      - name: Gate - arm64-only vulnerable fixture must FAIL
        id: mixed
        continue-on-error: true
        uses: ./.github/actions/scan-candidate
        with:
          image-ref: localhost:5000/gate-mixed@${{ steps.fixtures.outputs.mixed }}

      - name: Mixed fixture is vulnerable on arm64 only
        run: |
          grep -q "CVE-2024-45491" trivy-report-arm64.txt || { echo "::error::no arm64 finding"; exit 1; }
          ! grep -q "CVE-2024-45491" trivy-report-amd64.txt || { echo "::error::unexpected amd64 finding"; exit 1; }

      - name: Assert the negative path - failed gates, nothing promoted
        env:
          VULNERABLE: ${{ steps.vulnerable.outcome }}
          MIXED: ${{ steps.mixed.outcome }}
        run: |
          test "$VULNERABLE" = failure || { echo "::error::vulnerable fixture passed the gate"; exit 1; }
          test "$MIXED" = failure || { echo "::error::arm64-only fixture passed the gate"; exit 1; }
          repos=$(curl -fsS http://localhost:5001/v2/_catalog | jq -r '.repositories | sort | join(",")')
          test "$repos" = "gate-clean" || { echo "::error::production registry holds: $repos"; exit 1; }
