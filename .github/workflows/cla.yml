name: CLA Assistant

# NovaFabric stays Apache-2.0. This exists so copyright remains consolidated with one
# party, keeping future licensing decisions possible without tracing every past
# contributor. See CLA.md.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record CLA signature
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/MSKazemi/novafabric/blob/main/CLA.md'
          # Signatures live on a dedicated branch so they never clutter main.
          branch: 'cla-signatures'
          path-to-signatures: 'signatures/version1/cla.json'
          custom-notsigned-prcomment: |
            Thanks for the pull request — it is welcome, and nothing about it is blocked on code review.

            NovaFabric is Apache-2.0 and stays that way. The [CLA](https://github.com/MSKazemi/novafabric/blob/main/CLA.md) keeps copyright consolidated with one party so future licensing decisions stay possible without tracing every past contributor. **You keep the copyright in your work.**

            To sign, comment exactly:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: '✅ All contributors have signed the CLA. Thank you!'
          allowlist: MSKazemi,dependabot[bot],github-actions[bot],bot*
