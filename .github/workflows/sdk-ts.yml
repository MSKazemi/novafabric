name: SDK (TypeScript)

# Quality gates for the official TypeScript SDK (packages/nova-sdk-ts,
# @novafabric/sdk — ADR-0194). Mirrors the gates a contributor runs locally:
# install, strict type-check, vitest, and the OpenAPI type-drift gate.
#
# Path-scoped: runs only when the package changes OR when api/openapi.yaml
# changes — the latter so the regenerate-and-diff drift gate (ADR-0194 D1)
# fails whenever the contract moves without a matching `npm run generate:types`.
#
# NOTE: this workflow deliberately does NOT publish. Publication to npm is
# manual and happens from the PUBLIC repo only, in lockstep with the release
# tags (ADR-0194 D5); no publish automation touches this (private) repo.
on:
  push:
    branches: [main]
    paths:
      - "packages/nova-sdk-ts/**"
      - "api/openapi.yaml"
      - ".github/workflows/sdk-ts.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/nova-sdk-ts/**"
      - "api/openapi.yaml"
      - ".github/workflows/sdk-ts.yml"

# Cancel in-flight runs of the same ref when new commits land.
concurrency:
  group: sdk-ts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job here only reads the repository. Without this the
# token inherits the repository default (OpenSSF Scorecard TokenPermissions).
permissions:
  contents: read

jobs:
  sdk-ts:
    runs-on: ubuntu-latest
    # CI and every other action belong to the PUBLIC repository. The private
    # mirror carries the same .github/ tree, so without this it runs the whole
    # suite again on billable minutes and leaves that repo permanently red.
    if: github.repository == 'MSKazemi/novafabric'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # CI must satisfy the devDependency engines (vitest 5 needs
          # "^22.12.0 || ^24.0.0 || >=26.0.0"). This is deliberately NOT the
          # same as package.json "engines", which describes what a *consumer*
          # of the published SDK needs and stays at >=18.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/nova-sdk-ts/package-lock.json

      - name: Install dependencies
        working-directory: packages/nova-sdk-ts
        run: npm ci

      - name: Type check (tsc --noEmit)
        working-directory: packages/nova-sdk-ts
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        working-directory: packages/nova-sdk-ts
        run: npx vitest run

      - name: OpenAPI type-drift gate
        working-directory: packages/nova-sdk-ts
        run: npm run check:drift

      # Builds both entry points, then `require()`s the CommonJS output with
      # plain Node. Deliberately not a vitest assertion: vitest resolves
      # through its own bundler and would pass even if a real `require()`
      # broke on the "type": "module" boundary (ADR-0194 D5).
      - name: Dual ESM/CJS build + CommonJS consumption smoke test
        working-directory: packages/nova-sdk-ts
        run: npm run test:cjs

      - name: ESM consumption smoke test
        working-directory: packages/nova-sdk-ts
        run: node --input-type=module -e "import('./dist/index.js').then(m => { if (typeof m.NovaFabricClient !== 'function') { throw new Error('ESM entry missing NovaFabricClient'); } })"
