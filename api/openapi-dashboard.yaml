      - in: query
        name: since
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Since
      - in: query
        name: until
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Until
      - description: meta = run_id/command matching (default, unchanged); content = FTS5 search over redacted
          capsule text (ADR-0204, experimental); all = merged, content-ranked first
