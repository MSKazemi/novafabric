  /api/admin/tokens:
    get:
      description: 'List issued local tokens (stored in ~/.novafabric/tokens.jsonl).


        Bounded (ADR-0199): reads the append-only JSONL newest-first via

        ``audit.tail_lines`` (O(page) reverse scan), returning at most

        ``limit`` tokens plus an additive byte-offset ``next_cursor`` /

        ``truncated`` pair (same cursor contract as /api/audit). A revoke

        rewrites the file, which invalidates outstanding cursors — clients

        should restart from the first page after a mutation.'
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 200
          maximum: 2000
          minimum: 1
          title: Limit
          type: integer
      - description: Byte-offset cursor from a previous response's next_cursor
        in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          description: Byte-offset cursor from a previous response's next_cursor
          title: Cursor
      - in: query
        name: token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Tokens Endpoint Api Admin Tokens Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Tokens Endpoint
      x-nova-contract: pending
    post:
