          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      - description: Free-text search on run_id and command
        in: query
        name: q
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Free-text search on run_id and command
          title: Q
      - description: Filter by run status
