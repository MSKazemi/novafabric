components:
  schemas:
    ApproveRequest:
      properties:
        actor:
          default: dashboard
          title: Actor
          type: string
        confirmed:
          default: false
          title: Confirmed
          type: boolean
        note:
          default: ''
          title: Note
          type: string
        role:
          title: Role
          type: string
      required:
      - role
      title: ApproveRequest
      type: object
    AssignRoleRequest:
      properties:
        role:
          title: Role
          type: string
        subject:
          title: Subject
          type: string
      required:
      - subject
      - role
      title: AssignRoleRequest
      type: object
    AttributeRequest:
      description: '``{runs:[{run_id,status,cost}], productive_statuses?}`` — ``nova cost attribute``.'
      properties:
        productive_statuses:
          items:
            type: string
          title: Productive Statuses
          type: array
        runs:
          items:
            additionalProperties: true
            type: object
          title: Runs
          type: array
      required:
      - runs
      title: AttributeRequest
      type: object
    DryRunReplayRequest:
      properties:
        confirmed:
          default: false
          title: Confirmed
          type: boolean
      title: DryRunReplayRequest
      type: object
    ErasureRequestBody:
      additionalProperties: false
      description: 'ADR-0210: GDPR Art.17 erasure request (safe-mutations gated, extra=forbid).'
      properties:
        capsule_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Capsule Ids
        confirmed:
          default: false
          title: Confirmed
          type: boolean
        reason:
          default: gdpr_art_17
          title: Reason
          type: string
        subject_id:
          title: Subject Id
          type: string
      required:
      - subject_id
      title: ErasureRequestBody
      type: object
    EvalRequest:
      properties:
        confirmed:
          default: false
          title: Confirmed
          type: boolean
      title: EvalRequest
      type: object
    ExactReplayRequest:
      properties:
        confirmed:
          default: false
          title: Confirmed
          type: boolean
      title: ExactReplayRequest
      type: object
    ExportEvidenceRequest:
      properties:
        allow_unsafe_skips:
          default: false
          title: Allow Unsafe Skips
          type: boolean
        confirmed:
          default: false
          title: Confirmed
          type: boolean
        key_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Key Path
        output_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Path
      title: ExportEvidenceRequest
      type: object
    FairnessRequest:
      description: '``{totals: {dimension: {agent: total}}}`` — ``nova cost fairness``.'
      properties:
        totals:
          additionalProperties:
            additionalProperties:
              type: number
            type: object
          title: Totals
          type: object
      required:
      - totals
      title: FairnessRequest
      type: object
    ForensicReplayRequest:
      properties:
        confirmed:
          default: false
          title: Confirmed
          type: boolean
      title: ForensicReplayRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HoldCreatedResponse:
      properties:
        created_at:
          title: Created At
          type: string
        duration_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Days
        hold_id:
          title: Hold Id
          type: string
        reason:
          title: Reason
          type: string
        registry:
          title: Registry
          type: string
      required:
      - hold_id
      - registry
      - reason
      - created_at
      title: HoldCreatedResponse
      type: object
    HoldRecord:
      description: One legal hold as stored in ``holds.jsonl``.
      properties:
        created_at:
          title: Created At
          type: string
        duration_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Days
        hold_id:
          title: Hold Id
          type: string
        reason:
          title: Reason
          type: string
        registry:
          title: Registry
          type: string
        released_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Released At
      required:
      - hold_id
      - registry
      - reason
      - created_at
      title: HoldRecord
      type: object
    HoldReleasedResponse:
      properties:
        hold_id:
          title: Hold Id
          type: string
        registry:
          title: Registry
          type: string
        released:
          title: Released
          type: boolean
      required:
      - released
      - hold_id
      - registry
      title: HoldReleasedResponse
      type: object
    HoldsListResponse:
      properties:
        registries:
          items:
            $ref: '#/components/schemas/RegistryHolds'
          title: Registries
          type: array
        total_active:
          title: Total Active
          type: integer
      required:
      - total_active
      - registries
      title: HoldsListResponse
      type: object
    IssueTokenRequest:
      properties:
        confirmed:
          default: false
          title: Confirmed
          type: boolean
        label:
          default: dashboard-issued
          title: Label
          type: string
      title: IssueTokenRequest
      type: object
    MCPScanRequest:
      properties:
        manifest:
          additionalProperties: true
          title: Manifest
          type: object
        threshold:
          default: HIGH
          title: Threshold
          type: string
      required:
      - manifest
      title: MCPScanRequest
      type: object
    PlaceHoldRequest:
      properties:
        duration_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Days
        reason:
          title: Reason
          type: string
        registry:
          title: Registry
          type: string
      required:
      - registry
      - reason
      title: PlaceHoldRequest
      type: object
    PromoteRequest:
      properties:
        actor:
          default: dashboard
          title: Actor
          type: string
        confirmed:
          default: false
          title: Confirmed
          type: boolean
        force:
          default: false
          title: Force
          type: boolean
        to_status:
          title: To Status
          type: string
      required:
      - to_status
      title: PromoteRequest
      type: object
    QueryPanelRequest:
      description: '``{q, engine?}`` — ``q`` is a Capsule Query DSL document (JSON or YAML text).'
      properties:
        engine:
          anyOf:
          - type: string
          - type: 'null'
          title: Engine
        q:
          title: Q
          type: string
      required:
      - q
      title: QueryPanelRequest
      type: object
    RedactRequest:
      properties:
        confirmed:
          default: false
          title: Confirmed
          type: boolean
      title: RedactRequest
      type: object
    RegisterAssetRequest:
      properties:
        confirmed:
          default: false
          title: Confirmed
          type: boolean
        spec_yaml:
          title: Spec Yaml
          type: string
      required:
      - spec_yaml
      title: RegisterAssetRequest
      type: object
    RegistryHolds:
      properties:
        holds:
          items:
            $ref: '#/components/schemas/HoldRecord'
          title: Holds
          type: array
        name:
          title: Name
          type: string
      required:
      - name
      - holds
      title: RegistryHolds
      type: object
    RollbackRequest:
      properties:
        actor:
          default: dashboard
          title: Actor
          type: string
        confirmed:
          default: false
          title: Confirmed
          type: boolean
        reason:
          default: ''
          title: Reason
          type: string
      title: RollbackRequest
      type: object
    SemanticReplayRequest:
      properties:
        confirmed:
          default: false
          title: Confirmed
          type: boolean
      title: SemanticReplayRequest
      type: object
    UsageBreakdownRequest:
      description: '``{usage_totals: {...}}`` (or a bare usage-totals map) — ``nova cost usage-breakdown``.'
      properties:
        usage_totals:
          additionalProperties: true
          title: Usage Totals
          type: object
      required:
      - usage_totals
      title: UsageBreakdownRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  description: 'The NovaFabric dashboard (serve) API — the FROZEN local-dashboard surface

    (ADR-0183): serve/ migrates incrementally into the strategic /v0 server API;

    new integrations should prefer /v0 (api/openapi.yaml). This document exists

    so that surface is inventoried, authorizable (ADR-0228/0229), and migratable

    route-by-route — it is not an endorsement of new serve/ endpoints.

    Authentication: the shared dashboard token (Bearer header preferred; ?token=

    query accepted for SSE), loopback bind by default (ADR-0184).

    Operations marked x-nova-contract: pending are not yet annotated with an

    operationId + declared response schema; the set may only shrink (ADR-0240 D4).


    This file is GENERATED by scripts/gen_openapi_dashboard.py — do not edit it

    by hand. Regenerate after changing any serve route.'
  license:
    name: Apache-2.0
  title: NovaFabric Dashboard API (serve)
  version: 0.101.0
openapi: 3.1.0
paths:
  /:
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Serve No Dashboard  Get
                type: object
          description: Successful Response
      summary: Serve No Dashboard
      x-nova-contract: pending
  /api/adapters:
    get:
