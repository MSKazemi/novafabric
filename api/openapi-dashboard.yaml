              schema:
                additionalProperties: true
                title: Response Api Adapters Api Adapters Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Api Adapters
      x-nova-contract: pending
  /api/admin/api-keys:
