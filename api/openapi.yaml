  description: 'Multi-user REST API for the NovaFabric AI Asset Registry (ADR-0017
    / ADR-0029).

    URL prefix: /v0/ (the API major version; distinct from info.version below).

    Authentication: Bearer token via the Authorization header (OIDC or the

    auto-generated local token), or open when auth is disabled with the explicit,

    audited --insecure-no-auth flag (ADR-0184). /livez and /readyz are always open;

    /metrics is token-gated.

    All list endpoints use cursor-based pagination (limit + next_cursor).

    All error responses use the standard error envelope.


    This file is GENERATED from the server app by scripts/gen_openapi.py — do not

    edit it by hand. Regenerate after changing any server route.'
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: NovaFabric Multi-User REST API
  version: 0.63.0
