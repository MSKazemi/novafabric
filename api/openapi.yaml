  /v0/capsules/{run_id}/scores:
    post:
      description: 'Append one externally-computed score to the capsule''s ``scores.jsonl``.


        ADR-0119 D2: the same validation core as the local SDK/CLI, exposed over the

        v0.7 REST API. Append-only and fail-closed (a rejection writes nothing);

        idempotent by ``score_id`` (identical replay → 200, no second line). The

        ``scores:write`` capability maps to the ``writer`` role in the shipped RBAC

        model; the authenticated principal is recorded in the ``submission`` block
        so

        *who submitted* stays distinguishable from *what evaluator produced the value*.'
      operationId: submitCapsuleScore
      parameters:
      - in: path
        name: run_id
        required: true
        schema:
          title: Run Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              description: 'The submission envelope (POST body / SDK argument shape).


                Wire contract: ``schemas/score-submission-request.schema.json``. Unknown
                keys

                are rejected (closed schema).'
              properties:
                created_at:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Created At
                eval_card_digest:
                  title: Eval Card Digest
                  type: string
                evaluator_id:
                  minLength: 1
                  title: Evaluator Id
                  type: string
                name:
                  minLength: 1
                  title: Name
                  type: string
                run_id:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Run Id
                score_id:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Score Id
                significance:
                  anyOf:
                  - additionalProperties: false
                    description: Optional ADR-0080 significance context carried on
                      a score (requirement 7).
                    properties:
                      ci_high:
                        title: Ci High
                        type: number
                      ci_low:
                        title: Ci Low
                        type: number
                      confidence:
                        maximum: 1.0
                        minimum: 0.0
                        title: Confidence
                        type: number
                      method:
                        pattern: ^(wilson|sprt)$
                        title: Method
                        type: string
                    required:
                    - method
                    - ci_low
                    - ci_high
                    - confidence
                    title: SignificanceBlock
                    type: object
                  - type: 'null'
                source:
                  description: 'Provenance of a score (requirement 1, NF-010).


                    ``heuristic`` and ``code`` scorers run offline on stored capsules
                    at zero token

                    cost; only ``judge`` scorers may spend tokens, and only on sampled
                    subjects.'
                  enum:
                  - human
                  - heuristic
                  - code
                  - judge
                  title: ScoreSource
                  type: string
                subject:
                  title: Subject
                  type: string
                subject_kind:
                  default: span
                  title: Subject Kind
                  type: string
                supersedes:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Supersedes
                value:
                  anyOf:
                  - type: boolean
                  - type: number
                  - type: string
                  title: Value
                value_type:
                  description: The type of a score value (requirement 1).
                  enum:
                  - boolean
                  - categorical
                  - numeric
                  title: ScoreValueType
                  type: string
              required:
              - name
              - value
              - value_type
              - source
              - evaluator_id
              - subject
              - eval_card_digest
              title: ScoreSubmissionRequest
              type: object
        description: The externally-computed evaluation record to append (ADR-0119).
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreSubmissionResult'
          description: Idempotent replay — `score_id` was already present with an
            identical body, so no second line was appended. The body is the same as
            the 201; only the status differs.
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreSubmissionResult'
          description: Score appended.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid request parameters or body.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing or invalid bearer token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated but not permitted (missing role).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: The requested resource does not exist.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: The request conflicts with the current state of the resource.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Append an externally-computed score to a capsule
      tags:
      - capsules
