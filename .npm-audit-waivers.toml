# npm-audit waiver file (ADR-0186 discipline, extended to the npm trees).
#
# One file for all three publicly tracked npm lockfiles (ui/dashboard/,
# packages/nova-dashboard/, packages/nova-sdk-ts/). CI reads this file
# (.github/workflows/npm-audit.yml -> scripts/npm_audit_gate.py):
#
#   - a waived advisory does not block CI, until the waiver expires;
#   - an EXPIRED waiver fails CI by construction — waivers cannot rot into
#     permanence;
#   - a malformed entry fails CI; it is never silently skipped.
#
# Same schema as .pip-audit-waivers.toml, parsed by the same code:
#   id            — the GHSA id (GHSA-....-....-....)
#   justification — why this is acceptable for now
#   expires       — ISO date (YYYY-MM-DD); the waiver's last valid day.

[[waiver]]
id = "GHSA-jmr9-qjv8-65gv"
justification = "extract-zip symlink path traversal, reached only through the @lhci/cli -> lighthouse -> puppeteer dev-only chain in ui/dashboard/ (Lighthouse perf checks; never in a build artifact or production path). No fixed version exists upstream as of 2026-09-04: extract-zip 2.0.1 and @lhci/cli 0.15.1 are both the latest releases and both flagged; npm's only offered 'fix' is a downgrade to @lhci/cli 0.12.0. Exposure requires lhci extracting a malicious Chrome archive, i.e. a compromised Google CDN. Re-check upstream at expiry."
expires = "2026-11-04"

[[waiver]]
id = "GHSA-7pqw-9j4j-h8q3"
justification = "extract-zip arbitrary file write via symlink archive entries — the twin advisory to GHSA-jmr9-qjv8-65gv: same package, same version (2.0.1), same dev-only chain (@lhci/cli -> lighthouse -> puppeteer-core -> @puppeteer/browsers -> extract-zip), never in a build artifact or production path. Verified 2026-09-09: the advisory range is `<= 2.0.1` and 2.0.1 is the LAST version extract-zip ever published, so no fixed version exists to upgrade to; @lhci/cli 0.15.1 is already the latest release. npm reports `fixAvailable` as a semver-MAJOR DOWNGRADE to @lhci/cli 0.12.0, which is not a fix. Upstream has resolved this only in @puppeteer/browsers 3.x, which replaced extract-zip with modern-tar; lighthouse 12.6.1 still pins @puppeteer/browsers 2.13.2, so the fix reaches this tree when lighthouse bumps, not by any change we can make here. Exposure requires lhci extracting a malicious Chrome archive, i.e. a compromised Google CDN. Re-check upstream at expiry."
expires = "2026-11-04"

[[waiver]]
id = "GHSA-c475-qrg2-pj4r"
justification = "basic-ftp quadratic-time CPU DoS in Client.list() (Unix directory-listing parser), reached only through the dev-only @lhci/cli -> proxy-agent -> pac-proxy-agent -> get-uri chain in ui/dashboard/ (lockfile marks basic-ftp 5.3.1 and get-uri 6.0.5 `dev: true`; never in a build artifact or production path). Verified 2026-10-09: the advisory covers <=6.2.0 and the only fixed release is 6.2.2, but the newest get-uri (8.0.1) still declares basic-ftp ^5.3.1, so no upgrade reaches the patched major; npm's only offered fix is `audit fix --force`, a semver-major change to @lhci/cli. Exposure needs lhci's proxy-agent to FTP-list a hostile server, which the Lighthouse perf checks never do. Re-check upstream (get-uri moving to basic-ftp 6) at expiry."
expires = "2026-11-04"

[[waiver]]
id = "GHSA-mrhx-c7xc-m3w5"
justification = "zod memory exhaustion on oversized constrained collections (HIGH, range <4.6.6), reached only through the dev-only @lhci/cli -> lighthouse -> puppeteer-core -> chromium-bidi chain in ui/dashboard/ (lockfile marks chromium-bidi's nested zod 3.25.76 `dev: true`; the app's own zod is 4.6.7, outside the range; never in a build artifact or production path). Verified 2026-10-23: no zod 3.x fix exists; chromium-bidi moved to zod ^4.6.5 only in its 157+/158 line, which reaches us through puppeteer-core 25 -> lighthouse 13, but the latest @lhci/cli (0.15.1) still pins lighthouse 12.6.1; npm's only offered fix is a semver-major downgrade to @lhci/cli 0.13.0. Exposure needs chromium-bidi to validate a hostile oversized BiDi message, which the Lighthouse perf checks (CDP, local build) do not. Re-check upstream (@lhci/cli moving to lighthouse 13) at expiry."
expires = "2026-11-04"
