# dev-only @lhci/cli 0.15.1 -> 0.16.1 (lighthouse 12.6.1 -> 13.6.0), checked
# against each advisory's first_patched_version from the GitHub advisory API:
#   GHSA-jmr9-qjv8-65gv, GHSA-7pqw-9j4j-h8q3  extract-zip <=2.0.1, no patched
#       version; removed from the tree (@puppeteer/browsers 3.2.7 uses modern-tar)
#   GHSA-c475-qrg2-pj4r  basic-ftp, first patched 6.2.1; now 6.2.6 (via get-uri 8.0.2)
#   GHSA-mrhx-c7xc-m3w5  zod, first patched 4.6.6; chromium-bidi 157 now dedupes
